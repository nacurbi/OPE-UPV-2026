<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema32</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>Tema 32. El registro general de la UPV/EHU:</strong> Solicitudes, copias, compulsas y expediente administrativo electrónico.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "76. SEGÚN EL ARTÍCULO 27 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LAS COPIAS AUTENTICADAS REALIZADAS POR UNA ADMINISTRACIÓN PÚBLICA.",
    "options": [
      "a) Surten únicamente efectos administrativos",
      "b) No tendrán ningún efecto administrativo",
      "c) Únicamente tendrán validez en la misma Administración que ha realizado la autenticación",
      "d) Tendrán validez en las restantes Administraciones, siempre que así lo hayan acordado por Resolución del órgano competente"
    ],
    "correct": 0
  },
  {
    "question": "257. LOS CANALES DE ASISTENCIA PARA EL ACCESO A SERVICIOS ELECTRÓNICOS TIENEN COMO FINALIDAD:",
    "options": [
      "a) Sustituir todos los trámites.",
      "b) Ayudar a las personas en el uso de medios electrónicos.",
      "c) Realizar funciones judiciales.",
      "d) Gestionar únicamente sanciones"
    ],
    "correct": 1
  },
  {
    "question": "272. ¿CUAL DE LOS SIGUIENTES DOCUMENTOS UTILIZA LA CIUDADANÍA PARA HACER PETICIONES A LA ADMINISTRACIÓN?",
    "options": [
      "a) Circular",
      "b) Notificación",
      "c) Instancia",
      "d) Oficio"
    ],
    "correct": 2
  },
  {
    "question": "273. ¿EN CÚAL DE LOS SIGUIENTES DOCUMENTOS TIENE QUE CONSTAR LA FECHA?",
    "options": [
      "a) Instancia",
      "b) Notificación",
      "c) Certificación",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "274. EN LAS ACTAS SE CONSIGNA LA SIGUIENTE INFORMACIÓN EN RELACIÓN A LAS REUNIONES:",
    "options": [
      "a) Día de la reunión",
      "b) Lugar de la reunión",
      "c) Hora de finalización de la reunión",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "281. INDIQUE LA OPCIÓN CORRECTA:",
    "options": [
      "a) Los registros electrónicos se regirán a efectos de cómputo de los plazos imputables tanto a los interesados como a las Administraciones Públicas por la fecha y hora del sistema operativo utilizado por la persona usuaria, siempre que dicho sistema cuente con la licencia de uso correspondiente.",
      "b) Los registros electrónicos permitirán la presentación de solicitudes, escritos y comunicaciones todos los días del año durante las veinticuatro horas, salvo que la Administración titular del correspondiente registro, en uso de sus competencias, pueda establecer restricciones de acceso en días festivos nacionales.",
      "c) A los efectos del cómputo de plazo fijado en días hábiles o naturales, y en lo que se refiere a cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá siempre realizada en la primera hora del primer día hábil siguiente.",
      "d) La opción inicial que tiene los ciudadanos de comunicarse por unos u otros medios con la Administración Pública, no le vincula en el desarrollo del procedimiento y, por ende, podrá, en cualquier momento, optar por un medio distinto del inicialmente elegido."
    ],
    "correct": 3
  },
  {
    "question": "301. EN EL ÁMBITO DE ATENCIÓN AL CIUDADANO/A, LA FORMA EN QUE LA ADMINISTRACIÓN TRANSMITE AL CIUDADANO/A LA DOCUMENTACIÓN PRECISA:",
    "options": [
      "a) Sólo pueden realizarse en soporte papel.",
      "b) Puede ser transmitida en soporte papel o bien por medios electrónicos o telemáticos.",
      "c) Siempre necesita ser ratificada telefónicamente.",
      "d) Sólo se trasmite por medios electrónicos o telemáticos."
    ],
    "correct": 1
  },
  {
    "question": "315. EL IMPUESTO SOBRE EL VALOR AÑADIDO:",
    "options": [
      "a) Es un tributo de naturaleza directa que recae sobre el consumo.",
      "b) Es un tributo de naturaleza indirecta que recae sobre el consumo.",
      "c) Es un tributo de naturaleza directa que grava, entre otros, los premios de la Lotería Nacional.",
      "d) Es un tributo de naturaleza indirecta que grava los intereses de cuentas bancarias."
    ],
    "correct": 1
  },
  {
    "question": "316. ¿QUÉ ES EL ALBARÁN?",
    "options": [
      "a) Es un documento que acredita la recepción de un pedido.",
      "b) El documento elaborado por el receptor de la mercancía.",
      "c) El documento de pago que sustituye al cheque confirmado.",
      "d) Ninguna respuesta es correcta."
    ],
    "correct": 0
  },
  {
    "question": "317. ENTRE OTRAS, ¿QUÉ INFORMACIÓN HA DE INCLUIR EL ALBARÁN?",
    "options": [
      "a) Número de orden, Fecha de emisión y número de factura.",
      "b) Fecha de emisión, Nombre de parte emisora y receptora, NIF y domicilio.",
      "c) Número de la factura, producto, Número y fecha del pedido",
      "d) Número de orden, Fecha de emisión, Datos de parte emisora y receptora, Número y fecha del pedido, producto, cantidad."
    ],
    "correct": 3
  },
  {
    "question": "318. SEÑALE LA DIFERENCIA, ENTRE OTRAS, QUE EXISTE ENTRE LA FACTURA Y EL ALBARÁN:",
    "options": [
      "a) La factura la emite la parte compradora y el albarán la vendedora.",
      "b) La emisión del albarán es obligatoria, mientras que la de la factura no.",
      "c) La emisión del albarán no es obligatoria, mientras que la de la factura sí.",
      "d) Todas las respuestas son correctas."
    ],
    "correct": 2
  },
  {
    "question": "319. EL PEDIDO, ES PARTE DEL FLUJO ADMINISTRATIVO DEL STOCK, Y SE DEFINE…",
    "options": [
      "a) Como la solicitud que realiza un/a empresario/a o profesional a un/a proveedor/a para que le suministre unas determinadas mercancías o le preste un servicio.",
      "b) Como el parte de trabajo que realiza el cliente al proveedor.",
      "c) Es el documento mercantil que acompaña a la factura de abono.",
      "d) Ninguna respuesta es correcta."
    ],
    "correct": 0
  },
  {
    "question": "320. LA RECEPCIÓN DE MERCANCÍAS DEBE SER:",
    "options": [
      "a) Cualitativa, comprobando que la cantidad recibida es la pedida.",
      "b) Cuantitativa, comprobando que lo pedido es lo recibido.",
      "c) Cuantitativa y cualitativa.",
      "d) Estas no son características de la recepción de las mercancías."
    ],
    "correct": 2
  },
  {
    "question": "399. ¿QUÉ ES UN INVENTARIO?",
    "options": [
      "a) Es una nota de entrega",
      "b) Es un tipo de pedido",
      "c) Es un resumen de las mercancías almacenadas",
      "d) Es un tipo de envase"
    ],
    "correct": 2
  },
  {
    "question": "454. INDIQUE LA QUE NO SE CORRESPONDE CON UNA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS:",
    "options": [
      "a) Documentos administrativos de decisiones.",
      "b) Documentos administrativos de transmisión.",
      "c) Documentos administrativos de constancia.",
      "d) Documentos administrativos de petición."
    ],
    "correct": 3
  },
  {
    "question": "455. INDIQUE EL DOCUMENTO QUE NO ES CONSIDERADO DE TRANSMISIÓN:",
    "options": [
      "a) El oficio",
      "b) La instancia",
      "c) La nota",
      "d) La carta"
    ],
    "correct": 1
  },
  {
    "question": "456. INDIQUE DE LAS SIGUIENTES AFIRMACIONES LA QUE ES PROPIA DE LOS DOCUMENTOS DE APOYO INFORMATIVO.",
    "options": [
      "a) Serán destruidos en la propia oficina donde se generan.",
      "b) Pasarán al Registro General (separadamente de los documentos de archivo) para su destrucción de forma segura y confidencial.",
      "c) Forman parte del Patrimonio Documental de la Universidad.",
      "d) La nota es considerada como documento de apoyo informativo."
    ],
    "correct": 0
  },
  {
    "question": "461. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN CERTIFICADO?",
    "options": [
      "a) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a un mismo órgano superior o entidad.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que contiene comunicaciones de tipo personal y de contenido general, que no estén relacionadas directamente con la gestión habitual o con la tramitación de un procedimiento.",
      "d) El documento acreditativo de hechos, circunstancias, juicios o acuerdos."
    ],
    "correct": 1
  },
  {
    "question": "462. LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU ES:",
    "options": [
      "a) Decisiones, documentos de apoyo a la gestión administrativa, documentos administrativos de transmisión y documentos administrativos de constancia",
      "b) Decisiones, documentos de apoyo a la gestión administrativa y documentos administrativos de constancia",
      "c) Resoluciones, oficios, actas y certificados",
      "d) Decisiones, documentos administrativos de transmisión y documentos administrativos de constancia."
    ],
    "correct": 3
  },
  {
    "question": "463. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN ACTA?",
    "options": [
      "a) El documento acreditativo de hechos, circunstancias, juicios o acuerdos.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a diferentes administraciones públicas",
      "d) El documento que contiene una declaración de voluntad de un órgano administrativo sobre materias de su competencia"
    ],
    "correct": 0
  },
  {
    "question": "466. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN OFICIO?",
    "options": [
      "a) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a un mismo órgano superior o entidad.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a diferentes administraciones públicas, a diferentes entidades o departamentos y, dentro de éstos, a diferentes órganos superiores",
      "d) El documento que contiene una declaración de voluntad de un órgano administrativo sobre materias de su competencia"
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
