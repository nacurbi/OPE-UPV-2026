<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 7 (preguntas 91-105)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "91. DE CONFORMIDAD CON EL ARTÍCULO 178 LA LEY 11/2022, DE 1 DE DICIEMBRE DE EMPLEO PÚBLICO VASCO, SE CONSIDERAN FALTAS MUY GRAVES:",
    "options": [
      "a) La falta grave de consideración con los/as administrados/as.",
      "b) Cualquier actuación que suponga discriminación por razón de origen racial o étnico, religión o convicciones, discapacidad, edad, orientación sexual, lengua, opinión, lugar de nacimiento o vecindad, sexo, o cualquier otra condición o circunstancia personal o social.",
      "c) El incumplimiento de las órdenes o instrucciones de los/as superiores jerárquicos/as referidas al servicio.",
      "d) Originar o tomar parte en altercados en el centro de trabajo."
    ],
    "correct": 1
  },
  {
    "question": "92. DE CONFORMIDAD CON EL ARTÍCULO 179 LA LEY 11/2022, DE 1 DE DICIEMBRE DE EMPLEO PÚBLICO VASCO, SE CONSIDERAN FALTAS GRAVES:",
    "options": [
      "a) El abandono del servicio",
      "b) La adopción de resoluciones o acuerdos manifiestamente ilegales que causen grave perjuicio a la Administración o a los/as ciudadanos/as",
      "c) EL abuso de autoridad en el ejercicio del puesto de trabajo",
      "d) La falta de asistencia injustificada de un día"
    ],
    "correct": 2
  },
  {
    "question": "93. DE CONFORMIDAD CON EL ARTÍCULO 180 LA LEY 11/2022, DE 1 DE DICIEMBRE DE EMPLEO PÚBLICO VASCO, SON FALTAS LEVES:",
    "options": [
      "a) El incumplimiento injustificado del horario de trabajo, cuando no suponga falta grave",
      "b) La falta de asistencia injustificada de un día.",
      "c) No proporcionar a la ciudadanía la información debida, siempre que sea de la competencia de la unidad en la que presta sus funciones.",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "94. DE ACUERDO CON LA LEY 11/2022, DE 1 DE DICIEMBRE DE EMPLEO PÚBLICO VASCO, ES PERSONAL LABORAL EL QUE EN VIRTUD DE:",
    "options": [
      "a) Contrato de trabajo formalizado por escrito presta servicios retribuidos por las Administraciones Públicas Vascas.",
      "b) Contrato de trabajo formalizado por escrito o de forma verbal presta servicios retribuidos por las Administraciones Públicas Vascas.",
      "c) Nombramiento presta servicios retribuidos por las Administracion es Públicas Vascas.",
      "d) Ninguna respuesta es correcta."
    ],
    "correct": 0
  },
  {
    "question": "95. DE ACUERDO CON LA LEY 11/2022, DE 1 DE DICIEMBRE DE EMPLEO PÚBLICO VASCO, NO ES UNA SITUACIÓN ADMINISTRATIVA:",
    "options": [
      "a) El servicio activo.",
      "b) La suspensión.",
      "c) La jubilación.",
      "d) El servicio en otras Administraciones Públicas."
    ],
    "correct": 2
  },
  {
    "question": "96. EL EXAMEN Y RESOLUCIÓN DE CUESTIONES DERIVADAS DE LA INTERPRETACIÓN DEL III CONVENIO DEL PERSONAL LABORAL DE ADMINISTRACIONES Y SERVICIOS DE LA EHU CORRESPONDE A:",
    "options": [
      "a) La Comisión Paritaria",
      "b) La Comisión Negociadora",
      "c) El Comité de Empresa",
      "d) La Comisión de Planificación"
    ],
    "correct": 0
  },
  {
    "question": "97. EL SERVICIO DE PREVENCIÓN DE LA EHU ES:",
    "options": [
      "a) Un servicio propio",
      "b) Un servicio ajeno",
      "c) Un servicio asumido personalmente por el empresario",
      "d) Un servicio mediante trabajador designado"
    ],
    "correct": 0
  },
  {
    "question": "98. LA EHU EN EL ARTÍCULO 5.3 DE SUS ESTATUTOS RECONOCE Y GARANTIZA:",
    "options": [
      "a) La libertad de expresión",
      "b) La libertad religiosa",
      "c) La libertad de cátedra",
      "d) La libertad de pensamiento"
    ],
    "correct": 2
  },
  {
    "question": "99. LA COMUNIDAD UNIVERSITARIA ESTÁ FORMADA POR LOS SIGUIENTES COLECTIVOS:",
    "options": [
      "a) Alumnado, personal docente e investigador y personal  técnico, de gestión y administración y servicios",
      "b) Alumnado y trabajadores/as autónomos/as",
      "c) Personal docente e investigador y personal técnico, de gestión y administración y servicios",
      "d) Alumnado, trabajadores/as autónomos/as y cargos directivos"
    ],
    "correct": 0
  },
  {
    "question": "100. SEGÚN LOS ESTATUTOS DE LA EHU, EL RÉGIMEN RETRIBUTIVO DEL PERSONAL TÉCNICO DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS LO ESTABLECERÁ:",
    "options": [
      "a) El Rector o Rectora",
      "b) El Claustro Universitario",
      "c) El Comité de Empresa",
      "d) El Consejo de Gobierno"
    ],
    "correct": 3
  },
  {
    "question": "101. SEGÚN LOS ESTATUTOS DE LA EHU, EL PERSONAL LABORAL SE CLASIFICARÁ CONFORME A:",
    "options": [
      "a) Los acuerdos de las Juntas de Centro",
      "b) Su convenio colectivo en vigor",
      "c) La Ley de la Función Pública Vasca",
      "d) El Estatuto Básico del Empleado Público"
    ],
    "correct": 1
  },
  {
    "question": "102. LAS RECOMENDACIONES DEL O DE LA ALDEZLE SERÁN SUSCEPTIBLES DE RECURSO:",
    "options": [
      "a) Si el Rector o Rectora es parte implicada",
      "b) No serán susceptibles de recurso",
      "c) Siempre serán susceptibles de recurso",
      "d) Cuando afecten a un grupo numeroso de la comunidad universitaria"
    ],
    "correct": 1
  },
  {
    "question": "103. LA BIBLIOTECA UNIVERSITARIA ES UN CENTRO DE RECURSOS PARA LA DOCENCIA, EL APRENDIZAJE, LA INVESTIGACIÓN Y LAS ACTIVIDADES RELACIONADAS CON:",
    "options": [
      "a) El funcionamiento y la gestión de la universidad en su conjunto",
      "b) El desarrollo de la capacidad de estudio del alumnado",
      "c) La capacidad investigadora del personal docente",
      "d) El servicio a la sociedad en su conjunto"
    ],
    "correct": 0
  },
  {
    "question": "104. SEGÚN LOS ESTATUTOS DE LA EHU, LAS BASES DE LAS CONVOCATORIAS DE PRUEBAS SELECTIVAS PARA EL ACCESO A LA CONDICIÓN DE PERSONAL FUNCIONARIO O PERSONAL CONTRATADO LABORAL FIJO AL SERVICIO DE LA EHU DEBERÁ CONTENER NECESARIAMENTE:",
    "options": [
      "a) Los requisitos que deben reunir los y las aspirantes",
      "b) Los nombres y apellidos de los miembros del tribunal",
      "c) Las dotaciones objeto de la convocatoria",
      "d) La fecha de publicación de los resultados"
    ],
    "correct": 0
  },
  {
    "question": "105. EL ÓRGANO DE REPRESENTACIÓN UNITARIA DEL PERSONAL TÉCNICO DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS FUNCIONARIO ES:",
    "options": [
      "a) La Junta de Personal técnico, de gestión y administración y servicios",
      "b) El Comité de Empresa",
      "c) El Consejo de Gobierno",
      "d) El Claustro Universitario"
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
