<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 17 (preguntas 235-248)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 17 (preguntas 235-248)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "235. (SEÑALE LA RESPUESTA CORRECTA). EN LA INSTITUCIÓN, CONTARÁN CON UNA INSTALACIÓN DE ALUMBRADO DE EMERGENCIA:",
    "options": [
      "a) Todos los recintos cuya ocupación sea mayor de 50 personas",
      "b) Los aseos de planta en edificios de acceso público",
      "c) Las escaleras y pasillos protegidos",
      "d) Los almacenes de productos farmacológicos y depósitos de residuos y basuras"
    ],
    "correct": 2
  },
  {
    "question": "236. EN LOS SISTEMAS DE ALARMA, LAS SIGLAS “AT” CORRESPONDEN A:",
    "options": [
      "a) Aparatos de tensión",
      "b) Apertura tipo",
      "c) Alta tensión",
      "d) Acometida de transporte"
    ],
    "correct": 2
  },
  {
    "question": "237. CUANDO LOS PLAZOS SE SEÑALEN POR DÍAS, SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, EN SU CÓMPUTO HABRÁ QUE EXCLUIR:",
    "options": [
      "a) Los domingos",
      "b) Los declarados festivos",
      "c) Los sábados",
      "d) Los sábados, los domingos y los declarados festivos"
    ],
    "correct": 3
  },
  {
    "question": "238. EN LAS NORMAS Y ACTOS ADMINISTRATIVOS, SI EL PLAZO DE FIJA EN MESES, SE COMPUTARÁ:",
    "options": [
      "a) De fecha a fecha, a partir del mismo día de la notificación o publicación",
      "b) 30 días naturales",
      "c) 30 días hábiles",
      "d) A partir del día siguiente al de la notificación o publicación del acto de que se trate"
    ],
    "correct": 3
  },
  {
    "question": "239. SI EL ÚLTIMO DÍA DE UN PLAZO ADMINISTRATIVO ES INHÁBIL:",
    "options": [
      "a) El plazo expira el día anterior",
      "b) El día en cuestión se entiende hábil a los solos efectos de ese trámite",
      "c) El plazo se entiende prorrogado al primer día hábil siguiente",
      "d) No puede darse este supuesto."
    ],
    "correct": 2
  },
  {
    "question": "240. LOS PLAZOS ADMINISTRATIVOS EXPRESADOS EN DÍAS SE CUENTA, POR REGLA GENERAL, A PARTIR DE:",
    "options": [
      "a) El mismo día de la notificación o publicación",
      "b) El día siguiente al de la notificación o publicación del acto de que se trate.",
      "c) El mismo día de la notificación siempre que éste sea hábil",
      "d) El primer día hábil del mes siguiente"
    ],
    "correct": 1
  },
  {
    "question": "241. LOS ACTOS ADMINISTRATIVOS PRODUCEN EFECTOS DESDE LA FECHA EN QUE SE DICTEN, SIN EMBARGO, SU EFICACIA QUEDARÁ DEMORADA:",
    "options": [
      "a) Cuando sea necesaria la notificación o publicación del acto, supuesto en el cual el acto no será eficaz hasta que se realice correctamente la notificación o publicación.",
      "b) Cuando el destinatario del acto no esté de acuerdo con su contenido.",
      "c) Cuando produzcan efectos desfavorables para la persona interesada.",
      "d) Los actos administrativos siempre son eficaces desde que se dictan, sin que tal eficacia pueda quedar demorada en ningún caso."
    ],
    "correct": 0
  },
  {
    "question": "242. SI EL PLAZO SE FIJA EN MESES Y EN EL MES DE VENCIMIENTO NO HUBIERA DÍA EQUIVALENTE A AQUÉL EN EL QUE COMIENZA EL CÓMPUTO, SE ENTENDERÁ QUE EL PLAZO EXPIRA:",
    "options": [
      "a) A los 30 días de haberse notificado o publicado el acto",
      "b) A los 31 días de haberse notificado o publicado el acto",
      "c) El último día del mes de vencimiento",
      "d) El primer día hábil siguiente al del mes de vencimiento"
    ],
    "correct": 2
  },
  {
    "question": "243. SI LA SOLICITUD DE INICIACIÓN DEL PROCEMIENTO ADMINISTRATIVO NO REÚNE LOS REQUISITOS EXIGIBLES, LA ADMINISTRACIÓN DEBE:",
    "options": [
      "a) Archivar la solicitud",
      "b) Requerir a la persona interesada para que la subsane",
      "c) Requerir a la persona interesada para que formule una nueva que reúna todos los requisitos",
      "d) Sancionar a la persona interesada"
    ],
    "correct": 1
  },
  {
    "question": "244. DE CONFORMIDAD CON LO ESTABLECIDO EN EL ARTÍCULO 35 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, HAN DE SER MOTIVADOS:",
    "options": [
      "a) Los actos que resuelvan recursos administrativos.",
      "b) Los actos que limiten derechos o intereses legítimos.",
      "c) Los actos que se separen del criterio seguido en actuaciones precedentes.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "245. LAS NOTIFICACIONES DE LOS ACTOS ADMINISTRATIVOS DEBERÁN CONTENER:",
    "options": [
      "a) El texto íntegro del acto o resolución",
      "b) Un resumen detallado del acto o resolución",
      "c) La parte del acto o resolución que pueda afectar a quien se notifica",
      "d) Únicamente es necesario que contenga el recurso que se puede interponer contra el acto notificado."
    ],
    "correct": 0
  },
  {
    "question": "246. SI UN/A INTERESADO/A RECHAZA LA NOTIFICACIÓN DE UN ACTO ADMINISTRATIVO:",
    "options": [
      "a) Se le intentará notificar nuevamente, dentro de los 3 días siguientes, a una hora distinta",
      "b) Se dará por efectuado el trámite y se continuará el procedimiento",
      "c) Se le publicará en el Boletín Oficial del Estado, de la Comunidad Autónoma o de la Provincia, según cuál sea la Administración de la que procede el acto a notificar",
      "d) Se le hará por medio de edicto en el tablón de anuncios del Ayuntamiento de su último domicilio."
    ],
    "correct": 1
  },
  {
    "question": "247. SE DEBERÁN NOTIFICAR LAS RESOLUCIONES Y ACTOS ADMINISTRATIVOS A:",
    "options": [
      "a) Todos/as los/as administrados/as",
      "b) Las personas interesadas cuyos derechos e intereses se vean afectados por dichos actos y resoluciones",
      "c) Quién previamente lo haya solicitado",
      "d) Los/as funcionarios/as de la Administración que han dictado el acto"
    ],
    "correct": 1
  },
  {
    "question": "248. LAS NOTIFICACIONES DE UN ACTO ADMINISTRATIVO SE HARÁ EN UN BOLETÍN OFICIAL CUANDO:",
    "options": [
      "a) Los/as interesados/as sean desconocidos/as.",
      "b) Se ignore el lugar donde ha de practicarse la notificación",
      "c) Se ha intentado la notificación, pero no se ha podido practicar.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
