<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 14 (preguntas 193-206)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 14 (preguntas 193-206)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "193. ¿QUE ES UNA INTRANET?",
    "options": [
      "a) Es una red privada ubicada en Internet a la que sólo pueden acceder un grupo de usuarios/as cumpliendo unas condiciones determinadas",
      "b) Es una red privada y clandestina ubicada en Internet",
      "c) Es una red privada dentro de una compañía u organización que proporciona herramientas de Internet",
      "d) Ninguna de las anteriores"
    ],
    "correct": 2
  },
  {
    "question": "194. EL TÉRMINO “MULTIMEDIA” ESTÁ ASOCIADO:",
    "options": [
      "a) Al manejo exclusivo de texto",
      "b) Al manejo exclusivo de texto y gráficos",
      "c) Al manejo exclusivo de texto, gráficos e imagen",
      "d) Al manejo de texto, gráficos, imagen y sonido"
    ],
    "correct": 3
  },
  {
    "question": "195. ¿QUÉ SIGNIFICADO TIENE EL QUE UNA HERRAMIENTA SEA MULTIPLATAFORMA?:",
    "options": [
      "a) Que puede correr en máquinas con múltiples procesadores",
      "b) Que es independiente del hardware y del Sistema Operativo de la máquina en la que se ejecuta",
      "c) Que puede realizar funciones de procesador de texto y hoja de cálculo simultáneamente",
      "d) Que ha evolucionado a lo largo de los años y por ello se dispone de varias versiones del producto"
    ],
    "correct": 1
  },
  {
    "question": "196. EN EL PAQUETE OFIMÁTICO MICROSOFT OFFICE LA HERRAMIENTA DE BASE DE DATOS ES:",
    "options": [
      "a) Access",
      "b) Word",
      "c) Excel",
      "d) Outlook"
    ],
    "correct": 0
  },
  {
    "question": "197. LA HERRAMIENTA “POWER POINT” LA RELACIONARÍA PRINCIPALMENTE CON:",
    "options": [
      "a) Exposiciones y presentaciones",
      "b) Control de agendas",
      "c) Elaboración de gráficos",
      "d) Correo electrónico"
    ],
    "correct": 0
  },
  {
    "question": "198. UNA DE LAS FUNCIONALIDADES COMUNES A LA MAYOR PARTE DE PRODUCTOS OFIMÁTICOS ES LA DISPONIBILIDAD DE BARRAS DE BOTONES. EL OBJETIVO DE LAS MISMAS ES:",
    "options": [
      "a) Evitar la utilización del ratón",
      "b) Proporcionar acceso rápido a funcionalidades que pueden hacerse a través del teclado o a través de comandos del menú",
      "c) Mostrar las características del sistema operativo de la máquina sobre la que se trabaja",
      "d) Permitir el acceso directo al resto de aplicativos abiertos en el equipo de trabajo"
    ],
    "correct": 1
  },
  {
    "question": "199. SI DESEO INTERCAMBIAR INFORMACIÓN ENTRE APLICACIONES, ÉSTAS DEBERÁN SER:",
    "options": [
      "a) Complementarias",
      "b) Amigables",
      "c) Automatizables",
      "d) Compatibles"
    ],
    "correct": 3
  },
  {
    "question": "200. LAS CONDICIONES DE ESPECIAL DIFICULTAD TÉCNICA, DEDICACIÓN, RESPONSABILIDAD, INCOMPATIBILIDAD Y PELIGROSIDAD O PENOSIDAD DE UN PUESTO DE TRABAJO SON RETRIBUIDAS POR:",
    "options": [
      "a) El sueldo.",
      "b) El sueldo y el complemento de destino.",
      "c) El sueldo y el complemento específico.",
      "d) El complemento específico."
    ],
    "correct": 3
  },
  {
    "question": "201. EL TÉRMINO “OFIMÁTICA” SE ASOCIA A:",
    "options": [
      "a) Automatización de las oficinas y de los procesos allí realizados",
      "b) A la informática de forma general",
      "c) A las redes informáticas desplegadas en las oficinas",
      "d) A los procesadores de texto que permiten eliminar las máquinas de escribir"
    ],
    "correct": 0
  },
  {
    "question": "202. EN TÉRMINOS INFORMÁTICOS CUANDO HABLAMOS DE UN “TUTORIAL” ESTAMOS HACIENDO REFERENCIA A:",
    "options": [
      "a) Punto de consulta telefónica sobre un producto",
      "b) Tipo de ayuda a modo libro en formato electrónico donde se describen las principales características y funcionalidades de un producto",
      "c) Una automatización en un único comando de una operación que requiera varios comandos consecutivos",
      "d) Un aplicativo ofimático desarrollado en un lenguaje orientado a objetos"
    ],
    "correct": 1
  },
  {
    "question": "203. LA CORRECCIÓN ORTOGRÁFICA EN UN PROCESADOR DE TEXTO HACE USO DEL:",
    "options": [
      "a) Ratón",
      "b) Teclado",
      "c) Diccionario",
      "d) Lista de sinónimos"
    ],
    "correct": 2
  },
  {
    "question": "204. LAS LICENCIAS POR PATERNIDAD:",
    "options": [
      "a) Su concesión se condiciona a la autorización del superior jerárquico.",
      "b) Serán retribuidas.",
      "c) Se concederán por una sola vez.",
      "d) Se interrumpirán si las necesidades de servicio lo requieren."
    ],
    "correct": 1
  },
  {
    "question": "205. (SEÑALE LA RESPUESTA CORRECTA). LOS PERMISOS POR ASUNTOS PROPIOS:",
    "options": [
      "a) No darán lugar a retribución alguna",
      "b) Su duración acumulada no podrá exceder de tres meses cada dos años.",
      "c) Estará siempre subordinada a las necesidades del servicio.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "206. EN LA EHU LA ELABORACIÓN DE LOS PLANES DE FORMACIÓN DEL PERSONAL CORRESPONDE A:",
    "options": [
      "a) La Comisión de Planificación.",
      "b) El Comité de Planes Formativos.",
      "c) La Comisión de Formación, Perfeccionamiento y Reciclaje.",
      "d) La Comisión de Euskaldunización."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
