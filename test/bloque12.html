<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 12 (preguntas 165-178)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 12 (preguntas 165-178)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "165. LOS ACTOS ADMINISTRATIVOS PRODUCIDOS POR SILENCIO ADMINISTRATIVO SE DENOMINAN:",
    "options": [
      "a) Resoluciones.",
      "b) Actos de gravamen.",
      "c) Actos desfavorables.",
      "d) Actos presuntos."
    ],
    "correct": 3
  },
  {
    "question": "166. LOS ACTOS ADMINISTRATIVOS QUE PONEN FIN A UN PROCEDIMIENTO SE DENOMINAN:",
    "options": [
      "a) Actos de trámite.",
      "b) Resoluciones.",
      "c) Recusaciones.",
      "d) Recursos."
    ],
    "correct": 1
  },
  {
    "question": "167. ¿EN CUÁL DE LOS SIGUIENTES SUPUESTOS NO SE PODRÁ OTORGAR EFICACIA RETROACTIVA A UN ACTO ADMINISTRATIVO?",
    "options": [
      "a) Cuando se trate de una resolución.",
      "b) Cuando se trate de un acto sancionador.",
      "c) Cuando produzca efectos favorables al interesado.",
      "d) Los actos administrativos siempre pueden tener efectos retroactivos."
    ],
    "correct": 1
  },
  {
    "question": "168. ¿QUÉ RESPUESTA ES LA CORRECTA SEGÚN LOS ESTATUTOS DE LA EHU?",
    "options": [
      "a) Las Escuelas, Facultades y Departamentos son los Centros encargados de la organización de la enseñanza, dirigiendo, coordinando y gestionando los procesos académicos conducentes a la obtención de títulos de grado u otras ofertas docentes.",
      "b) Las Escuelas, Facultades y Departamentos son los Centros encargados de la organización de la enseñanza, dirigiendo, coordinando y gestionando procesos académicos y administrativos conducentes a la obtención de títulos de grado",
      "c) Las Escuelas y Facultades son los Centros encargados de la organización de la enseñanza, dirigiendo, coordinando y gestionando procesos académicos y administrativos conducentes a la obtención de títulos de grado",
      "d) Las Facultades y los Departamentos organizan las enseñanzas universitarias y dirigen y gestionan los procesos académicos y administrativos conducentes a la obtención de títulos académicos u otras ofertas docentes."
    ],
    "correct": 2
  },
  {
    "question": "169. ¿QUÉ RESPUESTA ES LA CORRECTA SEGÚN LOS ESTATUTOS DE LA EHU?",
    "options": [
      "a) El/la Rector/a es la máxima autoridad académica universitaria de la EHU, ostenta su representación y ejerce su dirección y gobierno.",
      "b) El/la Rector/a es la persona responsable de la organización y gestión de los servicios administrativos y económicos de la EHU, de acuerdo con las directrices marcadas por sus órganos de gobierno.",
      "c) El/la Rector/a es el/la fedatario/a de los actos y acuerdos de los órganos colegiados de gobierno y de Administración general de la EHU.",
      "d) Las respuestas a) y c) son verdaderas."
    ],
    "correct": 0
  },
  {
    "question": "170. LOS ÓRGANOS DE GOBIERNO, REPRESENTACIÓN, DIRECCIÓN Y GESTIÓN DE UN CENTRO DOCENTE SON AL MENOS LOS SIGUIENTES:",
    "options": [
      "a) La Junta de Centro, el Decanato o la Dirección, y la Secretaría Académica.",
      "b) La Junta de Centro, el Decanato o la Dirección, la Secretaría Académica y la Administración.",
      "c) La Junta de Centro, el Decanato o la Dirección, los Vicedecanatos o Subdirecciones y la Secretaría Académica.",
      "d) La Junta de Centro, el Decanato o la Dirección, los Vicedecanatos o Subdirecciones, la Secretaría Académica y la Administración."
    ],
    "correct": 2
  },
  {
    "question": "171. DIGA CUÁL DE ESTAS AFIRMACIONES ES CORRECTA DE ACUERDO CON EL ART. 2 DEL REGLAMENTO MARCO DE LOS DEPARTAMENTOS DE LA EHU:",
    "options": [
      "a) Los Departamentos determinan las necesidades de plantilla de profesorado y personal de administración y servicios.",
      "b) Los Departamentos eligen al Decano/a o Director/a del Centro.",
      "c) Los Departamentos impulsan y apoyan la investigación relativa al área o áreas de conocimiento de su competencia.",
      "d) Todas las respuestas son falsas."
    ],
    "correct": 2
  },
  {
    "question": "172. ENTRE LOS DEBERES DEL PERSONAL DE ADMINISTRACIÓN Y SERVICIOS RECOGIDOS EN LOS ESTATUTOS FIGURA EL DE:",
    "options": [
      "a) Asegurar la continuidad en la buena marcha del servicio, en los supuestos de ausencia de las personas superiores jerárquicas, compañeras o subordinadas.",
      "b) Conocer al detalle el plan de estudios de su centro, sabiendo distinguir entre asignaturas troncales y optativas.",
      "c) Contar con vehículo propio para sus desplazamientos por razón del trabajo.",
      "d) Disponibilidad absoluta para la realización de trabajos extraordinarios."
    ],
    "correct": 0
  },
  {
    "question": "173. CORRESPONDE AL PERSONAL TÉCNICO, DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS DE LA EHU:",
    "options": [
      "a) El desarrollo de los procesos de gestión y de soporte necesarios para el cumplimiento por parte de la EHU de sus objetivos y funciones.",
      "b) El apoyo, asistencia y asesoramiento a los órganos de gobierno universitario.",
      "c) El desarrollo de las tareas de apoyo a la docencia e investigación.",
      "d) Todas las respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "174. EL/LA SECRETARIO/A ACADÉMICO/A DE UN CENTRO ES:",
    "options": [
      "a) La persona que ejerce la dirección jerárquica del personal de administración y servicios de la Secretaría del Centro",
      "b) La persona fedataria de los actos y acuerdos de los órganos colegiados de gobierno, representación y administración del centro",
      "c) La persona responsable de proponer los límites de plazas al Vicerrectorado de Campus",
      "d) La persona que coordina los Departamentos que imparten docencia en el centro."
    ],
    "correct": 1
  },
  {
    "question": "175. (SEÑALE LA AFIRMACIÓN CORRECTA). ES PERSONAL FUNCIONARIO INTERINO:",
    "options": [
      "a) Quien en virtud de nombramiento y por razones de urgencia y necesidad sustituya a personal funcionario de carrera en el desempeño de su puesto de trabajo en los casos de ausencia temporal.",
      "b) Quien en virtud de contrato laboral y por razones de urgencia sustituya a personal funcionario de carrera en el desempeño de su puesto de trabajo en los casos de ausencia temporal.",
      "c) Quien en virtud de nombramiento y por razones de confianza sustituya a personal funcionario de carrera en el desempeño de su puesto de trabajo en los casos de ausencia temporal.",
      "d) Quien en virtud de confianza y por razones de urgencia sustituya a personal funcionario de carrera en el desempeño de su puesto de trabajo en los casos de ausencia temporal."
    ],
    "correct": 0
  },
  {
    "question": "176. DE LAS FUNCIONES SEÑALADAS, ¿CUÁL NO PUEDE DESEMPEÑARSE POR EL CAMPUS, SEGÚN LOS ESTATUTOS DE LA EHU?",
    "options": [
      "a) Adoptar, desarrollar y ejecutar Programas o Medidas Generales",
      "b) Desarrollar y potenciar las relaciones institucionales, así como la extensión cultural y universitaria.",
      "c) Aprobar la creación de un departamento del Campus.",
      "d) Gestionar los recursos e infraestructuras de uso compartido y de apoyo a la docencia e investigación existentes en su ámbito."
    ],
    "correct": 2
  },
  {
    "question": "177. SEGÚN LOS ESTATUTOS DE LA EHU, SON ENSEÑANZAS UNIVERSITARIAS:",
    "options": [
      "a) Las enseñanzas conducentes a la obtención de títulos oficiales reconocidos u homologados.",
      "b) Las enseñanzas conducentes a la obtención del Título de Bachiller.",
      "c) Las enseñanzas de Formación Profesional.",
      "d) Todas las anteriores son enseñanzas universitarias."
    ],
    "correct": 0
  },
  {
    "question": "178. DE LOS SIGUIENTES, INDIQUE EL ÚNICO QUE ES UN CENTRO ADSCRITO A LA EHU:",
    "options": [
      "a) Escuela de Ingeniería de Gipuzkoa",
      "b) Escuela de Ingeniería de Bilbao",
      "c) Escuela Universitaria de Enfermería de Vitoria-Gasteiz",
      "d) Escuela Técnica Superior de Arquitectura"
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
