<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 11 (preguntas 151-164)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "151. NO ES FUNCIÓN DE LOS CENTROS DOCENTES",
    "options": [
      "a) Adaptar y desarrollar en el Centro la planificación lingüística general",
      "b) Promover la realización de actividades de carácter científico",
      "c) Coordinar e impartir las enseñanzas de un área o varias de conocimiento",
      "d) Elaborar su memoria anual"
    ],
    "correct": 2
  },
  {
    "question": "152. ¿QUÉ TIPOS DE CENTROS UNIVERSITARIOS CONFIGURAN LA EHU?",
    "options": [
      "a) Propios y Sección de Centros",
      "b) Propios y adscritos",
      "c) Propios y Unidades Delegadas",
      "d) Integrados, Departamentos e Institutos Universitarios"
    ],
    "correct": 1
  },
  {
    "question": "153. DE ACUERDO CON SUS ESTATUTOS Y EN EL MARCO DE LAS LEYES, LA EHU ACTÚA EN RÉGIMEN:",
    "options": [
      "a) Foral",
      "b) De autonomía",
      "c) De dependencia funcional",
      "d) De competencias delegadas"
    ],
    "correct": 1
  },
  {
    "question": "154. ¿DE QUIÉN DEPENDE ORGÁNICA Y FUNCIONALMENTE LA GERENCIA?",
    "options": [
      "a) Del Consejo de Gobierno",
      "b) Del/la Vicerrector/a Asuntos Económicos",
      "c) Del/ de la Rector/a",
      "d) Del Consejo Social"
    ],
    "correct": 2
  },
  {
    "question": "155. EL CONSEJO SOCIAL DE LA EHU",
    "options": [
      "a) Ejerce la potestad reglamentaria aprobando las normas de desarrollo y aplicación de los Estatutos de la EHU.",
      "b) Puede crear las Comisiones que considere convenientes para el mejor ejercicio de sus funciones.",
      "c) Puede crear nuevos campus universitarios.",
      "d) Aprueba la programación plurianual de inversiones e infraestructuras."
    ],
    "correct": 3
  },
  {
    "question": "156. PARA LA ELECCIÓN DE REPRESENTANTES AL CLAUSTRO UNIVERSITARIO POR EL PERSONAL DOCENTE E INVESTIGADOR PERMANENTE DOCTOR, LA DEMARCACIÓN ELECTORAL SERÁ:",
    "options": [
      "a) El Campus.",
      "b) El Centro.",
      "c) El Departamento.",
      "d) El Servicio."
    ],
    "correct": 1
  },
  {
    "question": "157. LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS SE APLICA AL SECTOR PÚBLICO QUE COMPRENDE…",
    "options": [
      "a) La Administración General del Estado y las Administraciones de las Comunidades Autónomas.",
      "b) La Administración General del Estado y las Entidades que integran la Administración Local y el sector público institucional.",
      "c) Las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local y el sector público institucional.",
      "d) La Administración General del Estado, las Administraciones de las Comunidades Autónomas, las Entidades que integran la Administración Local y el sector público institucional."
    ],
    "correct": 3
  },
  {
    "question": "158. SEGÚN EL ARTÍCULO 2 DE LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, LA LENGUA PROPIA DEL PAÍS VASCO ES:",
    "options": [
      "a) El euskera.",
      "b) El euskera, aunque también se puede utilizar el castellano como lengua oficial.",
      "c) El euskera, que además es lengua oficial subsidiaria al castellano.",
      "d) Todas las respuestas anteriores son incorrectas."
    ],
    "correct": 0
  },
  {
    "question": "159. SEGÚN EL ARTÍCULO 15 DE LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, SE RECONOCE A TODO EL ALUMNADO EL DERECHO DE RECIBIR LA ENSEÑANZA …:",
    "options": [
      "a) ….en euskera obligatoriamente en todos los niveles educativos.",
      "b) …en castellano obligatoriamente en todos los niveles educativos.",
      "c) ….tanto en euskera como en castellano en los diversos niveles educativos.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 2
  },
  {
    "question": "160. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, EL GOBIERNO VASCO REGULARÁ LOS MODELOS LINGÜÍSTICOS A IMPARTIR EN CADA CENTRO EDUCATIVO TENIENDO EN CUENTA:",
    "options": [
      "a) La voluntad de los padres o tutores/as y la situación socio-lingüística de la zona.",
      "b) La voluntad de los padres o tutores y la situación socio-económica de las familias.",
      "c) La voluntad de los padres o tutores y la situación socio-sanitaria de las familias.",
      "d) Las respuestas b) y c) son correctas."
    ],
    "correct": 0
  },
  {
    "question": "161. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, LAS LENGUAS OFICIALES EN LA COMUNIDAD AUTÓNOMA DEL PAÍS VASCO, SON:",
    "options": [
      "a) El castellano, que es la única lengua oficial",
      "b) El euskera, que es la única lengua oficial",
      "c) EL euskera y el castellano",
      "d) Todas las respuestas son falsas"
    ],
    "correct": 2
  },
  {
    "question": "162. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, EL EUSKERA ES:",
    "options": [
      "a) La lengua propia del País Vasco, junto con el castellano",
      "b) La única lengua propia del País Vasco",
      "c) La única lengua oficial del País Vasco",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 1
  },
  {
    "question": "163. SEGÚN EL ARTÍCULO 14 DE LA 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, ¿CUÁL DE LAS SIGUIENTES AFIRMACIONES ES LA CORRECTA?",
    "options": [
      "a) Los poderes públicos adoptarán las medidas tendentes a la progresiva euskaldunización del personal afecto a la Administración Pública de la Comunidad Autónoma del País Vasco",
      "b) En las pruebas selectivas que se realicen para el acceso a las demás plazas se considerará, entre otros méritos, el nivel de conocimiento de las lenguas oficiales en la Comunidad Autónoma Vasca",
      "c) Los poderes públicos determinarán las plazas para las que es preceptivo el conocimiento de ambas lenguas",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "164. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, SE RECONOCEN A LOS/AS CIUDADANOS/AS DEL PAÍS VASCO LOS SIGUIENTES DERECHOS LINGÜÍSTICOS FUNDAMENTALES:",
    "options": [
      "a) Derecho a recibir la enseñanza en ambas lenguas oficiales",
      "b) Derecho a recibir en euskera publicaciones periódicas, programaciones de radio y televisión y de otros medios de comunicación",
      "c) Derecho a expresarse en euskera en cualquier reunión",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
