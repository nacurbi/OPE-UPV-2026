<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema34</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>Tema 34. La biblioteca universitaria de la UPV/EHU:</strong> Estructura, servicios, catalogación, clasificación y gestión de fondos.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "103. LA BIBLIOTECA UNIVERSITARIA ES UN CENTRO DE RECURSOS PARA LA DOCENCIA, EL APRENDIZAJE, LA INVESTIGACIÓN Y LAS ACTIVIDADES RELACIONADAS CON:",
    "options": [
      "a) El funcionamiento y la gestión de la universidad en su conjunto",
      "b) El desarrollo de la capacidad de estudio del alumnado",
      "c) La capacidad investigadora del personal docente",
      "d) El servicio a la sociedad en su conjunto"
    ],
    "correct": 0
  },
  {
    "question": "482. DADAS LAS SIGUIENTES REFERENCIAS BIBLIOGRÁFICAS:\n\n    1. Manzanos Bilbao, C. (1998). Salir de prisión: la otra condena. Zerbitzuan, 35, 64-70.\n    2. Moix Martínez, M. (2006). Teoría del trabajo social. Madrid: Síntesis.\n    3. Rodríguez Martín, V. (2003). Los recursos sociales. En T. Fernández García y M.C. Alemán Bracho (Coords.), Introducción al trabajo social (pp. 373-393). Madrid: Alianza.\n\nIDENTIFIQUE LA CLASE DE DOCUMENTO A LA QUE CORRESPONDE CADA UNA:",
    "options": [
      "a) 1.Libro; 2. Artículo de revista; 3. Capítulo de libro",
      "b) 1. Artículo de revista; 2. Libro; 3. Capítulo de libro",
      "c) 1.Capítulo de libro; 2. Artículo de periódico; 3. Ponencia en congreso",
      "d) 1.Capítulo de libro; 2. Ponencia de congreso; 3. Artículo de periódico"
    ],
    "correct": 1
  },
  {
    "question": "483. EN EL MÓDULO DE CIRCULACIÓN DE UN SISTEMA INTEGRADO DE GESTIÓN BIBLIOTECARIA EL PRÉSTAMO DE UN LIBRO VINCULA:",
    "options": [
      "a) Un registro bibliográfico con un registro de persona usuaria",
      "b) Un registro de ejemplar con un registro de persona usuaria",
      "c) Un registro de persona usuaria con un registro de autoridad",
      "d) Un registro bibliográfico con un registro de ejemplar"
    ],
    "correct": 1
  },
  {
    "question": "484. COMO REGLA GENERAL, EN LA BIBLIOTECA DE LA EHU SE EXCLUYEN DEL PRÉSTAMO A DOMICILIO:",
    "options": [
      "a) Los cómics",
      "b) Los videos",
      "c) Las tesis no publicadas",
      "d) Los CD-ROM"
    ],
    "correct": 2
  },
  {
    "question": "485. UNA BIBLIOTECA QUE RECOGE, TRATA Y DIFUNDE INFORMACIÓN RELATIVA A UN TEMA O GRUPO DE TEMAS AFINES, CUYA COLECCIÓN SE CENTRA EN UNA MATERIA O ÁREA CONCRETA DEL CONOCIMIENTO ES:",
    "options": [
      "a) Una biblioteca local",
      "b) Una biblioteca especializada",
      "c) Una biblioteca universitaria",
      "d) Una biblioteca nacional"
    ],
    "correct": 1
  },
  {
    "question": "486. EN LA CLASIFICACIÓN DECIMAL UNIVERSAL, ¿QUÉ TIENEN EN COMÚN LOS AUXILIARES DE FORMA Y LUGAR?",
    "options": [
      "a) Van entre paréntesis",
      "b) Van entre comillas",
      "c) Van entre corchetes",
      "d) Ninguna de las respuestas anteriores es cierta"
    ],
    "correct": 0
  },
  {
    "question": "487. SEGÚN LA NORMATIVA DE PRÉSTAMO DE LA BIBLIOTECA DE LA EHU, LAS CONDICIONES DE PRÉSTAMO DE EJEMPLARES:",
    "options": [
      "a) Son las mismas para todas las categorías de personas usuarias de la biblioteca",
      "b) Solo dependen del tipo de ejemplar",
      "c) Solo son diferentes para las personas usuarias externas de la biblioteca",
      "d) Dependen tanto del tipo de ejemplar como de la categoría de persona usuaria"
    ],
    "correct": 3
  },
  {
    "question": "488. EN EL MARCO DEL ESPACIO EUROPEO DE ENSEÑANZA SUPERIOR, ¿CUÁL DE LAS SIGUIENTES DEFINICIONES CORRESPONDE AL MODELO DE BIBLIOTECA UNIVERSITARIA QUE INTRODUCE EL CONCEPTO DE CRAI Y QUEDA REFLEJADA EN EL ARTÍCULO 103 DE LOS ESTATUTOS DE LA EHU?",
    "options": [
      "a) Gran espacio multifuncional, con áreas de silencio, de ruido y para trabajo en grupo, así como con instalaciones tecnológicas de última generación y colecciones multidisciplinares, orientado al autoaprendizaje del alumnado",
      "b) Combinación de biblioteca digital y física, tal y como lo describe la línea 1 de REBIUN",
      "c) Centro de recursos para el aprendizaje, la docencia, la investigación y las actividades relacionadas con el funcionamiento y la gestión de la Universidad en su conjunto.",
      "d) El modelo de Biblioteca Universitaria que introduce el CRAI es exclusivamente el que integra todos los servicios de la Universidad que tienen relación directa con la investigación"
    ],
    "correct": 2
  },
  {
    "question": "489. SEGÚN EL ARTÍCULO 52 DEL REGLAMENTO DE LA BIBLIOTECA UNIVERSITARIA DE LA EHU, ÚNICAMENTE SERÁN PERSONAS USUARIAS DE PLENO DERECHO DE LA MISMA:",
    "options": [
      "a) Profesorado y alumnado de la EHU",
      "b) Profesorado, alumnado, personal investigador y personal del servicio de seguridad de la EHU",
      "c) Toda la comunidad universitaria y cualquier persona ajena a la Universidad que lo solicite debidamente",
      "d) Personal docente e investigador, alumnado y personal técnico, de gestión y administración y servicios de la EHU"
    ],
    "correct": 3
  },
  {
    "question": "490. EN EL CONTROL DE RECEPCIÓN DE DOCUMENTOS, EL \"KARDEX\" SE USA PARA EL:",
    "options": [
      "a) Registro de publicaciones monográficas en entornos automatizados",
      "b) Control de duplicados",
      "c) Registro de publicaciones periódicas.",
      "d) Registro de publicaciones monográficas, pero solo en entornos no automatizados"
    ],
    "correct": 2
  },
  {
    "question": "491. ¿CUÁL DE LAS SIGUIENTES OPCIONES ES UNA VENTAJA DEL LIBRE ACCESO A LOS FONDOS DE LA BIBLIOTECA?",
    "options": [
      "a) Los materiales se conservan mejor",
      "b) Se pueden hacer estadísticas sobre el nivel de lectura",
      "c) Las personas usuarias pueden encontrar obras en principio no buscadas",
      "d) Las personas usuarias no necesitan señalización y orientación para localizar los fondos"
    ],
    "correct": 2
  },
  {
    "question": "492. LA BIBLIOTECA DE LA ESCUELA DE INGENIERÍA DE BILBAO-NÁUTICA RECIBE EN DONACIÓN UNA COLECCIÓN DE MAPAS Y CARTAS NÁUTICAS DEL SIGLO XIX. EN ATENCIÓN A SUS CARACTERÍSTICAS FÍSICAS, ¿CUÁL SERÍA LA FORMA MÁS ADECUADA DE CONSERVAR ESTE MATERIAL CARTOGRÁFICO?",
    "options": [
      "a) Plegados en archivadores",
      "b) Enrollados en tubos de cartón",
      "c) En planeros",
      "d) En estanterías inclinadas"
    ],
    "correct": 2
  },
  {
    "question": "493. ¿CUÁL DE LOS SIGUIENTES MÉTODOS NO ES CONVENIENTE PARA LA PREVENCIÓN DE ROBOS EN EL FONDO ANTIGUO DE LA BIBLIOTECA, DESDE EL PUNTO DE VISTA DE LA CONSERVACIÓN?",
    "options": [
      "a) Instalación de cámaras de seguridad",
      "b) Vigilancia directa en sala",
      "c) Colocación de bandas magnéticas adhesivas",
      "d) Instalación de cajas de seguridad"
    ],
    "correct": 2
  },
  {
    "question": "494. ¿QUÉ SIGNIFICA QUE LA CDU ES EXTENSIBLE?",
    "options": [
      "a) Que abarca todos los campos del conocimiento existentes.",
      "b) Que cada categoría se subdivide en otras, presentando el conocimiento jerárquicamente.",
      "c) Que es susceptible de adaptación y ampliación.",
      "d) Que su sistema de notación decimal elimina las barreras lingüísticas."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
