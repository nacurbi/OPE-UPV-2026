<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 21 (preguntas 291-304)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 21 (preguntas 291-304)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "291. LA SEGURIDAD ADECUADA DE LOS DATOS ATENDIENDO AL PRINCIPIO DE INTEGRIDAD Y CONFIDENCIALIDAD DEBE INCLUIR:",
    "options": [
      "a) La protección contra el tratamiento no autorizado o ilícito.",
      "b) La protección contra su pérdida.",
      "c) La protección contra su destrucción o daño accidental.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "292. ¿CON QUÉ FINES SE PUEDEN CONSERVAR LOS DATOS POR PERÍODOS MÁS LARGOS?:",
    "options": [
      "a) Fines de archivo en interés público.",
      "b) Fines estadísticos.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Cuando los datos no contengan informaciones relevantes."
    ],
    "correct": 2
  },
  {
    "question": "293. EL PROCESO DE SEUDONIMIZACIÓN DE DATOS PERSONALES IMPLICA QUE CIERTOS ATRIBUTOS SE SUSTITUYAN POR:",
    "options": [
      "a) Seudónimos.",
      "b) Códigos.",
      "c) Las respuestas a) y b) son correctas.",
      "d) Sobrenombres."
    ],
    "correct": 2
  },
  {
    "question": "294. ¿CUÁLES DE LOS SIGUIENTES DATOS SE SUBSUMEN EN LAS CATEGORÍAS ESPECIALES DE DATOS?:",
    "options": [
      "a) Origen étnico y racial.",
      "b) Datos biométricos.",
      "c) Los datos relativos a la vida sexual.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "295. LA INFORMACIÓN BÁSICA AL AFECTADO HA DE CONTENER:",
    "options": [
      "a) Identidad del responsable.",
      "b) Identidad del encargado.",
      "c) La finalidad del tratamiento.",
      "d) Las respuestas a) y c) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "296. ¿CUÁL DE LOS SIGUIENTES DERECHOS NO QUEDA REGULADO EXPRESAMENTE EN EL RGPD?:",
    "options": [
      "a) Derecho de acceso.",
      "b) Derecho de rectificación.",
      "c) Derecho a la cancelación.",
      "d) Derecho de supresión."
    ],
    "correct": 2
  },
  {
    "question": "297. EL DERECHO A LA PORTABILIDAD DE LOS DATOS ES SOLO DE APLICACIÓN CUANDO EL TRATAMIENTO ES:",
    "options": [
      "a) Automatizado y el fundamento jurídico del tratamiento es el consentimiento o un contrato.",
      "b) No automatizado y el fundamento jurídico del tratamiento es el consentimiento o un contrato.",
      "c) Consentido e informado.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 0
  },
  {
    "question": "298. ¿CUÁLES DE LOS SIGUIENTES DERECHOS PUEDEN SER CALIFICADOS COMO DERECHOS DIGITALES?:",
    "options": [
      "a) Derecho al honor en las redes sociales.",
      "b) Derecho a la desconexión digital en el ámbito laboral.",
      "c) Derecho a la intimidad.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 1
  },
  {
    "question": "299. LAS ADMINISTRACIONES PÚBLICAS, EN SU ACTUACIÓN PARA CON LOS/AS CIUDADANOS/AS, SE RIGEN POR CRITERIOS:",
    "options": [
      "a) De cooperación.",
      "b) De eficacia y concentración.",
      "c) De eficiencia y servicio a los/as ciudadanos/as.",
      "d) Que dictan las leyes de Régimen Local."
    ],
    "correct": 2
  },
  {
    "question": "300. LAS FORMAS O CANALES DE INFORMACIÓN Y ATENCIÓN AL PÚBLICO UTILIZADAS POR LA ADMINISTRACIÓN SON:",
    "options": [
      "a) Fundamentalmente, la vía telefónica y el correo escrito.",
      "b) La presencial, la telefónica, el correo, la telemática.",
      "c) La presencial es la que indica la ley.",
      "d) La telemática y la telefónica preferencialmente."
    ],
    "correct": 1
  },
  {
    "question": "301. EN EL ÁMBITO DE ATENCIÓN AL CIUDADANO/A, LA FORMA EN QUE LA ADMINISTRACIÓN TRANSMITE AL CIUDADANO/A LA DOCUMENTACIÓN PRECISA:",
    "options": [
      "a) Sólo pueden realizarse en soporte papel.",
      "b) Puede ser transmitida en soporte papel o bien por medios electrónicos o telemáticos.",
      "c) Siempre necesita ser ratificada telefónicamente.",
      "d) Sólo se trasmite por medios electrónicos o telemáticos."
    ],
    "correct": 1
  },
  {
    "question": "302. ¿A QUIÉN IDENTIFICA EL RGPD COMO RESPONSABLE DEL TRATAMIENTO O RESPONSABLE DE LA PROTECCIÓN DE DATOS?:",
    "options": [
      "a) Personas físicas y jurídicas.",
      "b) Autoridades públicas.",
      "c) Servicios u otros organismos.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "303. SEÑALE LA RESPUESTA INCORRECTA SEGÚN LO DISPUESTO EN REAL DECRETO 203/2021, DE 30 DE MARZO, POR EL QUE SE APRUEBA EL REGLAMENTO DE ACTUACIÓN Y FUNCIONAMIENTO DEL SECTOR PÚBLICO POR MEDIOS ELECTRÓNICOS. LAS ADMINISTRACIONES PÚBLICAS PODRÁN UTILIZAR LOS SIGUIENTES SISTEMAS PARA SU IDENTIFICACIÓN ELECTRÓNICA Y PARA LA AUTENTICACIÓN DE LOS DOCUMENTOS ELECTRÓNICOS QUE PRODUZCAN:",
    "options": [
      "a) Sistemas de firma electrónica basados en la utilización de certificados de dispositivo seguro o medio equivalente que permita identificar la sede electrónica y el establecimiento con ella de comunicaciones seguras.",
      "b) Sistemas de firma electrónica para la actuación administrativa automatizada.",
      "c) Un código QR impreso en los documentos que necesariamente ha de integrar la información relativa a la Administración generadora del documento, así como de la persona que ostenta la competencia sobre la materia expresada en el documento.",
      "d) Intercambio electrónico de datos en entornos cerrados de comunicación, conforme a lo específicamente acordado entre las partes."
    ],
    "correct": 2
  },
  {
    "question": "304. - EN LA COMUNICACIÓN TELEFÓNICA LA PERSONA RECEPTORA DEBE TENER EN CUENTA:",
    "options": [
      "a) Procurar terminar las frases iniciadas por la persona interlocutora",
      "b) Saber utilizar los silencios, tanto para subrayar determinadas palabras como para escuchar a la persona interlocutora",
      "c) Escuchar la exposición del mensaje de la persona emisora de una forma activa, interviniendo para añadir detalles",
      "d) Proporcionar más datos aún de los solicitados, aunque estos no sean procedentes."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
