<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 20 (preguntas 277-290)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 20 (preguntas 277-290)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "277. ¿CÚAL DE LOS SIGUIENTES ES UN REQUISITO IMPRESCINDIBLE PARA UNA ATENCIÓN DE CALIDAD A LA CIUDADANÍA?",
    "options": [
      "a) Intervenir aleatoriamente sin responder a demandas",
      "b) Que el personal de atención telefónica tenga voz grave",
      "c) Escuchar permanentemente a la ciudadanía",
      "d) Que el personal de atención al público modere sus respuestas negativas"
    ],
    "correct": 2
  },
  {
    "question": "278. ¿CÚAL DE LAS SIGUIENTES OPCIONES ES UNA VENTAJA DE LA IMPLANTACIÓN DE LA VENTANILLA ÚNICA?",
    "options": [
      "a) Ahorro en desplazamientos de la ciudadanía",
      "b) Desaparición de colas",
      "c) Simplificación de trámites",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "279. LA INFORMACIÓN ADMINISTRATIVA ES EL CAUCE POR EL QUE LA PERSONA CIUDADANA PUEDE ACCEDER:",
    "options": [
      "a) Al conocimiento de sus derechos y obligaciones.",
      "b) A la utilización de los bienes y servicios públicos.",
      "c) Al Boletín Oficial.",
      "d) Entre otros, a los contenidos de las respuestas a) y b)."
    ],
    "correct": 3
  },
  {
    "question": "280. LA ATENCIÓN AL CIUDADANO/A POR MEDIOS TELEMÁTICOS:",
    "options": [
      "a) Es el único canal disponible para las personas menores de 65 años, salvo que se acredite alguna discapacidad física que dificulte esa atención por medios telemáticos.",
      "b) Tiene como principal finalidad el ahorro de personal.",
      "c) Permite acercar los servicios de la Administración a las personas, diversificando los canales de acceso.",
      "d) Es la única posible a partir de la entrada en vigor del Real Decreto 203/2021, de 30 de marzo, por el que se aprueba el Reglamento de actuación y funcionamiento del sector público por medios electrónicos."
    ],
    "correct": 2
  },
  {
    "question": "281. INDIQUE LA OPCIÓN CORRECTA:",
    "options": [
      "a) Los registros electrónicos se regirán a efectos de cómputo de los plazos imputables tanto a los interesados como a las Administraciones Públicas por la fecha y hora del sistema operativo utilizado por la persona usuaria, siempre que dicho sistema cuente con la licencia de uso correspondiente.",
      "b) Los registros electrónicos permitirán la presentación de solicitudes, escritos y comunicaciones todos los días del año durante las veinticuatro horas, salvo que la Administración titular del correspondiente registro, en uso de sus competencias, pueda establecer restricciones de acceso en días festivos nacionales.",
      "c) A los efectos del cómputo de plazo fijado en días hábiles o naturales, y en lo que se refiere a cumplimiento de plazos por los interesados, la presentación en un día inhábil se entenderá siempre realizada en la primera hora del primer día hábil siguiente.",
      "d) La opción inicial que tiene los ciudadanos de comunicarse por unos u otros medios con la Administración Pública, no le vincula en el desarrollo del procedimiento y, por ende, podrá, en cualquier momento, optar por un medio distinto del inicialmente elegido."
    ],
    "correct": 3
  },
  {
    "question": "282. LA INFORMACIÓN ADMINISTRATIVA SOBRE LOS REQUISITOS JURÍDICOS O TÉCNICOS QUE LAS DISPOSICIONES IMPONGAN A LOS PROYECTOS, ACTUACIONES O SOLICITUDES QUE UNA PERSONA SE PROPONGA REALIZAR, SE CONSIDERA UNA INFORMACIÓN:",
    "options": [
      "a) De carácter particular.",
      "b) De carácter general.",
      "c) Sin importancia.",
      "d) Confidencial."
    ],
    "correct": 1
  },
  {
    "question": "283. SE CONSIDERA INFORMACIÓN ADMINISTRATIVA DE CARÁCTER PARTICULAR:",
    "options": [
      "a) La concerniente al estado o contenido de los procedimientos en tramitación",
      "b) La que concierne a la identificación de las autoridades y personal al servicio de la Administración bajo cuya responsabilidad se tramiten aquellos procedimientos.",
      "c) La referida a los datos de carácter personal que afecten de alguna forma a la intimidad o privacidad de las personas físicas.",
      "d) Las tres opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "284. LA ATENCIÓN PERSONALIZADA A LA CIUDADANÍA CONTEMPLA ENTRE SUS OBJETIVOS:",
    "options": [
      "a) La recepción de las iniciativas o sugerencias formuladas por los/as ciudadanos/as para mejorar la calidad de los servicios.",
      "b) La recepción de las iniciativas o sugerencias formuladas por los/as propios/as empleados/as públicos/as para mejorar la calidad de los servicios.",
      "c) Las respuestas a) y b) son posibles.",
      "d) El desplazamiento del personal funcionario al domicilio particular de la persona que requiera la realización de un trámite."
    ],
    "correct": 2
  },
  {
    "question": "285. ¿LA CONSTITUCIÓN ESPAÑOLA RECONOCE A LOS/AS CIUDADANOS/AS EL EJERCICIO DEL DERECHO DE PETICIÓN?",
    "options": [
      "a) Sí, pero la petición ha de ser presentada directamente a título individual.",
      "b) Sí, siempre que la petición sea presentada por escrito por un colectivo social.",
      "c) Sí, individual o colectivamente, por escrito y en la forma y con los efectos que determine la ley.",
      "d) El derecho de petición sólo está contemplado en la Ley 39/2015, del Procedimiento Administrativo Común."
    ],
    "correct": 2
  },
  {
    "question": "286. CUANDO UN CIUDADANO PRECISA DE UNA ACLARACIÓN SOBRE ALGÚN PROCEDIMIENTO, TRÁMITE O REQUISITO PARA ACCEDER A UN SERVICIO PÚBLICO:",
    "options": [
      "a) Deberá consultar la legislación adecuada.",
      "b) Tendrá derecho a recibir orientación e información personalizada.",
      "c) Deberá solicitar asesoramiento jurídico-administrativo en una Gestoría privada.",
      "d) Acudirá al servicio de información, previo pago de la cuota correspondiente."
    ],
    "correct": 1
  },
  {
    "question": "287. EN SUS RELACIONES CON LAS ADMINISTRACIONES PÚBLICAS, ¿LOS/AS CIUDADANOS/AS TIENEN EL DERECHO A UTILIZAR LAS LENGUAS OFICIALES EN EL TERRITORIO DE SU COMUNIDAD AUTÓNOMA?:",
    "options": [
      "a) Es un derecho que las Administraciones Públicas de las diversas Comunidades Autónomas han de garantizar a la ciudadanía.",
      "b) Sólo si las Administraciones de esa Comunidad Autónoma ofrecen expresamente esa posibilidad.",
      "c) Sólo en las administraciones autonómicas.",
      "d) Sólo si el/la funcionario/a las conoce."
    ],
    "correct": 0
  },
  {
    "question": "288. EL ACCESO A ARCHIVOS Y A DOCUMENTOS QUE OBREN EN LOS ARCHIVOS ADMINISTRATIVOS ES UN DERECHO QUE LE ASISTE A LAS PERSONAS:",
    "options": [
      "a) Sólo a los que se sustentan en soporte gráfico.",
      "b) Sólo a los que se sustentan en soporte gráfico y correspondan a procedimientos terminados.",
      "c) En cualquier forma de expresión siempre que estén inacabados.",
      "d) Siempre que correspondan a procedimientos terminados en la fecha de la solicitud."
    ],
    "correct": 3
  },
  {
    "question": "289. EL ACCESO A DOCUMENTOS QUE OBREN EN LOS ARCHIVOS ADMINISTRATIVOS Y QUE CONTENGAN DATOS REFERENTES A LA INTIMIDAD DE LAS PERSONAS:",
    "options": [
      "a) Estará reservado a éstas.",
      "b) Será igualmente de acceso público.",
      "c) Estará totalmente prohibido.",
      "d) Será posible en caso de que contar con el consentimiento expreso y por escrito de la persona afectada."
    ],
    "correct": 3
  },
  {
    "question": "290. LOS DATOS PERSONALES NO DEBEN CONSERVARSE:",
    "options": [
      "a) Durante más tiempo del necesario para la consecución de la finalidad pretendida.",
      "b) Por tiempo indefinido.",
      "c) Por tiempo limitado.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
