<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 23 (preguntas 319-332)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "319. EL PEDIDO, ES PARTE DEL FLUJO ADMINISTRATIVO DEL STOCK, Y SE DEFINE…",
    "options": [
      "a) Como la solicitud que realiza un/a empresario/a o profesional a un/a proveedor/a para que le suministre unas determinadas mercancías o le preste un servicio.",
      "b) Como el parte de trabajo que realiza el cliente al proveedor.",
      "c) Es el documento mercantil que acompaña a la factura de abono.",
      "d) Ninguna respuesta es correcta."
    ],
    "correct": 0
  },
  {
    "question": "320. LA RECEPCIÓN DE MERCANCÍAS DEBE SER:",
    "options": [
      "a) Cualitativa, comprobando que la cantidad recibida es la pedida.",
      "b) Cuantitativa, comprobando que lo pedido es lo recibido.",
      "c) Cuantitativa y cualitativa.",
      "d) Estas no son características de la recepción de las mercancías."
    ],
    "correct": 2
  },
  {
    "question": "321. EN CASO DE EMERGENCIA DENTRO DE UN EDIFICIO:",
    "options": [
      "a) Se debe salir corriendo por la primera salida que encontremos",
      "b) Se debe esperar al ascensor",
      "c) Se debe dejar todo ordenado en el despacho",
      "d) Se debe tranquilamente pero sin detenerse buscar la salida de emergencia más próxima"
    ],
    "correct": 3
  },
  {
    "question": "322. EN TODO LUGAR DE TRABAJO, LAS PUERTAS TRANSPARENTES SE DEBERÁN SEÑALIZAR:",
    "options": [
      "a) Siempre",
      "b) Solo si son de emergencia",
      "c) Solo las que no están construidas con material de seguridad",
      "d) Solo si no son de emergencia"
    ],
    "correct": 0
  },
  {
    "question": "323. LA TEMPERATURA DONDE SE REALICEN TRABAJOS SEDENTARIOS HA DE ESTAR COMPRENDIDA ENTRE:",
    "options": [
      "a) 17 y 27ºC y si se realizan trabajos ligeros entre 14 y 25ºC",
      "b) 18 y 27ºC y si se realizan trabajos ligeros entre 14 y 26ºC",
      "c) 17 y 28ºC y si se realizan trabajos ligeros entre 18 y 25ºC",
      "d) 18 y 28ºC y si se realizan trabajos ligeros entre 15 y 26ºC"
    ],
    "correct": 0
  },
  {
    "question": "324. LAS DIMENSIONES DE LOS LOCALES DE TRABAJO DEBEN PERMITIR QUE LOS/AS TRABAJADORES/AS REALICEN SUS TRABAJOS SIN RIESGOS PARA SU SEGURIDAD Y SALUD Y EN CONDICIONES ERGONÓMICAS ACEPTABLES. SUS DIMENSIONES MÍNIMAS EN OFICINA HAN DE SER:",
    "options": [
      "a) Altura 3m desde el piso hasta el techo, superficie libre por trabajador/a 2m², espacio no ocupado por trabajador/a 10 m³.",
      "b) Altura 3m desde el piso hasta el techo, superficie libre por trabajador/a 2m², espacio no ocupado por trabajador/a 10 m².",
      "c) Altura 2,5m desde el piso hasta el techo, superficie libre por trabajador/a 2m², espacio no ocupado por trabajador/a 10 m³.",
      "d) Altura 2,5m, superficie libre por trabajador/a 2m², espacio no ocupado por trabajador/a 10 m²."
    ],
    "correct": 2
  },
  {
    "question": "325. LAS VÍAS Y SALIDAS DE EVACUACIÓN DEBEN SATISFACER LAS CONDICIONES QUE SE ESTABLECEN EN LOS SIGUIENTES PUNTOS:",
    "options": [
      "a) Las puertas de emergencia deben abrirse hacia el exterior y no estar cerradas. Están prohibidas las puertas específicamente de emergencia que sean correderas o giratorias y no deben cerrarse con llave.",
      "b) Las puertas de emergencia deben permanecer expeditas y desembocar lo más directamente posible al exterior o zona de seguridad",
      "c) El número, dimensiones y distribución de las puertas de emergencia dependen del uso, de los equipos y de las dimensiones de los lugares de trabajo y del número de personas máximo que puedan estar presentes",
      "d) Todas son ciertas"
    ],
    "correct": 3
  },
  {
    "question": "326. DEFINICIÓN DE RIESGO DE TRABAJO",
    "options": [
      "a) Posibilidad de que surja un peligro derivado del trabajo.",
      "b) Posibilidad de que la persona trabajadora sufra un determinado daño derivado de su trabajo.",
      "c) Posibilidad de que deba prevenirse un riego derivado del trabajo.",
      "d) Trabajar estando enfermo/a."
    ],
    "correct": 1
  },
  {
    "question": "327. LA GESTIÓN EN LA PREVENCIÓN DE RIESGOS LABORALES CONSISTE FUNDAMENTALMENTE EN:",
    "options": [
      "a) Informatizar toda la información para tomar decisiones con agilidad",
      "b) Aplicar la Ley de Prevención de riesgos Laborales a las circunstancias, tamaño y actividad de la empresa.",
      "c) Formarse y establecer una comunicación eficaz entre todas las áreas de la empresa.",
      "d) La respuesta b) y optimizar los recursos humanos y materiales destinados a la prevención de riesgos laborales."
    ],
    "correct": 3
  },
  {
    "question": "328. ¿QUE ES UN ACCIDENTE DE TRABAJO?",
    "options": [
      "a) Las caídas sufridas",
      "b) Toda lesión corporal que la persona trabajadora sufra con ocasión o como consecuencia del trabajo que ejecuta por cuenta ajena.",
      "c) Las lesiones por causa ajena.",
      "d) Cansarse como consecuencia dela actividad laboral."
    ],
    "correct": 1
  },
  {
    "question": "329. ¿EN CUÁNTAS ÁREAS ESTÁ DIVIDIDO EL SERVICIO DE PREVENCIÓN DE LA EHU?",
    "options": [
      "a) Está dividido en 2 áreas: el área sanitaria y el área técnica.",
      "b) Está dividido en 2 áreas: el área informática y el área técnica.",
      "c) Está dividido en 3 áreas: informática, técnica y sanitaria.",
      "d) Está dividido en 2 áreas: el área sanitaria y el área informática."
    ],
    "correct": 0
  },
  {
    "question": "330. EL SERVICIO DE PREVENCIÓN DE LA EHU TIENE COMO OBLIGACIÓN ASESORAR:",
    "options": [
      "a) Sólo a la Administración.",
      "b) Sólo a su personal trabajador y a sus representantes.",
      "c) A la Administración y a su personal trabajador y sus representantes.",
      "d) A la administración, a su personal trabajador, a sus representantes y a los Comités de Campus e Intercampus de Seguridad y Salud Laboral."
    ],
    "correct": 3
  },
  {
    "question": "331. LA IMPLANTACIÓN DEL PLAN DE AUTOPROTECCIÓN COMPRENDERÁ:",
    "options": [
      "a) Que todo el personal de la EHU esté atento ante una emergencia",
      "b) Que el Servicio de Prevención dé la señal en caso de emergencia",
      "c) Comprenderá, al menos, la formación y capacitación del personal, el establecimiento de mecanismos de información al público y la provisión de los medios y recursos precisa para la aplicabilidad del plan.",
      "d) Que todos los recursos funcionen adecuadamente de cara a una inspección de trabajo."
    ],
    "correct": 2
  },
  {
    "question": "332. UNA SEÑAL DE FORMA REDONDA CON PICTOGRAMA BLANCO, FONDO AZUL Y BORDE BLANCO O AZUL ES UNA SEÑAL DE:",
    "options": [
      "a) Advertencia.",
      "b) Prohibición.",
      "c) Salvamento.",
      "d) Obligación."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
