<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 29 (preguntas 403-416)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "403. SEÑALE LA RESPUESTA CORRECTA:",
    "options": [
      "a) El III Plan de Igualdad de Mujeres y Hombres de la EHU encomienda a la EHU a poner en vigor antes del 2022 un Protocolo contra las violencias de género.",
      "b) La EHU aplica a la comunidad universitaria el Protocolo contra las violencias de género aprobado en mayo de 2016 por la Consejería de Universidades del Gobierno Vasco.",
      "c) El Consejo de Gobierno aprobó en junio de 2018 el Protocolo de la EHU contra las violencias de género.",
      "d) Por Resolución de la Rectora de 7 de junio de 2018 se aprobó el Protocolo de la EHU contra las violencias de género."
    ],
    "correct": 2
  },
  {
    "question": "404. EL IV PLAN DE IGUALDAD DE MUJERES V HOMBRES DE LA EHU BUSCA ELIMINAR:",
    "options": [
      "a) Diferencias académicas.",
      "b) Roles y estereotipos de género.",
      "c) Idiomas cooficiales.",
      "d) Autonomía universitaria."
    ],
    "correct": 1
  },
  {
    "question": "405. EL DÍA INTERNACIONAL DE LA MUJER Y LA NIÑA EN LA CIENCIA SE CONMEMORA CADA:",
    "options": [
      "a) 8 de marzo.",
      "b) 25 de noviembre.",
      "c) 11 de febrero.",
      "d) El viernes incluido en la Semana de la Ciencia (evento anual)."
    ],
    "correct": 2
  },
  {
    "question": "406. ¿CUÁNDO EXISTE DISCRIMINACIÓN INDIRECTA POR RAZÓN DE SEXO?:",
    "options": [
      "a) Cuando una persona es tratada de manera menos favorable que otra por razón de su sexo.",
      "b) Cuando un acto jurídico, criterio o práctica aparentemente neutra perjudica a una proporción sustancialmente mayor de personas de un mismo sexo, sin justificación objetiva.",
      "c) Cuando se producen actos de acoso sexual en el ámbito laboral.",
      "d) Cuando una norma establece tratamientos diferentes para mujeres y hombres sin ningún motivo."
    ],
    "correct": 1
  },
  {
    "question": "407. SEGÚN EL VIGENTE PLAN DE IGUALDAD DE LA EHU. LA \"SEGREGACIÓN VERTICAL\" IMPLICA:",
    "options": [
      "a) Diferencias entre ramas académicas.",
      "b) Distribución desigual por sexos en posiciones jerárquicas.",
      "c) Diferencias en el estudiantado.",
      "d) Diferencias en elección de estudios."
    ],
    "correct": 1
  },
  {
    "question": "408. LA COMPRA PÚBLICA ECOLÓGICA SE DEFINE EN LA COMUNICACIÓN DE LA COMISIÓN EUROPEA “CONTRATACIÓN PÚBLICA PARA UN MEDIO AMBIENTE MEJOR” COMO:",
    "options": [
      "a) El procedimiento de contratación pública que obliga a que un porcentaje de las compras tenga una etiqueta ecológica.",
      "b) Un proceso por el cual las autoridades públicas tratan de adquirir mercancías, servicios y obras con un impacto medioambiental reducido durante su ciclo de vida, en comparación con el de otras mercancías, servicios y obras con la misma función primaria que se adquirirían en su lugar.",
      "c) Un proceso por el que las administraciones públicas priman la compra de productos ecológicos",
      "d) El procedimiento por el que las autoridades públicas cumplen con las directivas de compra ecológica."
    ],
    "correct": 1
  },
  {
    "question": "409. LAS FUNCIONARIAS DE CARRERA VÍCTIMAS DE VIOLENCIA DE GÉNERO TENDRÁN DERECHO A SOLICITTR LA SITUACIÓN DE EXCEDENCIA:",
    "options": [
      "a) Necesita haber prestado un tiempo mínimo de 3 años de servicios previos.",
      "b) No se le exige plazo de permanencia en la misma.",
      "c) Durante los dos primeros meses de la excedencia tendrán derecho a la reserva del puesto que desempeñen.",
      "d) Dicho período será computable a efectos de antigüedad, carrera profesional y derechos del régimen de la S.S. que sea de aplicación."
    ],
    "correct": 1
  },
  {
    "question": "410. SEGÚN EL PROGRAMA DE “COMPRA Y CONTRATACIÓN PÚBLICA VERDE DEL PAÍS VASCO 2020”, TODAS LAS ADMINISTRACIONES PARTICIPANTES DEBERÁN ALCANZAR UNA AMBIENTALIZACIÓN EN LA COMPRA Y CONTRATACIÓN PARA EL EJERCICIO 2020, DE:",
    "options": [
      "a) Al menos un 30%",
      "b) Al menos un 50%",
      "c) Al menos un 40%",
      "d) Al menos un 20%"
    ],
    "correct": 1
  },
  {
    "question": "411. INDIQUE CUÁL DE LAS SIGUIENTES NO ES UNA LÍNEA ESTRATÉGICA DEL PROGRAMA DE COMPRA Y CONTRATACIÓN PÚBLICA VERDE DEL PAÍS VASCO 2020:",
    "options": [
      "a) Contenido y herramientas para la implementación",
      "b) Integración en los procedimientos de contratación",
      "c) Formación, capacitación y sensibilización",
      "d) Observancia estricta del articulado de Ley 9/2017, de 8 de noviembre, de Contratos del Sector Público para obtener el mejor precio por los bienes/servicios contratados"
    ],
    "correct": 3
  },
  {
    "question": "412. EN INTERNET, LAS PÁGINAS WEB CREADAS PARA ATRAER DE LA FORMA MÁS RÁPIDA AL MAYOR NÚMERO DE LEADS, SE DENOMINA:",
    "options": [
      "a) Microsites",
      "b) Portal web",
      "c) Favorite site",
      "d) Landing page"
    ],
    "correct": 3
  },
  {
    "question": "413. ESTARÁN EXENTOS DEL CUMPLIMIENTO DEL RÉGIMEN GENERAL DE PRECEPTIVIDAD DE LOS PERFILES LINGÜÍSTICOS EN RELACIÓN CON EL PUESTO DE TRABAJO DEL QUE SON TITULARES:",
    "options": [
      "a) Las personas que superen la edad de 55 años al inicio de cada período de planificación en el que se asigne la fecha de preceptividad al puesto de trabajo del que son titulares, previa conformidad de la persona interesada. Asimismo, también estarán exentas las personas que, en caso de que se apruebe la modificación del perfil lingüístico previamente asignado al puesto de trabajo del que son titulares, superen la edad de 45 años, previa conformidad de la persona interesada.",
      "b) Las personas cuyo nivel de estudios realizados alcanzara los de Bachiller Elemental, Educación General Básica o Educación Secundaria Obligatoria, ni otros que, en el futuro, pudieran sustituir a estos, prescindiendo de las equivalencias y convalidaciones que contemple el ordenamiento jurídico a otros fines respecto al Certificado de Escolaridad.",
      "c) Las personas en las que no concurra carencia manifiesta y contrastada de las destrezas aptitudinales necesarias en el proceso de aprendizaje del idioma mediante los programas de formación y capacitación lingüística de personas adultas.",
      "d) Todas las respuestas anteriores son incorrectas"
    ],
    "correct": 3
  },
  {
    "question": "414. INDIQUE CUÁL DE ESTOS COMPONENTES PERTENECE AL SOFTWARE DEL ORDENADOR:",
    "options": [
      "a) Sistema operativo",
      "b) Disco duro",
      "c) Unidad de DVD y CD",
      "d) Impresora"
    ],
    "correct": 0
  },
  {
    "question": "415. INDIQUE CUÁL DE ESTOS ELEMENTOS NO PERTENECE AL HARDWARE DEL ORDENADOR:",
    "options": [
      "a) Memoria RAM",
      "b) Ratón",
      "c) Drivers",
      "d) Disco duro"
    ],
    "correct": 2
  },
  {
    "question": "416. EN LOS CRITERIOS BÁSICOS DE LA COMPRA PÚBLICA ECOLÓGICA (CPE) DE LA UNIÓN EUROPEA, APLICABLES AL PAPEL RECICLADO PARA USOS PROFESIONALES, ESTE PAPEL DEBERÁ ESTAR FABRICADO:",
    "options": [
      "a) Al menos con un 50% de fibra de papel recuperado",
      "b) Al menos con un 75 % de fibra de papel recuperado.",
      "c) Al menos con un 40% de fibra de papel recuperado",
      "d) Al menos con un 90% de fibra de papel recuperado."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
