<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 22 (preguntas 305-318)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 22 (preguntas 305-318)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "305. ¿CÓMO SE DEFINE “CALIDAD” EN LA ATENCIÓN A LAS PERSONAS USUARIAS?",
    "options": [
      "a) Es proporcionar la mejor respuesta a las necesidades de la persona usuaria con los medios existentes.",
      "b) Es conseguir que la persona usuaria se encuentre satisfecha a pesar de no haber obtenido ninguna respuesta",
      "c) Es conseguir atender el mayor número de consultas posibles durante la jornada laboral",
      "d) Es proporcionar a la persona usuaria aquellos contactos que le resolverán sus necesidades"
    ],
    "correct": 0
  },
  {
    "question": "306. EN UN ESTILO POSITIVO DE COMUNICACIÓN SE HA DE EVITAR:",
    "options": [
      "a) Palabras amables",
      "b) Frases hechas y refranes",
      "c) Sonrisas",
      "d) Lenguaje conciso"
    ],
    "correct": 1
  },
  {
    "question": "307. AQUEL COMPORTAMIENTO QUE CONDUCE A VER LAS COSAS CON UN ENFOQUE NUEVO, ENCONTRANDO SOLUCIONES INÉDITAS, SE DENOMINA:",
    "options": [
      "a) Comportamiento   creativo",
      "b) Comportamiento positivo",
      "c) Comportamiento crítico",
      "d) Comportamiento tranquilizador"
    ],
    "correct": 0
  },
  {
    "question": "308. AQUELLOS COMPORTAMIENTOS IRRITANTES O GENERADORES DE CONFLICTOS SON:",
    "options": [
      "a) Comportamientos positivo, creativo y crítico",
      "b) Comportamientos defensivo, crítico, agresivo y creativo",
      "c) Comportamientos tranquilizador y defensivo",
      "d) Comportamientos defensivo, crítico y agresivo"
    ],
    "correct": 3
  },
  {
    "question": "309. DE ENTRE LOS SIGUIENTES TIPOS DE COMPORTAMIENTO, SEÑALE EL QUE SE HA DE EVITAR ANTE LA PERSONA USUARIA:",
    "options": [
      "a) La jerga de la Institución: abreviaturas, signos, términos de uso propios....",
      "b) Palabras tranquilizadoras",
      "c) Actitud positiva",
      "d) Actitud previsora"
    ],
    "correct": 0
  },
  {
    "question": "310. EN LA COMUNICACIÓN ¿QUÉ SE ENTIENDE POR CANAL?",
    "options": [
      "a) Es el vehículo del que nos servimos para transmitir un mensaje. Constituye el elemento puramente técnico de la comunicación.",
      "b) Es el conjunto de signos o símbolos utilizados en la comunicación.",
      "c) Es el retorno de la información desde la persona receptora a la emisora, posibilitando la autocorrección y el autocontrol.",
      "d) Es el conjunto se señales utilizados en la comunicación."
    ],
    "correct": 0
  },
  {
    "question": "311. LA POLÍTICA DE ATENCIÓN E INFORMACIÓN A LAS PERSONAS POR PARTE DE LA ADMINISTRACIÓN ESTÁ ORIENTADA A:",
    "options": [
      "a) Hacer prevalecer la atención presencial sobre otras modalidades.",
      "b) Promocionar exclusivamente los canales telemáticos.",
      "c) Interferir en la atención ciudadana desde la perspectiva unicanal",
      "d) Mejorar la atención a la ciudadanía desde una perspectiva unificada y multicanal."
    ],
    "correct": 3
  },
  {
    "question": "312. LA IMPLANTACIÓN DE UN SISTEMA ÚNICO DE INFORMACIÓN ADMINISTRATIVA SUPONE:",
    "options": [
      "a) La implantación de un sistema de información unificado y multicanal.",
      "b) Que el ciudadano podrá acudir a una única administración.",
      "c) La implantación de un sistema único, con un solo canal de transmisión.",
      "d) Que la Administración se dirige al ciudadano unilateralmente."
    ],
    "correct": 0
  },
  {
    "question": "313. ¿QUÉ DEBE CONSIGNAR UN REGISTRO GENERAL DE UN ORGANISMO PÚBLICO CUANDO RECIBE UNA NOTIFICACIÓN?",
    "options": [
      "a) Firma de la persona funcionaria que la recibe y sello oficial",
      "b) Nombre de la persona funcionaria que recibe la notificación, firma de la misma, DNI y fecha",
      "c) Únicamente es necesario el sello del Organismo",
      "d) Firma de la persona funcionaria que recibe la notificación"
    ],
    "correct": 2
  },
  {
    "question": "314. ¿EN QUE PLAZO SE DEBE REALIZAR EL 2º INTENTO DE ENTREGA DE UNA NOTIFICACIÓN?",
    "options": [
      "a) En los tres días siguientes al primer intento y en hora distinta",
      "b) Al día siguiente del primer intento y hora distinta",
      "c) A los dos días del primer intento y en hora distinta",
      "d) Al tercer día del primer intento y en hora distinta"
    ],
    "correct": 0
  },
  {
    "question": "315. EL IMPUESTO SOBRE EL VALOR AÑADIDO:",
    "options": [
      "a) Es un tributo de naturaleza directa que recae sobre el consumo.",
      "b) Es un tributo de naturaleza indirecta que recae sobre el consumo.",
      "c) Es un tributo de naturaleza directa que grava, entre otros, los premios de la Lotería Nacional.",
      "d) Es un tributo de naturaleza indirecta que grava los intereses de cuentas bancarias."
    ],
    "correct": 1
  },
  {
    "question": "316. ¿QUÉ ES EL ALBARÁN?",
    "options": [
      "a) Es un documento que acredita la recepción de un pedido.",
      "b) El documento elaborado por el receptor de la mercancía.",
      "c) El documento de pago que sustituye al cheque confirmado.",
      "d) Ninguna respuesta es correcta."
    ],
    "correct": 0
  },
  {
    "question": "317. ENTRE OTRAS, ¿QUÉ INFORMACIÓN HA DE INCLUIR EL ALBARÁN?",
    "options": [
      "a) Número de orden, Fecha de emisión y número de factura.",
      "b) Fecha de emisión, Nombre de parte emisora y receptora, NIF y domicilio.",
      "c) Número de la factura, producto, Número y fecha del pedido",
      "d) Número de orden, Fecha de emisión, Datos de parte emisora y receptora, Número y fecha del pedido, producto, cantidad."
    ],
    "correct": 3
  },
  {
    "question": "318. SEÑALE LA DIFERENCIA, ENTRE OTRAS, QUE EXISTE ENTRE LA FACTURA Y EL ALBARÁN:",
    "options": [
      "a) La factura la emite la parte compradora y el albarán la vendedora.",
      "b) La emisión del albarán es obligatoria, mientras que la de la factura no.",
      "c) La emisión del albarán no es obligatoria, mientras que la de la factura sí.",
      "d) Todas las respuestas son correctas."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
