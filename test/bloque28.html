<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 28 (preguntas 389-402)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 28 (preguntas 389-402)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "389. UN/A ADMINISTRATIVO/A ABANDONA EL SERVICIO DURANTE 3 HORAS Y NO TIENE JUSTIFICACIÓN:",
    "options": [
      "a) Podrá estar sujeto a sanción administrativa",
      "b) Está sujeto a responsabilidad civil",
      "c) Está sujeto a responsabilidad penal",
      "d) Está sujeto a responsabilidad civil, responsabilidad penal y a sanción administrativa"
    ],
    "correct": 0
  },
  {
    "question": "390. PARA HACER REUNIONES SE PUEDEN UTILIZAR MEDIOS QUE NECESITAN DE UNA PANTALLA PARA SER PROYECTADOS, ¿CUÁLES SON ESOS MEDIOS?",
    "options": [
      "a) Blogs gigantes, pizarras, pizarras iluminadas",
      "b) Transparencias, diapositivas, películas y videos",
      "c) Grabadora audio",
      "d) Muestras"
    ],
    "correct": 1
  },
  {
    "question": "391. CUANDO EN UNA REUNIÓN SE QUIEREN PONER TRANSPARENCIAS, ¿QUÉ APARATO SE NECESITA?",
    "options": [
      "a) Pizarra",
      "b) Video",
      "c) Aparato proyector",
      "d) Cartelógrafo"
    ],
    "correct": 2
  },
  {
    "question": "392. CUANDO SE UTILIZA LA TRADUCCIÓN SIMULTÁNEA:",
    "options": [
      "a) La sala escogida debe tener cabinas de traducción y equipos personales o transmisores personales portátiles",
      "b) La sala debe tener la megafonía alta",
      "c) La sala escogida debe tener sólo cabinas de traducción",
      "d) La sala escogida debe tener sólo transmisores portátiles"
    ],
    "correct": 0
  },
  {
    "question": "393. EN LAS REUNIONES SE ACONSEJA QUE LA COLOCACIÓN DE SILLAS EN LA SALA:",
    "options": [
      "a) Sea versátil, dependiendo del número de personas y del uso que se le vaya a dar",
      "b) Tenga forma de U",
      "c) Tenga forma de elipse",
      "d) Tenga forma rectangular"
    ],
    "correct": 0
  },
  {
    "question": "394. CUANDO SE REALIZA UNA REUNIÓN, LA DISPOSICIÓN CONVENCIONAL TIPO TEATRO:",
    "options": [
      "a) Es recomendable para las presentaciones de productos",
      "b) Es recomendable para hacer presentaciones, debates y lluvia de ideas",
      "c) Es recomendable para hacer dinámicas de grupo",
      "d) Es recomendable para dar conferencias, dar discursos y/o charlas y para presentaciones ejecutivas"
    ],
    "correct": 3
  },
  {
    "question": "395. CUANDO SE REALIZA UNA REUNIÓN, LA DISPOSICIÓN CONVENCIONAL EN FORMA DE “U”:",
    "options": [
      "a) Es recomendable para las presentaciones de productos",
      "b) Es recomendable para hacer presentaciones, debates y lluvia de ideas",
      "c) Es recomendable para hacer dinámicas de grupo",
      "d) Es recomendable para dar conferencias, dar discursos y/o charlas y para presentaciones ejecutivas"
    ],
    "correct": 2
  },
  {
    "question": "396. LOS DATOS DE UNA CREDENCIAL COMPLETA PARA UN CONGRESO SON:",
    "options": [
      "a) Logotipo, nombre del organizador",
      "b) Nombre de la persona participante",
      "c) Identificación del acto",
      "d) Logotipo, nombre del organizador, nombre de la persona participante e identificación del acto"
    ],
    "correct": 3
  },
  {
    "question": "397. ESTANDO SENTADO Y PARA EVITAR LESIONES DE ESPALDA, ¿CUÁL ES LA POSICIÓN ADECUADA?",
    "options": [
      "a) Inclinada hacia la mesa",
      "b) Con el tronco curvado",
      "c) Apoyado en el respaldo y con el tronco en posición vertical",
      "d) Sin apoyar los antebrazos en la mesa"
    ],
    "correct": 2
  },
  {
    "question": "398. ¿CUÁL ES LA DISTANCIA ADECUADA ENTRE LA PANTALLA DE VISUALIZACIÓN DE DATOS Y LOS OJOS DE QUIEN LA UTILIZA?",
    "options": [
      "a) Menos de 40 cm",
      "b) Entre 60 y 80 cm",
      "c) Más de 90 cm",
      "d) La que la persona usuaria elija"
    ],
    "correct": 1
  },
  {
    "question": "399. ¿QUÉ ES UN INVENTARIO?",
    "options": [
      "a) Es una nota de entrega",
      "b) Es un tipo de pedido",
      "c) Es un resumen de las mercancías almacenadas",
      "d) Es un tipo de envase"
    ],
    "correct": 2
  },
  {
    "question": "400. PARA QUE SE PRODUZCA UN FUEGO ES CONDICIÓN NECESARIA Y SUFICIENTE LA CONCURRENCIA DE:",
    "options": [
      "a) El combustible y una fuente de calor",
      "b) El combustible y el comburente, que generalmente es el oxígeno",
      "c) El combustible, el comburente y una fuente de calor",
      "d) El comburente y una fuente de calor"
    ],
    "correct": 2
  },
  {
    "question": "401. LA COMISIÓN DE IGUALDAD DE LA EHU SE CONSTITUYÓ EN EL AÑO:",
    "options": [
      "a) 2008",
      "b) 2010",
      "c) 2009",
      "d) 2011"
    ],
    "correct": 2
  },
  {
    "question": "402. SEGÚN EL IV PLAN DE IGUALDAD DE LA EHU ¿CUÁL ES LA RESPUESTA INCORRECTA RESPECTO A LA REPRESENTACIÓN?",
    "options": [
      "a) Se tiende a la paridad en el equipo de gobierno.",
      "b) A mayor rango, mayor presencia femenina.",
      "c) Hay menos directoras que directores.",
      "d) Hay más secretarias que secretarios."
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
