<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 6 (preguntas 76-90)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 6 (preguntas 76-90)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "76. SEGÚN EL ARTÍCULO 27 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LAS COPIAS AUTENTICADAS REALIZADAS POR UNA ADMINISTRACIÓN PÚBLICA.",
    "options": [
      "a) Surten únicamente efectos administrativos",
      "b) No tendrán ningún efecto administrativo",
      "c) Únicamente tendrán validez en la misma Administración que ha realizado la autenticación",
      "d) Tendrán validez en las restantes Administraciones, siempre que así lo hayan acordado por Resolución del órgano competente"
    ],
    "correct": 0
  },
  {
    "question": "77. LA COMPARECENCIA DE LOS/AS CIUDADANOS/AS ANTE LAS OFICINAS PÚBLICAS, YA SEA PRESENCIALMENTE O POR MEDIOS ELECTRÓNICOS, SÓLO SERÁ OBLIGATORIA:",
    "options": [
      "a) Cuando razones de interés público así lo aconsejen",
      "b) Cuando esté previsto en una norma con rango de Ley",
      "c) Cuando se crea oportuno para resolver un expediente",
      "d) Nunca"
    ],
    "correct": 1
  },
  {
    "question": "78. ¿CUÁNDO SE ENTIENDE PRACTICADA UNA NOTIFICACIÓN DE UN ACTO ADMINISTRATIVO POR MEDIOS ELECTRÓNICOS?",
    "options": [
      "a) Cuando se reciba en la bandeja de entrada del correo electrónico de la persona interesada",
      "b) Cuando se produzca el acceso a su contenido mediante comparecencia en la sede electrónica de la Administración u Organismo actuante",
      "c) Cuando se curse desde cualquiera de las aplicaciones informáticas de la Administración u Organismo actuante",
      "d) Ninguna de las anteriores es correcta"
    ],
    "correct": 1
  },
  {
    "question": "79. LA RESPONSABILIDAD SOBRE LA GESTIÓN DE UNA SEDE ELECTRÓNICA CORRESPONDE:",
    "options": [
      "a) A su titular.",
      "b) Al usuario que accede.",
      "c) A cualquier órgano administrativo.",
      "d) A empresas tecnológicas externas."
    ],
    "correct": 0
  },
  {
    "question": "80. SERÁN NULAS DE PLENO DERECHO LAS DISPOSICIONES ADMINISTRATIVAS (SEÑALE LA OPCIÓN INCORRECTA):",
    "options": [
      "a) Que vulneren la Constitución.",
      "b) Que vulneren las leyes u otras disposiciones administrativas de rango superior.",
      "c) Que regulen materias reservadas a la Ley.",
      "d) Que establezcan la retroactividad de disposiciones sancionadoras favorables y no restrictivas de derechos individuales."
    ],
    "correct": 3
  },
  {
    "question": "81. SEGÚN LA LEY DE EMPLEO PÚBLICO VASCO, SI A UN FUNCIONARIO INTERINO SE LE NOMBRA POR LA EXISTENCIA DE UNA PLAZA VACANTE ÉSTA DEBERÁ INCLUIRSE. EN UN PRINCIPIO EN:",
    "options": [
      "a) La oferta pública de empleo del ejercicio siguiente al que se produce su nombramiento.",
      "b) La oferta pública de empleo del ejercicio en el que se produce su nombramiento.",
      "c) Si no es posible incluirla en la del ejercicio en el que se produce su nombramiento se tiene que amortizar.",
      "d) Ninguna de las anteriores es correcta"
    ],
    "correct": 1
  },
  {
    "question": "82. SEGÚN LA LEY DE EMPLEO PÚBLICO VASCO ES CORRECTO SEÑALAR:",
    "options": [
      "a) El personal funcionario que permanezca en situaciones con o sin derecho a reserva de puesto podrá participar en las convocatorias de provisión de puestos de trabajo y promoción profesional.",
      "b) El personal funcionario que permanezca en situaciones con derecho a reserva de puesto podrá participar en las convocatorias de provisión de puestos de trabajo y promoción profesional.",
      "c) El personal funcionario que permanezca en situaciones con derecho a reserva de puesto podrá participar en las convocatorias de provisión de puestos de trabajo.",
      "d) El personal funcionario que permanezca en situaciones con derecho a reserva de puesto podrá participar en las convocatorias de promoción profesional."
    ],
    "correct": 1
  },
  {
    "question": "83. CUANDO EL PERSONAL FUNCIONARIO PROLONGUE VOLUNTARIAMENTE SU PERMANENCIA EN EL SERVICIO ACTIVO UNA VEZ REBASADA LA EDAD LEGAL DE JUBILACIÓN ORDINARIA:",
    "options": [
      "a) No podrá declararse la excedencia forzosa.",
      "b) No podrá declararse la situación de expectativa de destino.",
      "c) No podrá concederse la excedencia voluntaria por interés particular.",
      "d) No podrá concederse la excedencia voluntaria, en cualquiera de sus modalidades"
    ],
    "correct": 3
  },
  {
    "question": "84. EN VIRTUD DE LO ESTABLECIDO EN LA LEY DE EMPLEO PÚIBLICO VASCO, UN FUNCIONARIO PODRÁ SOLICITAR UNA EXCEDENCIA VOLUNTARIA POR INTERÉS PARTICULAR:",
    "options": [
      "a) Cuando haya prestado servicios efectivos en cualquiera de las Administraciones Públicas durante los cinco años inmediatamente anteriores y en ella no se podrá permanecer menos de dos años continuados.",
      "b) Cuando haya prestado servicios efectivos en cualquiera de las Administraciones Públicas durante los tres años inmediatamente anteriores y en ella no se podrá permanecer menos de dos años continuados.",
      "c) Cuando haya prestado servicios efectivos en cualquiera de las Administraciones Públicas durante los dos años inmediatamente anteriores, no estableciéndose un período mínimo de permanencia en esta situación.",
      "d) Aunque esté sometido a expediente disciplinario o esté pendiente del cumplimiento de una sanción."
    ],
    "correct": 0
  },
  {
    "question": "85. DE ACUERDO CON LA LEY 11/2022, DE 1 DE DICIEMBRE. DE EMPLEO PÚBLICO VASCO, NO ES CORRECTO SEÑALAR:",
    "options": [
      "a) Los cambios de situación administrativa se acordarán por resolución del órgano competente en materia de empleo público de la administración u organismo público correspondiente.",
      "b) Los cambios de situación administrativa deberán anotarse en el registro de personal.",
      "c) Los cambios de situación podrán efectuarse si se reúnen los requisitos exigidos para ello en cada caso.",
      "d) Los cambios de situación administrativa se producirán con necesidad de reingreso al servicio activo."
    ],
    "correct": 3
  },
  {
    "question": "86. RESPECTO AL RÉGIMEN DE INCOMPATIBILIDADES DE LOS FUNCIONARIOS AL SERVICIO DE LAS ADMINISTRACIONES PÚBLICAS VASCAS:",
    "options": [
      "a) El desempeño de un segundo puesto de trabajo en el sector privado requerirá la previa y expresa autorización de compatibilidad, mientras que si ese segundo puesto de trabajo se desarrolla en el sector público el funcionario únicamente deberá notificar este hecho a las respectivas Administraciones afectadas.",
      "b) No podrá autorizarse o reconocerse la compatibilidad de un funcionario cuando en las retribuciones complementarias que tenga derecho a percibir se incluya el factor de incompatibilidad.",
      "c) El régimen de incompatibilidades afecta únicamente a los funcionarios, no siendo de aplicación ni al personal eventual ni al personal laboral al servicio de las Administraciones Públicas.",
      "d) El desempeño de un segundo puesto de trabajo o actividad en el sector público o privado requerirá su comunicación fehaciente a las Administraciones implicadas, las cuales podrán en el plazo de 3 meses desde su notificación emitir resolución declarando su incompatibilidad. En caso de que no se produzca resolución expresa en el plazo indicado se entenderá este silencio positivo."
    ],
    "correct": 1
  },
  {
    "question": "87. SEGÚN LA LEY 11/2022, DE EMPLEO PÚBLICO VASCO, RESPECTO AL PERSONAL EVENTUAL:",
    "options": [
      "a) Su nombramiento se realiza por concurso de méritos.",
      "b) Su cese se produce únicamente por decisión expresa de la autoridad que lo nombró.",
      "c) Su número no puede superar los límites fijados por los órganos de gobierno correspondientes.",
      "d) Tiene las mismas funciones que el personal funcionario de carrera."
    ],
    "correct": 2
  },
  {
    "question": "88. DE ACUERDO CON EL ARTÍCULO 122 DE LA LEY 11/2022, DE 1 DE DICIEMBRE. DE EMPLEO PÚBLICO VASCO, SON RETRIBUCIONES COMPLEMENTARIAS:",
    "options": [
      "a) El complemento de destino correspondiente al nivel del puesto que se desempeñe, cuya cuantía se fijará anualmente en los Presupuestos Generales de la Comunidad Autónoma.",
      "b) El complemento específico, que, a salvo de norma o pacto en contrario, será único por cada puesto de trabajo que lo tenga asignado. Este complemento retribuye las condiciones particulares de cada puesto en razón de la especial dificultad técnica, responsabilidad, dedicación, penosidad o peligrosidad, así como cualquier otra condición que concurra en el puesto de trabajo.",
      "c) El complemento de carrera profesional, que retribuirá la progresión profesional del personal funcionario a través de los diferentes grados de desarrollo profesional en los que se articula el sistema de carrera profesional de las administraciones públicas vascas.",
      "d) Todas las anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "89. RESPECTO AL COMPLEMENTO DE ESPECIAL DEDICACIÓN EN LAS RETRIBUCIONES DEL PERSONAL DE ADMINISTRACIÓN Y SERVICIOS FUNCIONARIO DE LA EHU:",
    "options": [
      "a) Su cuantía no podrá exceder del 50% del importe del nivel de clasificación del puesto de trabajo.",
      "b) Su percepción no anula otros derechos a compensación por la jornada de trabajo que exceda de la normalizada.",
      "c) Exige una jornada de presencia física que exceda en más de 100 horas a la normalizada.",
      "d) Corresponde al Consejo Económico y Social el reconocimiento de este derecho."
    ],
    "correct": 2
  },
  {
    "question": "90. RESPECTO A LOS PROCESOS DE PROMOCIÓN INTERNA DEL PERSONAL TÉCNICO, DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS FUNCIONARIO DE LA EHU:",
    "options": [
      "a) Podrán incluir pruebas de conocimientos generales o específicos.",
      "b) Corresponde a la Sección de Personal técnico, de gestión y administración y servicios de la EHU desarrollar la normativa sobre la carrera profesional de este personal.",
      "c) Corresponde a la Gerencia de la EHU desarrollar la normativa sobre la carrera profesional de este personal.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
