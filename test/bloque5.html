<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 5 (preguntas 61-75)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 5 (preguntas 61-75)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "61. EL MANTENIMIENTO DEL REGISTRO GENERAL DE LA EHU ES FUNCIÓN DE",
    "options": [
      "a) La Secretaria o Secretario General.",
      "b) La Rectora o Rector.",
      "c) Los o las jefes de servicio correspondientes.",
      "d) Los Vicerrectorados de Campus."
    ],
    "correct": 0
  },
  {
    "question": "62. LA TRAMITACIÓN SIMPLIFICADA DEL PROCEDIMIENTO PODRÁ SER ACORDADA POR LAS ADMINISTRACIONES PÚBLICAS",
    "options": [
      "a) De oficio, cuando la falta de complejidad del procedimiento así lo aconsejen.",
      "b) De oficio, cuando razones de interés público así lo aconsejen.",
      "c) De oficio o a solicitud del interesado, cuando la falta de complejidad del procedimiento así lo aconsejen.",
      "d) De oficio o a solicitud del interesado, cuando razones de interés público o la falta de complejidad del procedimiento así lo aconsejen."
    ],
    "correct": 3
  },
  {
    "question": "63. SEGÚN LO DISPUESTO EN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, COMO REGLA GENERAL, SEÑALE EN QUÉ LENGUA SE TRAMITARÁN LOS PROCEDIMIENTOS ADMINISTRATIVOS POR PARTE DE LA EHU",
    "options": [
      "a) En castellano",
      "b) En castellano y en las demás lenguas cooficiales",
      "c) En este supuesto el uso de la lengua se ajustará a lo previsto en la legislación autonómica correspondiente",
      "d) En este supuesto el uso de la lengua será elegido por la EHU"
    ],
    "correct": 2
  },
  {
    "question": "64. DESDE QUE SE DICTÓ EL ACTO ADMINISTRATIVO, LA DECLARACIÓN DE LESIVIDAD NO PODRÁ ADOPTARSE UNA VEZ TRANSCURRIDO:",
    "options": [
      "a) 3 meses.",
      "b) 1 año.",
      "c) 2 años.",
      "d) 4 años"
    ],
    "correct": 3
  },
  {
    "question": "65. EL RECURSO EXTRAORDINARIO DE REVISIÓN SE INTERPONDRÁ DENTRO DE UN PLAZO DE 4 AÑOS SIGUIENTES A LA FECHA DE LA NOTIFICACIÓN DE LA RESOLUCIÓN IMPUGNADA CUANDO:",
    "options": [
      "a) Al dictarlos se hubiera incurrido en error de hecho, que resulte de los propios documentos incorporados al expediente.",
      "b) Aparezcan documentos de valor esencial para la resolución del asunto que, aunque sean posteriores, evidencie el error de la resolución recurrida.",
      "c) En la resolución hayan influido esencialmente documentos o testimonios declarados falsos por sentencia judicial firme, anterior o posterior a aquella resolución.",
      "d) La resolución se hubiera dictado como consecuencia de prevaricación, cohecho, violencia, maquinación fraudulenta u otra conducta punible y se haya declarado así en virtud de sentencia judicial firme."
    ],
    "correct": 0
  },
  {
    "question": "66. ANTE LAS ADMINISTRACIONES PÚBLICAS, PODRÁN ACTUAR EN REPRESENTACIÓN DE OTRAS:",
    "options": [
      "a) Las personas físicas con o sin capacidad de obrar y las personas jurídicas, aunque no esté previsto en sus Estatutos.",
      "b) Las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos.",
      "c) Las personas físicas con capacidad de obrar y las personas jurídicas, siempre que ello no esté previsto en sus Estatutos.",
      "d) Las personas físicas con o sin capacidad de obrar y las personas jurídicas, siempre que ello esté previsto en sus Estatutos."
    ],
    "correct": 1
  },
  {
    "question": "67. LA INTERPOSICIÓN DE UN RECURSO DEBERÁ EXPRESAR:",
    "options": [
      "a) El nombre y apellidos del recurrente, así como la identificación personal del mismo, junto con el acto que se recurre y la razón de su impugnación.",
      "b) Lugar, fecha, firma del recurrente, identificación del medio y, en su caso, del lugar que se señale a efectos de notificaciones, así como el órgano, centro o unidad administrativa al que se dirige y su correspondiente código de identificación.",
      "c) Las demás particularidades exigidas, su caso, por las disposiciones específicas.",
      "d) Todas las opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "68. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LOS REGISTROS ELECTRÓNICOS DE TODAS Y CADA UNA DE LAS ADMINISTRACIONES DEBEN CUMPLIR UNA CARACTERÍSTICA ESENCIAL:",
    "options": [
      "a) Que sean técnicamente intercambiables, de modo que se garantice su compatibilidad informática e interconexión, así como la transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros.",
      "b) Que deberán ser plenamente interoperables, de modo que se garantice su compatibilidad informática e interconexión, así como la transmisión telemática de los asientos registrales y de los documentos que se presenten en cualquiera de los registros.",
      "c) Que sean plenamente interoperables, con independencia de su compatibilidad informática",
      "d) Que estén normalizados según la norma UNE-EN ISO 19160-4:2017."
    ],
    "correct": 1
  },
  {
    "question": "69. DE ACUERDO CON LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿EN QUÉ PROCEDIMIENTO TIENEN LAS ADMINISTRACIONES PÚBLICAS OBLIGACIÓN DE RESOLVER?",
    "options": [
      "a) Especialmente en todos los procedimientos que se inicien de oficio por denuncia.",
      "b) Como regla general, en todos los procedimientos que se inicien de oficio.",
      "c) En todos los procedimientos cualquiera que sea su forma de iniciación.",
      "d) Sólo en los procedimientos sancionadores, con independencia de su forma de finalización."
    ],
    "correct": 2
  },
  {
    "question": "70. SEGÚN EL ARTÍCULO 40 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿CUÁL ES EL PLAZO DE NOTIFICACIÓN DE LOS ACTOS ADMINISTRATIVOS DESDE QUE SON DICTADOS?",
    "options": [
      "a) 7 días",
      "b) 10 días",
      "c) 15 días",
      "d) 20 días"
    ],
    "correct": 1
  },
  {
    "question": "71. SEGÚN EL ARTÍCULO 41 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LAS NOTIFICACIONES SE PRACTICARÁN PREFERENTEMENTE:",
    "options": [
      "a) Por la vía postal",
      "b) Por la vía telefónica",
      "c) Por medios electrónicos",
      "d) Por el medio más rápido y económico para la Administración"
    ],
    "correct": 2
  },
  {
    "question": "72. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LAS RESOLUCIONES ADMINISTRATIVAS QUE VULNEREN LO ESTABLECIDO EN UNA DISPOSICIÓN REGLAMENTARIA SON:",
    "options": [
      "a) Válidas",
      "b) Nulas",
      "c) Anulables",
      "d) Convalidables"
    ],
    "correct": 1
  },
  {
    "question": "73. SEGÚN EL ARTÍCULO 21 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿CUÁL ES EL PLAZO DE NOTIFICACIÓN DE LA RESOLUCIÓN EXPRESA, SI EL PROCEDIMIENTO TIENE NORMA REGULADORA ESPECÍFICA PERO NO FIJA EL PLAZO?",
    "options": [
      "a) En el plazo fijado por la norma reguladora específica de una materia afín",
      "b) En el plazo de 3 meses",
      "c) En el plazo de 6 meses",
      "d) En el plazo de 1 año"
    ],
    "correct": 1
  },
  {
    "question": "74. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, LOS ACTOS ADMINISTRATIVOS PRODUCIDOS POR SILENCIO ADMINISTRATIVO PUEDEN HACERSE VALER ANTE:",
    "options": [
      "a) Exclusivamente ante la Administración instructora del expediente",
      "b) Ante la Administración, así como ante cualquier persona física o jurídica, pública o privada",
      "c) Sólo ante personas físicas",
      "d) Sólo ante personas físicas o jurídicas públicas"
    ],
    "correct": 1
  },
  {
    "question": "75. EL ARTÍCULO 35 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ESTABLECE QUE SERÁN MOTIVADOS, CON SUCINTA REFERENCIA DE HECHOS Y FUNDAMENTOS DE DERECHO:",
    "options": [
      "a) Los que resuelvan procedimientos de revisión de oficio de disposiciones o actos administrativos",
      "b) Los que resuelvan recursos administrativos",
      "c) Los que resuelvan procedimientos de arbitraje",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
