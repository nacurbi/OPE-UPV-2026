<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 30 (preguntas 417-430)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 30 (preguntas 417-430)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "417. ¿QUÉ ES UN SISTEMA OPERATIVO?:",
    "options": [
      "a) Es un hardware que gestiona los recursos del ordenador.",
      "b) Es un lenguaje de programación.",
      "c) Es un software que proporciona un entorno de trabajo donde se pueden ejecutar programas.",
      "d) Es un software multitarea."
    ],
    "correct": 2
  },
  {
    "question": "418. ¿QUÉ ES UN OCR?",
    "options": [
      "a) Un dispositivo para calibrar impresoras.",
      "b) Un dispositivo para calibrar monitores.",
      "c) Una aplicación de calibración de monitores.",
      "d) Una aplicación de reconocimiento de caracteres."
    ],
    "correct": 3
  },
  {
    "question": "419. ¿CUÁLES DE LOS SIGUIENTES SON DOMINIOS DE INTERNET DENOMINADOS GTLD O DE NIVEL SUPERIOR GENÉRICO?",
    "options": [
      "a) .eu, .eus y .es",
      "b) .uk y .es",
      "c) .com, .net, .org y .info..",
      "d) .inter, .mov y .tld"
    ],
    "correct": 2
  },
  {
    "question": "420. SEGÚN LA LEY 23/2011, DE 29 DE JULIO, DE DEPÓSITO LEGAL, ¿QUÉ ES UN DOCUMENTO ELECTRONICO?",
    "options": [
      "a) Espacio en Internet de una empresa, organización, o de una persona física, asociado a un nombre o una dirección, que permite que su información o contenido, productos o servicios, sean accesibles.",
      "b) Información o contenido de cualquier naturaleza, en un soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado, que sea objeto de difusión.",
      "c) Información o contenido de cualquier naturaleza en soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado.",
      "d) Punto de acceso electrónico formado por una o varias páginas electrónicas agrupadas en un dominio de Internet."
    ],
    "correct": 2
  },
  {
    "question": "421. SEGÚN LA LEY 23/2011, DE 29 DE JULIO, DE DEPÓSITO LEGAL, ¿QUÉ ES UN DOMINIO DE INTERNET?",
    "options": [
      "a) Espacio en Internet de una empresa, organización, o de una persona física, asociado a un nombre o una dirección, que permite que su información o contenido, productos o servicios, sean accesibles.",
      "b) Información o contenido de cualquier naturaleza, en un soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado, que sea objeto de difusión.",
      "c) Información o contenido de cualquier naturaleza en soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado.",
      "d) Punto de acceso electrónico formado por una o varias páginas electrónicas agrupadas en un dominio de Internet."
    ],
    "correct": 0
  },
  {
    "question": "422. SEGÚN LA LEY 23/2011, DE 29 DE JULIO, DE DEPÓSITO LEGAL, ¿QUÉ ES UN SITIO WEB?",
    "options": [
      "a) Espacio en Internet de una empresa, organización, o de una persona física, asociado a un nombre o una dirección, que permite que su información o contenido, productos o servicios, sean accesibles.",
      "b) Información o contenido de cualquier naturaleza, en un soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado, que sea objeto de difusión.",
      "c) Información o contenido de cualquier naturaleza en soporte electrónico, archivado con un formato determinado y susceptible de identificación y tratamiento diferenciado.",
      "d) Punto de acceso electrónico formado por una o varias páginas electrónicas agrupadas en un dominio de Internet."
    ],
    "correct": 3
  },
  {
    "question": "423. SEGÚN LA LEY 23/2011, DE 29 DE JULIO, DE DEPÓSITO LEGAL, ¿QUÉ ES “UN PUNTO DE ACCESO ELECTRÓNICO FORMADO POR UNA O VARIAS PÁGINAS ELECTRÓNICAS AGRUPADAS EN UN DOMINIO DE INTERNET”?",
    "options": [
      "a) Un documento electrónico.",
      "b) Un dominio de internet.",
      "c) Un sitio web.",
      "d) Una publicación electrónica."
    ],
    "correct": 2
  },
  {
    "question": "424. SEGÚN LA LEY 23/2011, DE 29 DE JULIO, DE DEPÓSITO LEGAL, ¿QUÉ ES “LA INFORMACIÓN O CONTENIDO DE CUALQUIER NATURALEZA EN SOPORTE ELECTRÓNICO, ARCHIVADO CON UN FORMATO DETERMINADO Y SUSCEPTIBLE DE IDENTIFICACIÓN Y TRATAMIENTO DIFERENCIADO”?",
    "options": [
      "a) Un documento electrónico.",
      "b) Un dominio de internet.",
      "c) Un sitio web.",
      "d) Una publicación electrónica."
    ],
    "correct": 0
  },
  {
    "question": "425. INDIQUE LA AFIRMACIÓN INCORRECTA EN REFERENCIA AL SISTEMA DE SEGURIDAD SOCIAL:",
    "options": [
      "a) El Sistema Especial para Empleados de Hogar está dentro del Régimen General de la Seguridad Social.",
      "b) El Régimen Especial de Minería del Carbón es uno de los Regímenes Especiales de la Seguridad Social.",
      "c) El Régimen Especial Agrario es uno de los Regímenes Especiales de la Seguridad Social.",
      "d) El Sistema Especial de la Industria Resinera está dentro del Régimen General de la Seguridad Social."
    ],
    "correct": 2
  },
  {
    "question": "426. SEÑALE LA AFIRMACIÓN INCORRECTA:",
    "options": [
      "a) El Sistema de la Seguridad Social da cobertura sólo a las personas que ejercen una actividad profesional, así como a los familiares o asimilados que tuvieran a su cargo.",
      "b) El Sistema de la Seguridad Social es un conjunto de regímenes a través de los cuales el Estado garantiza a las personas comprendidas en su campo de aplicación la protección adecuada en las contingencias y situaciones que la ley define.",
      "c) La protección que ofrece el Sistema de la Seguridad Social también es de aplicación a personas que cumplan los requisitos exigidos en la modalidad no contributiva.",
      "d) La protección que ofrece el Sistema de la Seguridad Social también es de aplicación a los familiares o asimilados que las personas beneficiarias tuvieran a su cargo."
    ],
    "correct": 0
  },
  {
    "question": "427. EL DERECHO A LA PROTECCIÓN DE LA SALUD SE RECONOCE EN LA CONSTITUCIÓN ESPAÑOLA COMO:",
    "options": [
      "a) Un derecho de los ciudadanos",
      "b) Un derecho fundamental",
      "c) Un principio rector de la política social y económica",
      "d) Un deber de los ciudadanos"
    ],
    "correct": 2
  },
  {
    "question": "428. A EFECTOS DE LAS PRESTACIONES DE MODALIDAD CONTRIBUTIVA, ESTÁN INCLUIDOS DENTRO DEL CAMPO DE APLICACIÓN DEL SISTEMA DE LA SEGURIDAD SOCIAL, CUALQUIERA QUE SEA SU SEXO, ESTADO CIVIL O PROFESIÓN,",
    "options": [
      "a) Sólo los españoles que tengan su residencia en España, aunque estén trabajando permanentemente en el extranjero.",
      "b) Las personas extranjeras que residan o se encuentren legalmente en España, siempre que el empleador tenga su domicilio fiscal en España.",
      "c) Todos los españoles que residan en España, y los extranjeros que residan o se encuentren legalmente en España, siempre que, en el caso de estos últimos, ejerzan su actividad en territorio nacional.",
      "d) Todos los españoles que residan en España, y los extranjeros que residan o se encuentren legalmente en España, siempre que, en ambos supuestos, ejerzan su actividad en territorio nacional."
    ],
    "correct": 3
  },
  {
    "question": "429. LOS CONVENIOS ESPECIALES QUE SE PUEDEN SUSCRIBIR CON LA SEGURIDAD SOCIAL:",
    "options": [
      "a) Con carácter general son un acuerdo suscrito voluntariamente por los trabajadores con la Tesorería General de la Seguridad Social para poder percibir una cuantía mayor en la jubilación.",
      "b) Con carácter general es un acuerdo suscrito obligatoriamente por los trabajadores con la Tesorería General de la Seguridad Social con el fin de generar, mantener o ampliar, en determinadas situaciones, el derecho a las prestaciones de la Seguridad Social",
      "c) En el convenio especial de empresas y trabajadores sujetos a expedientes de regulación de empleo que incluya a trabajadores de 55 o más años, la suscripción se ofrece voluntariamente por la Dirección Provincial de trabajo.",
      "d) En el convenio especial de empresas y trabajadores sujetos a expedientes de regulación de empleo que incluya a trabajadores de 55 o más años, el acuerdo se suscribe por la empresa y el/la trabajador/a de una parte y la Tesorería General de la Seguridad Social de otra."
    ],
    "correct": 3
  },
  {
    "question": "430. INDIQUE CUAL DE LOS SIGUIENTES GRUPOS NO SE INCLUYE DENTRO DE LA MODALIDAD CONTRIBUTIVA A EFECTO DE PRESTACIONES DE LA SEGURIDAD SOCIAL:",
    "options": [
      "a) Trabajadores por cuenta propia o autónomos.",
      "b) Socios trabajadores de cooperativas de trabajo asociado.",
      "c) Personas que sólo trabajan en las labores de su hogar particular.",
      "d) Estudiantes."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
