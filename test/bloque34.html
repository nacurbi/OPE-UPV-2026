<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 34 (preguntas 473-486)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 34 (preguntas 473-486)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "473. EN TODA CONTRATACIÓN DEL SECTOR PÚBLICO:",
    "options": [
      "a) Se incorporarán de manera facultativa criterios sociales y medioambientales siempre que guarden relación con el objeto del contrato.",
      "b) Se incorporarán de manera potestativa criterios sociales y medioambientales en la convicción de que su inclusión proporciona una mejor relación calidad-precio.",
      "c) Se incorporarán de manera transversal y preceptiva criterios sociales y medioambientales siempre que guarde relación con el objeto del contrato",
      "d) Se facilitará el acceso a la contratación pública de las grandes y pequeñas empresas, así como de las empresas de economía social."
    ],
    "correct": 2
  },
  {
    "question": "474. SEÑALE LA RESPUESTA INCORRECTA. A LOS EFECTOS DE LA LEY 9/2017, DE 8 DE NOVIEMBRE, DE CONTRATOS DEL SECTOR PÚBLICO, FORMAN PARTE DEL SECTOR PÚBLICO:",
    "options": [
      "a) Las Entidades Gestoras y los Servicios Comunes de la Seguridad Social.",
      "b) Las Universidades Públicas y Privadas.",
      "c) Las Mutuas colaboradoras con la Seguridad Social.",
      "d) Las Juntas Generales de los Territorios Históricos del País Vasco en lo que respecta a su actividad de contratación."
    ],
    "correct": 1
  },
  {
    "question": "475. DE ACUERDO CON LA LEGISLACIÓN VIGENTE EN MATERIA DE CONTRATOS DEL SECTOR PÚBLICO, LOS CONTRATOS DE SERVICIOS:",
    "options": [
      "a) No podrán ser objeto de estos contratos los servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos.",
      "b) Son aquellos en cuya virtud uno o varios poderes adjudicadores encomiendan a título oneroso a una o varias personas, naturales o jurídicas, la gestión de un servicio cuya prestación sea de su titularidad o competencia.",
      "c) Tienen por objeto la adquisición, el arrendamiento financiero, o el arrendamiento, con o sin opción de compra, de productos o bienes muebles.",
      "d) Su contrapartida viene constituida bien por el derecho a explotar los servicios objeto del contrato o bien por dicho derecho acompañado del de percibir un precio."
    ],
    "correct": 0
  },
  {
    "question": "476. DE ACUERDO CON LA LEGISLACIÓN VIGENTE EN MATERIA DE CONTRATOS DEL SECTOR PÚBLICO, LOS CONTRATOS DE SERVICIOS:",
    "options": [
      "a) Podrán ser objeto de estos contratos los servicios que impliquen ejercicio de la autoridad inherente a los poderes públicos.",
      "b) Es aquel en cuya virtud uno o varios poderes adjudicadores encomiendan a título oneroso a una o varias personas, naturales o jurídicas, la gestión de un servicio cuya prestación sea de su titularidad o competencia,",
      "c) Son aquellos cuyo objeto son prestaciones de hacer consistentes en el desarrollo de una actividad o dirigidas a la obtención de un resultado distinto de una obra o suministro, incluyendo aquellos en que el adjudicatario se obligue a ejecutar el servicio de forma sucesiva y por precio unitario.",
      "d) Su contrapartida viene constituida bien por el derecho a explotar los servicios objeto del contrato o bien por dicho derecho acompañado del de percibir un precio."
    ],
    "correct": 2
  },
  {
    "question": "477. SEÑALE LA RESPUESTA INCORRECTA. QUEDAN EXCLUIDOS DEL ÁMBITO DE LA LEY 9/2017, DE 8 DE NOVIEMBRE, DE CONTRATOS DEL SECTOR PÚBLICO:",
    "options": [
      "a) Las relaciones jurídicas consistentes en la prestación de un servicio público cuya utilización por los usuarios requiera el abono de una tarifa, tasa o precio público de aplicación general.",
      "b) Los contratos regulados en la legislación laboral.",
      "c) Los contratos mixtos.",
      "d) Las encomiendas de gestión reguladas en la legislación vigente en materia de régimen jurídico del sector público."
    ],
    "correct": 2
  },
  {
    "question": "478. SEÑALE LA OPCIÓN INCORRECTA. EN EL PERFIL DEL CONTRATANTE, EN EL CASO DE LA INFORMACIÓN RELATIVA A LOS CONTRATOS, DEBERÁ PUBLICARSE AL MENOS:",
    "options": [
      "a) El objeto detallado del contrato.",
      "b) su duración.",
      "c) El presupuesto base de licitación.",
      "d) El importe de adjudicación, sin IVA."
    ],
    "correct": 3
  },
  {
    "question": "479. SOLO PODRÁN CONTRATAR CON EL SECTOR PÚBLICO:",
    "options": [
      "a) Las personas jurídicas que tengan plena capacidad de obrar, no estén incursas en alguna prohibición de contratar, y acrediten su solvencia económica y financiera y técnica o profesional o, en los casos en que así lo exija esta Ley, se encuentren debidamente clasificadas.",
      "b) Las personas naturales o jurídicas, españolas o extranjeras, que tengan plena capacidad de obrar, no estén incursas en alguna prohibición de contratar, y acrediten su solvencia económica y financiera y técnica o profesional o, en los casos en que así lo exija esta Ley, se encuentren debidamente clasificadas.",
      "c) Las personas naturales o jurídicas, españolas o comunitarias, que tengan plena capacidad de obrar, no estén incursas en alguna prohibición de contratar, y acrediten su solvencia económica y financiera y técnica o profesional o, en los casos en que así lo exija esta Ley, se encuentren debidamente clasificadas.",
      "d) Las personas naturales que tengan plena capacidad de obrar, no estén incursas en alguna prohibición de contratar, y acrediten su solvencia económica y financiera y técnica o profesional o, en los casos en que así lo exija esta Ley, se encuentren debidamente clasificadas."
    ],
    "correct": 1
  },
  {
    "question": "480. NO PODRÁN CONTRATAR LAS PERSONAS EN QUIÉNES CONCURRA ALGUNA DE LAS SIGUIENTES CIRCUNSTANCIAS:",
    "options": [
      "a) Haber sido condenadas civilmente mediante sentencia.",
      "b) No cumplir el requisito de que al menos el 5 por ciento de sus empleados sean trabajadores con discapacidad.",
      "c) Haber solicitado la declaración de concurso voluntario.",
      "d) Hallarse al corriente en el cumplimiento de las obligaciones tributarias o de Seguridad Social."
    ],
    "correct": 2
  },
  {
    "question": "481. EL OBJETO DE LOS CONTRATOS DEL SECTOR PÚBLICO:",
    "options": [
      "a) Podrá fraccionarse con la finalidad de disminuir la cuantía del mismo.",
      "b) Deberá ser determinado.",
      "c) Siempre que la naturaleza o el objeto del contrato lo permitan, deberá preverse la realización independiente de cada una de sus partes mediante su división en lotes, salvo en el contrato de obras.",
      "d) El órgano de contratación que proceda a la división en lotes del objeto del contrato, no podrá limitar el número de lotes que pueden adjudicarse a cada licitador."
    ],
    "correct": 1
  },
  {
    "question": "482. DADAS LAS SIGUIENTES REFERENCIAS BIBLIOGRÁFICAS:\n\n    1. Manzanos Bilbao, C. (1998). Salir de prisión: la otra condena. Zerbitzuan, 35, 64-70.\n    2. Moix Martínez, M. (2006). Teoría del trabajo social. Madrid: Síntesis.\n    3. Rodríguez Martín, V. (2003). Los recursos sociales. En T. Fernández García y M.C. Alemán Bracho (Coords.), Introducción al trabajo social (pp. 373-393). Madrid: Alianza.\n\nIDENTIFIQUE LA CLASE DE DOCUMENTO A LA QUE CORRESPONDE CADA UNA:",
    "options": [
      "a) 1.Libro; 2. Artículo de revista; 3. Capítulo de libro",
      "b) 1. Artículo de revista; 2. Libro; 3. Capítulo de libro",
      "c) 1.Capítulo de libro; 2. Artículo de periódico; 3. Ponencia en congreso",
      "d) 1.Capítulo de libro; 2. Ponencia de congreso; 3. Artículo de periódico"
    ],
    "correct": 1
  },
  {
    "question": "483. EN EL MÓDULO DE CIRCULACIÓN DE UN SISTEMA INTEGRADO DE GESTIÓN BIBLIOTECARIA EL PRÉSTAMO DE UN LIBRO VINCULA:",
    "options": [
      "a) Un registro bibliográfico con un registro de persona usuaria",
      "b) Un registro de ejemplar con un registro de persona usuaria",
      "c) Un registro de persona usuaria con un registro de autoridad",
      "d) Un registro bibliográfico con un registro de ejemplar"
    ],
    "correct": 1
  },
  {
    "question": "484. COMO REGLA GENERAL, EN LA BIBLIOTECA DE LA EHU SE EXCLUYEN DEL PRÉSTAMO A DOMICILIO:",
    "options": [
      "a) Los cómics",
      "b) Los videos",
      "c) Las tesis no publicadas",
      "d) Los CD-ROM"
    ],
    "correct": 2
  },
  {
    "question": "485. UNA BIBLIOTECA QUE RECOGE, TRATA Y DIFUNDE INFORMACIÓN RELATIVA A UN TEMA O GRUPO DE TEMAS AFINES, CUYA COLECCIÓN SE CENTRA EN UNA MATERIA O ÁREA CONCRETA DEL CONOCIMIENTO ES:",
    "options": [
      "a) Una biblioteca local",
      "b) Una biblioteca especializada",
      "c) Una biblioteca universitaria",
      "d) Una biblioteca nacional"
    ],
    "correct": 1
  },
  {
    "question": "486. EN LA CLASIFICACIÓN DECIMAL UNIVERSAL, ¿QUÉ TIENEN EN COMÚN LOS AUXILIARES DE FORMA Y LUGAR?",
    "options": [
      "a) Van entre paréntesis",
      "b) Van entre comillas",
      "c) Van entre corchetes",
      "d) Ninguna de las respuestas anteriores es cierta"
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
