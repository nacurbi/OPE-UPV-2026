<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema29</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>Tema 29. Ley 10/1982, de Normalización del Uso del Euskera:</strong> Derechos, deberes y Plan de Normalización del Uso del Euskera en la UPV/EHU.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "146. EL DL1/2023 DE 16 MARZO. POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES V HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA PARA LAS MUJERES. ¿QUÉ PORCENTAJE MÍNIMO DE REPRESENTACIÓN DE CADA SEXO ESTABLECE PARA QUE EXISTA REPRESENTACIÓN EQUILIBRADA EN ÓRGANOS PLURIPERSONALES DE MÁS DE CUATRO MIEMBRO:",
    "options": [
      "a) 30 %.",
      "b) 35 %.",
      "c) 40 %.",
      "d) 50 %."
    ],
    "correct": 2
  },
  {
    "question": "148. SEÑALE LA RESPUESTA CORRECTA:",
    "options": [
      "a) El IV Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2024/2028.",
      "b) El II Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2019/2022.",
      "c) El IV Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2019/2022.",
      "d) El III Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2020/2023."
    ],
    "correct": 0
  },
  {
    "question": "179. CONFORME AL PLAN ACTUAL DE IGUALDAD DE MUJERES Y HOMBRES LA EHU DEBE GARANTIZAR LA IGUALDAD:",
    "options": [
      "a) Sólo en el PDI.",
      "b) Sólo en el PTGAS.",
      "c) Sólo en el estudiantado.",
      "a) En toda la comunidad universitaria."
    ],
    "correct": 3
  },
  {
    "question": "180. SEGÚN EL DL 1/2023 DE 16 MARZO, POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES Y HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA PARA LAS MUJERES, LA FORMACIÓN EN MATERIA DE IGUALDAD DE MUJERES Y HOMBRES PARA EL PERSONAL DE LOS PODERES PÚBLICOS VASCOS DEBE SER:",
    "options": [
      "a) Voluntaria, progresiva y periódica.",
      "b) Básica, progresiva, permanente y obligatoria.",
      "c) Específica, puntual y evaluable.",
      "d) Avanzada, obligatoria y exclusivamente presencial."
    ],
    "correct": 1
  },
  {
    "question": "228. LA SOCIEDAD, EN LA QUE SE PRODUCE UN DESEQUILIBRIO EN EL REPARTO DEL PODER, BENEFICIANDO A LOS HOMBRES EN PERJUICIO DE LOS DERECHOS O DEL LIBRE EJERCICIO DE LOS DERECHOS DE LAS MUJERES, RECIBE LA DENOMINACIÓN DE:",
    "options": [
      "a) Sociedad masculinizada",
      "b) Patriarcado",
      "c) Sociedad machista",
      "d) Androgenia"
    ],
    "correct": 1
  },
  {
    "question": "229. LA PERSPECTIVA O ANÁLISIS DE GÉNERO ES:",
    "options": [
      "a) Un constructor político",
      "b) Un concepto sociológico",
      "c) Una herramienta de análisis",
      "d) Una forma de interpretar las diferencias de sexo"
    ],
    "correct": 2
  },
  {
    "question": "230. ¿QUÉ ORGANO PRESIDE LA COMISIÓN INTERINSTITUCIONAL PARA LA IGUALDAD DE MUJERES V HOMBRES:",
    "options": [
      "a) La Consejera de Igualdad, Justicia y Políticas Sociales.",
      "b) La Directora de Emakunde.",
      "c) El Lehendakari del Gobierno Vasco.",
      "d) La persona presidenta del Parlamento Vasco."
    ],
    "correct": 1
  },
  {
    "question": "231. EN EL ÁMBITO DE LA IGUALDAD, LAS ACCIONES POSITIVAS:",
    "options": [
      "a) Tienen un carácter permanente",
      "b) Tienen un carácter temporal",
      "c) Tienen un carácter discriminatorio",
      "d) Tienen un carácter no transversal"
    ],
    "correct": 1
  },
  {
    "question": "401. LA COMISIÓN DE IGUALDAD DE LA EHU SE CONSTITUYÓ EN EL AÑO:",
    "options": [
      "a) 2008",
      "b) 2010",
      "c) 2009",
      "d) 2011"
    ],
    "correct": 2
  },
  {
    "question": "402. SEGÚN EL IV PLAN DE IGUALDAD DE LA EHU ¿CUÁL ES LA RESPUESTA INCORRECTA RESPECTO A LA REPRESENTACIÓN?",
    "options": [
      "a) Se tiende a la paridad en el equipo de gobierno.",
      "b) A mayor rango, mayor presencia femenina.",
      "c) Hay menos directoras que directores.",
      "d) Hay más secretarias que secretarios."
    ],
    "correct": 1
  },
  {
    "question": "403. SEÑALE LA RESPUESTA CORRECTA:",
    "options": [
      "a) El III Plan de Igualdad de Mujeres y Hombres de la EHU encomienda a la EHU a poner en vigor antes del 2022 un Protocolo contra las violencias de género.",
      "b) La EHU aplica a la comunidad universitaria el Protocolo contra las violencias de género aprobado en mayo de 2016 por la Consejería de Universidades del Gobierno Vasco.",
      "c) El Consejo de Gobierno aprobó en junio de 2018 el Protocolo de la EHU contra las violencias de género.",
      "d) Por Resolución de la Rectora de 7 de junio de 2018 se aprobó el Protocolo de la EHU contra las violencias de género."
    ],
    "correct": 2
  },
  {
    "question": "404. EL IV PLAN DE IGUALDAD DE MUJERES V HOMBRES DE LA EHU BUSCA ELIMINAR:",
    "options": [
      "a) Diferencias académicas.",
      "b) Roles y estereotipos de género.",
      "c) Idiomas cooficiales.",
      "d) Autonomía universitaria."
    ],
    "correct": 1
  },
  {
    "question": "405. EL DÍA INTERNACIONAL DE LA MUJER Y LA NIÑA EN LA CIENCIA SE CONMEMORA CADA:",
    "options": [
      "a) 8 de marzo.",
      "b) 25 de noviembre.",
      "c) 11 de febrero.",
      "d) El viernes incluido en la Semana de la Ciencia (evento anual)."
    ],
    "correct": 2
  },
  {
    "question": "406. ¿CUÁNDO EXISTE DISCRIMINACIÓN INDIRECTA POR RAZÓN DE SEXO?:",
    "options": [
      "a) Cuando una persona es tratada de manera menos favorable que otra por razón de su sexo.",
      "b) Cuando un acto jurídico, criterio o práctica aparentemente neutra perjudica a una proporción sustancialmente mayor de personas de un mismo sexo, sin justificación objetiva.",
      "c) Cuando se producen actos de acoso sexual en el ámbito laboral.",
      "d) Cuando una norma establece tratamientos diferentes para mujeres y hombres sin ningún motivo."
    ],
    "correct": 1
  },
  {
    "question": "407. SEGÚN EL VIGENTE PLAN DE IGUALDAD DE LA EHU. LA \"SEGREGACIÓN VERTICAL\" IMPLICA:",
    "options": [
      "a) Diferencias entre ramas académicas.",
      "b) Distribución desigual por sexos en posiciones jerárquicas.",
      "c) Diferencias en el estudiantado.",
      "d) Diferencias en elección de estudios."
    ],
    "correct": 1
  },
  {
    "question": "499. EN RELACIÓN CON LAS COMPETENCIAS DE LA ADMINISTRACIÓN DE LA COMUNIDAD AUTÓNOMA. SEÑALE LA AFIRMACIÓN INCORRECTA:",
    "options": [
      "a) Corresponde a la Administración autonómica la planificación y coordinación general, así como la elaboración de normas y directrices generales en materia de igualdad.",
      "b) La Administración autonómica tiene competencia para la evaluación de las políticas de igualdad en el ámbito de la Comunidad Autónoma.",
      "c) La asistencia técnica especializada en materia de igualdad a las entidades locales y al resto de poderes públicos vascos corresponde a la Administración autonómica.",
      "d) La Administración autonómica carece de potestad sancionadora en materia de igualdad de mujeres y hombres, correspondiendo esta exclusivamente a las administraciones forales."
    ],
    "correct": 3
  },
  {
    "question": "500. EL IV PLAN DE IGUALDAD DE MUJERES V HOMBRES DE LA EHU SE ALINEA CON:",
    "options": [
      "a) ODS 3",
      "b) ODS 4",
      "c) ODS 5",
      "d) ODS 10"
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
