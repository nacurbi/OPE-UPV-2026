<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 24 (preguntas 333-346)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 24 (preguntas 333-346)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "333. LA EVACUACIÓN DEL CENTRO DE TRABAJO SE REALIZA CUANDO:",
    "options": [
      "a) Se ve humo en el centro de trabajo.",
      "b) Todas las etapas de protección, detección y extinción del fuego han fallado y existe riesgo para la vida de las personas.",
      "c) Cuando los sprinklers comienzan a funcionar.",
      "d) Cuando se ha llamado a los bomberos."
    ],
    "correct": 1
  },
  {
    "question": "334. CON LA SEÑALIZACIÓN DE SEGURIDAD SE PRETENDE:",
    "options": [
      "a) Hacer recomendaciones de seguridad en forma de cartel.",
      "b) Lograr que la persona trabajadora se quede inmóvil cuando vea la señal.",
      "c) Estimular al/a la trabajador/a a través de los sentidos, para informarle del riesgo.",
      "d) Ordenar el tráfico de los vehículos dentro de la empresa."
    ],
    "correct": 2
  },
  {
    "question": "335. INDIQUE EL ORDEN QUE DEBEN LLEVAR LAS ACCIONES EN SEGURIDAD:",
    "options": [
      "a) Actuar sobre el receptor, actuar sobre el medio, actuar sobre el riesgo.",
      "b) Actuar sobre la máquina, actuar sobre el/la trabajador/a, actuar sobre el método de trabajo.",
      "c) Actuar sobre el riesgo, actuar sobre el medio, actuar sobre el receptor.",
      "d) Actuar sobre el medio, actuar sobre el riesgo, actuar sobre el receptor."
    ],
    "correct": 2
  },
  {
    "question": "336. ¿CUÁL DE LAS SIGUIENTES ACTUACIONES CON UN EXTINTOR ES CORRECTA? MARQUE LA RESPUESTA CORRECTA",
    "options": [
      "a) quitar el pasador de seguridad, tirando de la anilla.",
      "b) sujetar la manguera de salida del extintor.",
      "c) dirigirse hacia el incendio y situarse a un metro de distancia al menos.",
      "d) Todas las actuaciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "337. SEGÚN EL ART. 14 DE LA LEY DE PREVENCIÓN DE RIESGOS LABORALES ...",
    "options": [
      "a) Los/as trabajadores/as tienen derecho a una protección eficaz.",
      "b) Los/as trabajadores/as tienen derecho a una protección integral.",
      "c) Los/as trabajadores/as tienen derecho a una evaluación eficaz.",
      "d) Los/as trabajadores/as tienen derecho a una protección permanente."
    ],
    "correct": 0
  },
  {
    "question": "338. LA REALIZACIÓN DE SIMULACROS TENDRÁ COMO OBJETIVOS LA VERIFICACIÓN Y COMPROBACIÓN DE:",
    "options": [
      "a) Que todo el personal de la plantilla se ha leído el plan de emergencia y de esa manera cumplir con la Ley 31/1995, sobre Prevención de Riesgos Laborales",
      "b) Que al menos el/la Portero Mayor del centro se ha leído el plan de emergencia, con lo que se garantiza que la puertas y salidas de evacuación estará abiertas en caso de emergencia",
      "c) Que se ha presentado a Protección Civil el Plan de Emergencia y de esa manera en caso de emergencia serán ellos/as los/as que llamen a los/as bomberos/as",
      "d) La eficacia de la organización de respuesta ante una emergencia, la capacitación del personal, el entrenamiento de todo el personal de la actividad en la respuesta frente a una emergencia, la suficiencia e idoneidad de los medios y recursos asignados, la adecuación de los procedimientos de actuación."
    ],
    "correct": 3
  },
  {
    "question": "339. CUÁLES SON LAS CUATRO DISCIPLINAS O ESPECIALIDADES DE LA PREVENCIÓN DE RIESGOS LABORALES:",
    "options": [
      "a) Seguridad en el Trabajo, Higiene Industrial, Ergonomía y Psicosociología aplicada.",
      "b) Seguridad en el Trabajo, Higiene Industrial, Ergonomía y Psicosociología aplicada y Medicina en el Trabajo.",
      "c) Seguridad Laboral, Higiene Industrial, Seguridad Estructural y Vigilancia de la Salud.",
      "d) Seguridad en el Trabajo, Higiene Industrial, Ergonomía Estructural y Medicina en el Trabajo."
    ],
    "correct": 1
  },
  {
    "question": "340. SEÑALA EL NÚMERO DE DELEGADOS/AS DE PREVENCIÓN QUE LE CORRESPONDE TENER A LAS EMPRESAS QUE TIENEN UNA PLANTILLA CON 503 TRABAJADORES/AS:",
    "options": [
      "a) 2.",
      "b) 3.",
      "c) 4.",
      "d) 5."
    ],
    "correct": 2
  },
  {
    "question": "341. SEGÚN EL R.D. 486/1997, SOBRE DISPOSICIONES MÍNIMAS EN LUGARES DE TRABAJO, EL NIVEL DE ILUMINACIÓN EXIGIDO EN VÍAS DE CIRCULACIÓN ES .",
    "options": [
      "a) Si la vía es de uso ocasional, 50 lux, y si es de uso habitual, 100 lux .",
      "b) Si la vía es de uso ocasional, 25 lux, y si es de uso habitual, 50 lux .",
      "c) Si la vía es de uso ocasional, 100 lux, y si es de uso habitual, 200 lux .",
      "d) Si la vía es de uso ocasional, 20 lux, y si es de uso habitual, 60 lux ."
    ],
    "correct": 1
  },
  {
    "question": "342. EN RELACION CON LA PREVENCIÓN DE RIESGOS LABORALES, PODEMOS ENCONTRAR LOS COLORES:",
    "options": [
      "a) Rojo, verde, azul, amarillo o amarillo-anaranjado",
      "b) Rojo, amarillo o amarillo-anaranjado",
      "c) Rojo, blanco, negro, azul o verde",
      "d) Rojo, azul, negro o blanco"
    ],
    "correct": 0
  },
  {
    "question": "343. EN RELACIÓN CON LA PREVENCIÓN DE RIESGOS LABORALES, EL COLOR AMARILLO EN UNA SEÑAL SIGNIFICA:",
    "options": [
      "a) Comportamiento o acción específica.",
      "b) Obligación de utilizar un equipo de protección individual.",
      "c) Comportamientos peligrosos.",
      "d) Atención, precaución."
    ],
    "correct": 3
  },
  {
    "question": "344. EN RELACIÓN CON LA PREVENCIÓN DE RIESGOS LABORALES, LAS SEÑALES DE PROHIBICIÓN:",
    "options": [
      "a) Tienen forma redonda",
      "b) Tienen forma cuadrada",
      "c) Tienen forma rectangular",
      "d) Tienen forma triangular"
    ],
    "correct": 0
  },
  {
    "question": "345. EN RELACIÓN CON LA PREVENCIÓN DE RIESGOS LABORALES, LAS SEÑALES DE OBLIGACIÓN:",
    "options": [
      "a) Tienen forma redonda",
      "b) Tienen forma cuadrada",
      "c) Tienen forma rectangular",
      "d) Tienen forma triangular"
    ],
    "correct": 0
  },
  {
    "question": "346. LOS ACCIDENTES GRAVES O MUY GRAVES O QUE AFECTEN A MÁS DE CUATRO TRABAJADORES/AS DEBEN COMUNICARSE A LA AUTORIDAD LABORAL DE LA PROVINCIA:",
    "options": [
      "a) Inmediatamente",
      "b) En un plazo máximo de 12 horas.",
      "c) En un plazo máximo de 24 horas",
      "d) En un plazo máximo de 18 horas."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
