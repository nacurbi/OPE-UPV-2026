<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 2 (preguntas 16-30)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 2 (preguntas 16-30)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "16. SEGÚN EL ESTATUTO DE AUTONOMÍA DEL PAÍS VASCO, LA REAL ACADEMIA DE LA LENGUA VASCA EUSKALTZAINDIA ES:",
    "options": [
      "a) Institución del Gobierno Vasco para servir de archivo oficial del euskera.",
      "b) Institución consultiva oficial en lo referente al Euskera.",
      "c) Institución oficial de estudio, análisis e investigación del euskera.",
      "d) Institución cultural oficial del Gobierno Vasco para el desarrollo e impulso del euskera."
    ],
    "correct": 1
  },
  {
    "question": "17. SEGÚN EL ESTATUTO DE AUTONOMÍA DEL PAÍS VASCO, LAS COMPETENCIAS DE DESARROLLO LEGISLATIVO Y EJECUCIÓN SON MATERIAS:",
    "options": [
      "a) En las que al Estado corresponde la fijación de las normas básicas y a la Comunidad Autónoma el desarrollo legislativo.",
      "b) En las que al Estado corresponde la fijación de las normas básicas y al Territorio Histórico el desarrollo legislativo y ejecución.",
      "c) En las que el Estado no tiene ninguna competencia y, por tanto, corresponde al Gobierno Vasco el desarrollo normativo y ejecución.",
      "d) En las que a la Comunidad Autónoma corresponde la fijación de las bases generales y a los Territorios Históricos el desarrollo normativo."
    ],
    "correct": 0
  },
  {
    "question": "18. EN MATERIA DE INVESTIGACIÓN CIENTÍFICA Y TÉCNICA LA COMUNIDAD AUTÓNOMA DEL PAÍS VASCO TIENE COMPETENCIA:",
    "options": [
      "a) Exclusiva en coordinación con el Estado",
      "b) Absoluta en coordinación con el Estado",
      "c) De desarrollo legislativo y de ejecución dentro de su territorio de la legislación básica del Estado",
      "d) Ejecutiva"
    ],
    "correct": 0
  },
  {
    "question": "19. EL TRIBUNAL VASCO DE CUENTAS PÚBLICAS DEPENDE DIRECTAMENTE DE:",
    "options": [
      "a) De las Juntas Generales de los tres Territorios Históricos.",
      "b) Del Parlamento Vasco.",
      "c) Del Gobierno Vasco.",
      "d) Del Departamento de Hacienda y Economía del Gobierno Vasco."
    ],
    "correct": 1
  },
  {
    "question": "20. DE ACUERDO A LA LEY 12/2002, DE 23 DE MAYO, POR LA QUE SE APRUEBA EL CONCIERTO ECONÓMICO DE LA COMUNIDAD AUTÓNOMA DEL PAÍS VASCO, EL IMPUESTO SOBRE SOCIEDADES ES:",
    "options": [
      "a) Un tributo concertado de normativa autónoma para los sujetos pasivos que tengan su domicilio fiscal en el País Vasco.",
      "b) Una competencia exclusiva del Estado.",
      "c) Un tributo concertado de normativa común para aquellas sociedades que operen exclusivamente en territorio vasco.",
      "d) El Concierto Económico no considera el Impuesto sobre Sociedades como ámbito de aplicación."
    ],
    "correct": 0
  },
  {
    "question": "21. SEÑALE LA RESPUESTA INCORRECTA. EL REGLAMENTO EUROPEO:",
    "options": [
      "a) es obligatorio en todos sus elementos",
      "b) es directamente aplicable en cada Estado Miembro.",
      "c) es obligatorio para el Estados miembro destinatario en cuanto al resultado que deba conseguirse.",
      "d) tiene alcance general."
    ],
    "correct": 2
  },
  {
    "question": "22. EL CONSEJO EUROPEO:",
    "options": [
      "a) Ejercerá conjuntamente con el Parlamento Europeo la función legislativa y la función presupuestaria.",
      "b) Dará a la Unión los impulsos necesarios para su desarrollo y definirá sus orientaciones y prioridades políticas generales.",
      "c) Supervisará la aplicación del Derecho de la Unión bajo el control del Tribunal de Justicia de la Unión Europea.",
      "d) Estará compuesto por un representante de cada Estado miembro, de rango ministerial."
    ],
    "correct": 1
  },
  {
    "question": "23. SEÑALE LA RESPUESTA CORRECTA:",
    "options": [
      "a) El Consejo Europeo no tiene competencia legislativa.",
      "b) El Consejo Europeo estará compuesto por los Ministros de Asuntos Exteriores de los Estados miembros.",
      "c) Participará en los trabajos del Consejo Europeo el Alto Representante de la Unión para Asuntos Fiscales y Política Económica.",
      "d) El Consejo Europeo se reunirá una vez por semestre por convocatoria de su Presidente."
    ],
    "correct": 0
  },
  {
    "question": "24. EN RELACIÓN CON LAS INSTITUCIONES EUROPEAS, SEÑALE LA RESPUESTA INCORRECTA:",
    "options": [
      "a) Cuando el orden del día lo exija, los miembros del Consejo Europeo podrán decidir contar, cada uno de ellos, con la asistencia de un ministro.",
      "b) Cuando la situación lo exija, el Presidente convocará una reunión extraordinaria del Consejo Europeo.",
      "c) El Consejo Europeo se pronunciará siempre por consenso.",
      "d) El Consejo Europeo elegirá a su Presidente por mayoría cualificada para un mandato de dos años y medio."
    ],
    "correct": 2
  },
  {
    "question": "25. PARA EJERCER LAS COMPETENCIAS DE LA UNIÓN, LAS INSTITUCIONES DE LA UNIÓN EUROPEA ADOPTARÁN:",
    "options": [
      "a) Decretos.",
      "b) Dictámenes, que serán vinculantes.",
      "c) Leyes.",
      "d) Directivas."
    ],
    "correct": 3
  },
  {
    "question": "26. EL REGLAMENTO COMUNITARIO:",
    "options": [
      "a) Se integra en el Derecho Interno de cada miembro comunitario, sin que se requiera ningún otro trámite",
      "b) No son de aplicación directa, por lo que obliga a los Estados miembros a aprobar una serie de medidas para incorporarlo a su Derecho Nacional",
      "c) Puede dirigirse a uno a varios Estados miembros.",
      "d) Son correctas las respuestas a) y c)."
    ],
    "correct": 0
  },
  {
    "question": "27. SEÑALE LA AFIRMACIÓN CORRECTA EN RELACIÓN AL TRIBUNAL DE JUSTICIA DE LA UNIÓN EUROPEA.",
    "options": [
      "a) El Tribunal de Justicia de la Unión Europea comprenderá el Tribunal de Justicia, el Tribunal General y los tribunales especializados.",
      "b) El Tribunal General estará asistido por abogados generales.",
      "c) El Tribunal de Justicia dispondrá al menos de un juez por Estado miembro.",
      "d) El Tribunal General dispondrá de un juez por Estado miembro."
    ],
    "correct": 0
  },
  {
    "question": "28. EL TRIBUNAL DE JUSTICIA DE LA UNIÓN EUROPEA SE PRONUNCIARÁ, DE CONFORMIDAD CON LOS TRATADOS SOBRE LOS RECURSOS INTERPUESTOS POR:",
    "options": [
      "a) Un Estado miembro.",
      "b) Una institución",
      "c) Por personas físicas o jurídicas",
      "d) Las tres respuestas anteriores con correctas"
    ],
    "correct": 3
  },
  {
    "question": "29. LA APROBACIÓN DE UNA LEY ORGÁNICA EXIGE:",
    "options": [
      "a) La mayoría simple del Congreso y del Senado reunidos en sesión conjunta.",
      "b) La mayoría de 2/3 del Congreso y la mayoría absoluta del Senado sobre el conjunto del proyecto.",
      "c) La mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto.",
      "d) La mayoría simple del Congreso, pero sólo podrá aprobarse cuando verse sobre determinadas materias relacionadas con los derechos fundamentales y las libertades públicas, la aprobación de los Estatutos de Autonomía y el régimen electoral general."
    ],
    "correct": 2
  },
  {
    "question": "30. LOS DECRETOS-LEYES:",
    "options": [
      "a) Son Disposiciones Legislativas provisionales emanadas por el Gobierno y dictadas en casos de extraordinaria y urgente necesidad.",
      "b) Son Disposiciones Legislativas definitivas emanadas por el Gobierno y dictadas en casos de extraordinaria y urgente necesidad.",
      "c) Son Disposiciones Legislativas emanadas por el Gobierno sobre cualquier materia excepto los derechos y libertades de los ciudadanos.",
      "d) Son Disposiciones Legislativas provisionales emanadas por el Gobierno y dictadas en casos de extraordinaria y urgente necesidad que requieren la convalidación posterior del Congreso y el Senado reunidos en sesión conjunta."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
