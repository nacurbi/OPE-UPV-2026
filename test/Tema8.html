<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema8</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>Tema 8. Ley 4/2005, para la Igualdad de Mujeres y Hombres:</strong> Principios generales y III Plan de Igualdad en la UPV/EHU.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "158. SEGÚN EL ARTÍCULO 2 DE LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, LA LENGUA PROPIA DEL PAÍS VASCO ES:",
    "options": [
      "a) El euskera.",
      "b) El euskera, aunque también se puede utilizar el castellano como lengua oficial.",
      "c) El euskera, que además es lengua oficial subsidiaria al castellano.",
      "d) Todas las respuestas anteriores son incorrectas."
    ],
    "correct": 0
  },
  {
    "question": "159. SEGÚN EL ARTÍCULO 15 DE LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, SE RECONOCE A TODO EL ALUMNADO EL DERECHO DE RECIBIR LA ENSEÑANZA …:",
    "options": [
      "a) ….en euskera obligatoriamente en todos los niveles educativos.",
      "b) …en castellano obligatoriamente en todos los niveles educativos.",
      "c) ….tanto en euskera como en castellano en los diversos niveles educativos.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 2
  },
  {
    "question": "160. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, EL GOBIERNO VASCO REGULARÁ LOS MODELOS LINGÜÍSTICOS A IMPARTIR EN CADA CENTRO EDUCATIVO TENIENDO EN CUENTA:",
    "options": [
      "a) La voluntad de los padres o tutores/as y la situación socio-lingüística de la zona.",
      "b) La voluntad de los padres o tutores y la situación socio-económica de las familias.",
      "c) La voluntad de los padres o tutores y la situación socio-sanitaria de las familias.",
      "d) Las respuestas b) y c) son correctas."
    ],
    "correct": 0
  },
  {
    "question": "161. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, LAS LENGUAS OFICIALES EN LA COMUNIDAD AUTÓNOMA DEL PAÍS VASCO, SON:",
    "options": [
      "a) El castellano, que es la única lengua oficial",
      "b) El euskera, que es la única lengua oficial",
      "c) EL euskera y el castellano",
      "d) Todas las respuestas son falsas"
    ],
    "correct": 2
  },
  {
    "question": "162. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, EL EUSKERA ES:",
    "options": [
      "a) La lengua propia del País Vasco, junto con el castellano",
      "b) La única lengua propia del País Vasco",
      "c) La única lengua oficial del País Vasco",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 1
  },
  {
    "question": "163. SEGÚN EL ARTÍCULO 14 DE LA 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, ¿CUÁL DE LAS SIGUIENTES AFIRMACIONES ES LA CORRECTA?",
    "options": [
      "a) Los poderes públicos adoptarán las medidas tendentes a la progresiva euskaldunización del personal afecto a la Administración Pública de la Comunidad Autónoma del País Vasco",
      "b) En las pruebas selectivas que se realicen para el acceso a las demás plazas se considerará, entre otros méritos, el nivel de conocimiento de las lenguas oficiales en la Comunidad Autónoma Vasca",
      "c) Los poderes públicos determinarán las plazas para las que es preceptivo el conocimiento de ambas lenguas",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "164. SEGÚN LA LEY 10/1982, BÁSICA DE NORMALIZACIÓN DEL USO DEL EUSKERA, SE RECONOCEN A LOS/AS CIUDADANOS/AS DEL PAÍS VASCO LOS SIGUIENTES DERECHOS LINGÜÍSTICOS FUNDAMENTALES:",
    "options": [
      "a) Derecho a recibir la enseñanza en ambas lenguas oficiales",
      "b) Derecho a recibir en euskera publicaciones periódicas, programaciones de radio y televisión y de otros medios de comunicación",
      "c) Derecho a expresarse en euskera en cualquier reunión",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "413. ESTARÁN EXENTOS DEL CUMPLIMIENTO DEL RÉGIMEN GENERAL DE PRECEPTIVIDAD DE LOS PERFILES LINGÜÍSTICOS EN RELACIÓN CON EL PUESTO DE TRABAJO DEL QUE SON TITULARES:",
    "options": [
      "a) Las personas que superen la edad de 55 años al inicio de cada período de planificación en el que se asigne la fecha de preceptividad al puesto de trabajo del que son titulares, previa conformidad de la persona interesada. Asimismo, también estarán exentas las personas que, en caso de que se apruebe la modificación del perfil lingüístico previamente asignado al puesto de trabajo del que son titulares, superen la edad de 45 años, previa conformidad de la persona interesada.",
      "b) Las personas cuyo nivel de estudios realizados alcanzara los de Bachiller Elemental, Educación General Básica o Educación Secundaria Obligatoria, ni otros que, en el futuro, pudieran sustituir a estos, prescindiendo de las equivalencias y convalidaciones que contemple el ordenamiento jurídico a otros fines respecto al Certificado de Escolaridad.",
      "c) Las personas en las que no concurra carencia manifiesta y contrastada de las destrezas aptitudinales necesarias en el proceso de aprendizaje del idioma mediante los programas de formación y capacitación lingüística de personas adultas.",
      "d) Todas las respuestas anteriores son incorrectas"
    ],
    "correct": 3
  },
  {
    "question": "453. LAS ENTIDADES DEL SECTOR PÚBLICO VASCO INSPIRARÁN EL PROCESO DE NORMALIZACIÓN DEL USO DEL EUSKERA EN LOS SIGUIENTES PRINCIPIOS RECTORES:",
    "options": [
      "a) Principio de no discriminación.",
      "b) Principio de eficacia y eficiencia.",
      "c) Principio de concentración.",
      "d) Las respuestas a) y b) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "497. LOS PERFILES LINGÜÍSTICOS ACREDITADOS EN PROCESOS SELECTIVOS O DE PROVISIÓN POR AQUELLAS PERSONAS ASPIRANTES QUE. EN VIRTUD DE DICHOS PROCEDIMIENTOS, NO LLEGARAN A ACCEDER A LA CONDICIÓN DE PERSONA EMPLEADA AL SERVICIO DE LA ENTIDAD DEL SECTOR PÚBLICO VASCO",
    "options": [
      "a) Perderán su validez a los dos años.",
      "b) La parte escrita mantendrá su validez por tiempo indefinido, mientras que la parte oral contará con tres llamamientos extraordinarios para ser superada.",
      "c) Tendrán validez por tiempo indefinido.",
      "d) Ninguna de las respuestas es correcta."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
</html>
