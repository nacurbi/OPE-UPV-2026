<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 8 (preguntas 106-120)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 8 (preguntas 106-120)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "106. LAS DECISIONES RELATIVAS AL RÉGIMEN DISCIPLINARIO DE ESTUDIANTES, PERSONAL DOCENTE E INVESTIGADOR Y PERSONAL TÉCNICO DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS QUE LA LEGISLACIÓN VIGENTE NO ATRIBUYA A OTRO ÓRGANO SERÁN ADOPTADAS POR:",
    "options": [
      "a) El o la Aldezle",
      "b) La Rectora o El Rector",
      "c) El Comité Arbitral",
      "d) El Comité de Seguridad y Salud Intercampus"
    ],
    "correct": 1
  },
  {
    "question": "107. EN LA EHU, LA INSTITUCIÓN INDEPENDIENTE E IMPARCIAL QUE PROMOVERÁ LA UTILIZACIÓN DE MODOS ALTERNATIVOS, NO ADVERSARIALES, PARA PREVENIR Y RESOLVER PROBLEMAS Y CONFLICTOS RELACIONADOS CON LA ACTIVIDAD UNIVERSITARIA EN TODOS SUS NIVELES ES:",
    "options": [
      "a) El o la Aldezle",
      "b) Comité de Empresa",
      "c) Comité de Seguridad y Salud Laboral",
      "d) La Rectora o El Rector"
    ],
    "correct": 0
  },
  {
    "question": "108. EN LA EHU, EL ÓRGANO QUE DETERMINA LAS PLAZAS PARA LAS QUE ES PRECEPTIVO EL CONOCIMIENTO DE EUSKERA Y CASTELLANO ES:",
    "options": [
      "a) El Consejo de Gobierno",
      "b) El Claustro Universitario",
      "c) El Comité de Empresa",
      "d) La Junta de Personal"
    ],
    "correct": 0
  },
  {
    "question": "109. EN LA EHU, LA MODIFICACIÓN DE CAMPUS UNIVERSITARIOS CORRESPONDE A:",
    "options": [
      "a) El Consejo de Gobierno a propuesta del Claustro Universitario",
      "b) El Claustro Universitario a propuesta del Consejo de Gobierno",
      "c) El Consejo de Gobierno a propuesta del Campus Universitario",
      "d) Al Campus Universitario a propuesta propia"
    ],
    "correct": 1
  },
  {
    "question": "110. SIN PERJUICIO DE LAS DELEGACIONES QUE EFECTÚE, EL ÓRGANO DE CONTRATACIÓN DE LA EHU ES:",
    "options": [
      "a) El o la Gerente",
      "b) La Rectora o El Rector",
      "c) El o la Vicegerente de Contratación y Compras",
      "d) El Claustro Universitario."
    ],
    "correct": 1
  },
  {
    "question": "111. EL DERECHO A LA LIBERTAD DE CÁTEDRA, RECONOCIDO EN EL TEXTO CONSTITUCIONAL, IMPLICA QUE:",
    "options": [
      "a) Las/os catedráticas/os y profesoras/es tienen derecho a enseñar conforme a sus propios criterios y con los métodos que consideren más convenientes.",
      "b) El alumnado puede elegir libremente las asignaturas que estimen más convenientes para su formación universitaria o profesional.",
      "c) Las cátedras pueden adjudicarse por libre designación, esto es, sin previa oposición, concurso o concurso-oposición.",
      "d) Las/os catedráticas/os tienen derecho a enseñar conforme a sus propios criterios y con los métodos que estimen más convenientes."
    ],
    "correct": 0
  },
  {
    "question": "112. EL ESTATUTO BÁSICO DEL EMPLEADO PÚBLICO ENTRE OTROS SE APLICA A…",
    "options": [
      "a) Únicamente al personal funcionario de las Universidades Públicas.",
      "b) Únicamente al personal laboral de las Universidades Públicas.",
      "c) Al personal funcionario y en lo que proceda al personal laboral al servicio de las Universidades Públicas.",
      "d) A todo el personal de las Universidades Privadas y únicamente al personal funcionario en las Universidades Públicas."
    ],
    "correct": 2
  },
  {
    "question": "113. EL PERSONAL EMPLEADO PÚBLICO SE CLASIFICA EN…",
    "options": [
      "a) Personal funcionario de carrera, personal funcionario interino, personal laboral, ya sea fijo, por tiempo indefinido o temporal y personal eventual.",
      "b) Personal funcionario de carrera y personal funcionario Interino.",
      "c) Personal funcionario de carrera, personal funcionario interino y personal laboral fijo.",
      "d) Personal funcionario de carrera, personal laboral fijo y personal eventual."
    ],
    "correct": 0
  },
  {
    "question": "114. SEGÚN EL ESTATUTO BÁSICO DEL EMPLEADO PÚBLICO, ES PERSONAL LABORAL…",
    "options": [
      "a) Quien, en virtud de nombramiento legal, están vinculados a una Administración Pública por una relación estatutaria regulada por el Derecho Administrativo para el desempeño de servicios profesionales retribuidos de carácter permanente.",
      "b) Quien, en virtud de contrato de trabajo formalizado por escrito, en cualquiera de las modalidades de contratación de personal previstas en la legislación laboral, presta servicios retribuidos por las Administraciones Pública.",
      "c) Quien, por razones expresamente justificadas de necesidad y urgencia, es nombrado como tal para el desempeño de funciones propias de personal funcionario de carrera.",
      "d) Quien, en virtud de nombramiento y con carácter no permanente, sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial, siendo retribuido con cargo a los créditos presupuestarios consignados para este fin."
    ],
    "correct": 1
  },
  {
    "question": "115. ¿QUIÉN APRUEBA DE FORMA DEFINITIVA EL PRESUPUESTO DE LA EHU?",
    "options": [
      "a) La Rectora o El Rector.",
      "b) La Decana o El Decano.",
      "c) El Consejo de Gobierno.",
      "d) El Consejo Social."
    ],
    "correct": 3
  },
  {
    "question": "116. LOS COMITÉS DESEGURIDAD Y SALUD DE LA EHU SON:",
    "options": [
      "a) Un Comité Intercampus, un Comité de Seguridad y Salud por cada Campus y un Comité para la Seguridad Medioambiental.",
      "b) Un Comité Intercampus, un Comité para la Seguridad Medioambiental e Inspección de Trabajo.",
      "c) Un Comité Intercampus y un Comité de Seguridad y Salud por cada Campus.",
      "d) Un Comité Intercampus, un Comité de Seguridad y Salud por cada Campus e Inspección de Trabajo."
    ],
    "correct": 2
  },
  {
    "question": "117. SON MIEMBROS DEL PERSONAL TÉCNICO, DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS DE LA EHU…",
    "options": [
      "a) Personal funcionario, personal contratado laboral y funcionarios y funcionarias de otras Administraciones Públicas que, de acuerdo con la legislación vigente, presten servicio en la EHU.",
      "b) Personal funcionario y funcionarios y funcionarias de otras Administraciones Públicas que, de acuerdo con la legislación vigente, presten servicio en la EHU.",
      "c) Personal laboral y funcionarios y funcionarias de otras Administraciones Públicas que, de acuerdo con la legislación vigente, presten servicio en la EHU.",
      "d) Sólo personal funcionario."
    ],
    "correct": 0
  },
  {
    "question": "118. SEGÚN LOS ESTATUTOS DE LA EHU, LAS ENSEÑANZAS UNIVERSITARIAS OFICIALES SE ESTRUCTURARÁN EN...",
    "options": [
      "a) Tres ciclos: grado, máster y doctorado.",
      "b) Dos ciclos: grado y máster.",
      "c) Tres ciclos: grado, máster y formación profesional.",
      "d) Dos ciclos: grado y doctorado."
    ],
    "correct": 0
  },
  {
    "question": "119. SEGÚN LOS ESTATUTOS DE LA EHU, LA EHU ES UNA UNIVERSIDAD...",
    "options": [
      "a) Multicampus.",
      "b) Pluricampus.",
      "c) Monocampus.",
      "d) Bicampus."
    ],
    "correct": 0
  },
  {
    "question": "120. SEGÚN LOS ESTATUTOS DE LA EHU, SON CENTROS DOCENTES...",
    "options": [
      "a) Las escuelas y facultades.",
      "b) Los campus universitarios.",
      "c) Los colegios mayores.",
      "d) Los aularios."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
