<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tema33</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 10px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn, #finalizar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover, #finalizar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }

        .resultados-finales-container {
            text-align: center;
        }
        .resultados-finales-texto {
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        .resultados-finales-correctas {
            color: #155724;
            font-weight: bold;
        }
        .resultados-finales-incorrectas {
            color: #721c24;
            font-weight: bold;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <p class="subtitulo-test" style="text-align: justify;"><strong>Tema 33. El archivo de la UPV/EHU:</strong> Organización, transferencias, valoración, eliminación y acceso a documentos.</p>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
            <div id="resultados-finales" class="hidden resultados-finales-container">
                <h2>Resultados Finales</h2>
                <div id="resultados-texto" class="resultados-finales-texto"></div>
            </div>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
            <button id="finalizar-btn" class="comprobar-btn" style="width: 100%; margin-top: 20px;">Finalizar Test</button>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "288. EL ACCESO A ARCHIVOS Y A DOCUMENTOS QUE OBREN EN LOS ARCHIVOS ADMINISTRATIVOS ES UN DERECHO QUE LE ASISTE A LAS PERSONAS:",
    "options": [
      "a) Sólo a los que se sustentan en soporte gráfico.",
      "b) Sólo a los que se sustentan en soporte gráfico y correspondan a procedimientos terminados.",
      "c) En cualquier forma de expresión siempre que estén inacabados.",
      "d) Siempre que correspondan a procedimientos terminados en la fecha de la solicitud."
    ],
    "correct": 3
  },
  {
    "question": "289. EL ACCESO A DOCUMENTOS QUE OBREN EN LOS ARCHIVOS ADMINISTRATIVOS Y QUE CONTENGAN DATOS REFERENTES A LA INTIMIDAD DE LAS PERSONAS:",
    "options": [
      "a) Estará reservado a éstas.",
      "b) Será igualmente de acceso público.",
      "c) Estará totalmente prohibido.",
      "d) Será posible en caso de que contar con el consentimiento expreso y por escrito de la persona afectada."
    ],
    "correct": 3
  },
  {
    "question": "352. LA DESTRUCCIÓN DE DOCUMENTOS SE DEBE REALIZAR CON EL:",
    "options": [
      "a) Documento grapado",
      "b) Documento sin grapar",
      "c) Documento archivado por el sistema de púa",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 1
  },
  {
    "question": "353. LA DESTRUCCIÓN FÍSICA DE DOCUMENTOS NO VÁLIDOS SE DENOMINA:",
    "options": [
      "a) Expurgo",
      "b) Expolio",
      "c) Documentos de archivo",
      "d) Dossier"
    ],
    "correct": 0
  },
  {
    "question": "354. LA DESTRUCCIÓN FÍSICA DE DOCUMENTOS SE DEBE REALIZAR:",
    "options": [
      "a) Tirándolos a la basura",
      "b) Por cualquier método que garantice la imposibilidad de reconstrucción",
      "c) Tratándolos químicamente",
      "d) Taladrando el ángulo superior derecho de cada documento"
    ],
    "correct": 1
  },
  {
    "question": "448. INDIQUE LA AFIRMACIÓN INCORRECTA SEGÚN LO DISPUESTO EN EL MANUAL DE ARCHIVO DE GESTIÓN O ARCHIVO DE OFICINA DE LA EHU:",
    "options": [
      "a) Los documentos generados por los Departamentos, Facultades, Escuelas e Institutos Universitarios en el desempeño de sus funciones, forman parte del Patrimonio Documental de la Universidad.",
      "b) Los documentos adquiridos por compraventa no forman parte del Patrimonio Documental de la Universidad, al no haber sido generados por ningún órgano de ésta.",
      "c) Se considera también documento de Archivo de la EHU toda expresión en lenguaje natural o convencional y cualquier otra expresión gráfica, sonora o en imagen, recogida en soportes informáticos.",
      "d) Los documentos que formen parte del Patrimonio Bibliográfico no son susceptibles de ser considerados documentos de Archivo."
    ],
    "correct": 1
  },
  {
    "question": "449. SEGÚN EL MANUAL DE ARCHIVO DE GESTIÓN O ARCHIVO DE OFICINA DE LA EHU, CUANDO PRESCRIBE EL VALOR ADMINISTRATIVO DEL DOCUMENTO ADMINISTRATIVO, ¿ES OBJETO DE EXPURGO EN TODO CASO?",
    "options": [
      "a) Sí, siempre ya que ocupa lugar físico o electrónico.",
      "b) No, si son documentos generados por los Órganos Superiores de la EHU (Consejo de Gobierno, Claustro y Gabinete del Rector/a.",
      "c) No siempre, ya que en los documentos pueden aflorar otros valores que planteen la necesidad de su conservación permanente.",
      "d) Ningún documento administrativo, sea cual sea el Órgano que lo ha generado y tenga el contenido que sea, es objeto de destrucción; a lo sumo se escanea para su conservación en un soporte electrónico."
    ],
    "correct": 2
  },
  {
    "question": "450. DE LOS SIGUIENTES, INDIQUE CUAL NO SE DEBERÍA CONSERVAR EN UN ARCHIVO DE GESTIÓN O DE OFICINA:",
    "options": [
      "a) Una solicitud no resuelta de una exención de matrícula.",
      "b) Un expediente disciplinario a un funcionario fallecido hace tres años.",
      "c) Una solicitud de licencia por asuntos propios pendiente del visto bueno del cargo superior.",
      "d) El acta de una reunión que no ha sido firmada aún por la persona que actúo en la secretaría del Órgano colegiado."
    ],
    "correct": 1
  },
  {
    "question": "451. SEGÚN EL MANUAL DE ARCHIVO DE GESTIÓN O ARCHIVO DE OFICINA DE LA EHU, SE CONSIDERA QUE UN GRUPO DE DOCUMENTOS ORIGINAN SERIES DOCUMENTALES CLARAS CUANDO:",
    "options": [
      "a) Los procedimientos en los que se han generado están muy normalizados, bien por la legislación o por la normativa propia.",
      "b) Utilizan el mismo tipo y tamaño de papel, así como el mismo membrete institucional.",
      "c) Ilustran el mismo tipo de acto administrativo (por ejemplo, la serie de resoluciones de los recursos, la serie de solicitudes varias, etc.)",
      "d) No se aplica en la EHU el concepto de series documentales."
    ],
    "correct": 0
  },
  {
    "question": "452. INDIQUE LA CARACTERÍSTICA QUE NO ES PROPIA DE UN DOCUMENTO DE ARCHIVO:",
    "options": [
      "a) Son conjuntos orgánicos de documentos, que responden a la actividad de la oficina productora. El documento de archivo está relacionado con los que le preceden y los que le siguen, tiene carácter seriado.",
      "b) Son ejemplares únicos que reflejan la actuación o actuaciones para la resolución de un asunto. Son originales, o tratados como tales.",
      "c) Testimonian las actividades de la Universidad en el cumplimiento de sus fines.",
      "d) Apoyan la gestión, pueden ayudar en el proceso de la toma de decisiones como material de apoyo, pueden ser boletines oficiales, libros, revistas, publicaciones o informes elaborados por otras instituciones, etc."
    ],
    "correct": 3
  },
  {
    "question": "457. INDIQUE LA OPCIÓN QUE NO SE CORRESPONDE CON LA ORGANIZACIÓN DE ARCHIVOS DE GESTIÓN:",
    "options": [
      "a) En el archivo de gestión se conservarán los documentos generados o recibidos por la unidad administrativa en el ejercicio de sus funciones, mientras dure la tramitación de los asuntos.",
      "b) Es fundamental separar la documentación de archivo de la de apoyo informativo.",
      "c) La organización de los archivos de gestión debe basarse en el Cuadro de Clasificación Decimal Universal (CDU) y Calendario de Destrucción Documental de la Universidad.",
      "d) Los tipos documentales que integran las unidades documentales de las series estarán debidamente foliados con el fin de facilitar su ordenación, consulta y control."
    ],
    "correct": 2
  },
  {
    "question": "458. EL PARÁMETRO CLASIFICADOR QUE SE TIENE EN CUENTA A LA HORA DE DISEÑAR UNA SERIE DOCUMENTAL ES:",
    "options": [
      "a) Su pertenencia a una línea de actividad concreta a desarrollar",
      "b) La fase del procedimiento administrativo",
      "c) El Grupo de titulación del cargo que genera el correspondiente documento",
      "d) Como sólo conforman serie documentales los Órganos colegiados, el parámetro sería precisamente, el Órgano colegiado generador de los documentos."
    ],
    "correct": 0
  },
  {
    "question": "459. SEGÚN EL MANUAL DE ARCHIVO DE GESTIÓN O ARCHIVO DE OFICINA, LOS DOCUMENTOS DEPOSITADOS EN EL ARCHIVO CENTRAL (SEÑALE LA OPCIÓN CORRECTA):",
    "options": [
      "a) Sólo se prestarán documentos a la unidad que los haya generado.",
      "b) Se podrán prestar documentos a una unidad diferente a la que los ha generado, previa conformidad de ésta.",
      "c) Nunca podrán ser consultados por parte de solicitantes que no pertenezcan a la Universidad, ya que el Manual de archivo de gestión o archivo de oficina lo prohíbe expresamente.",
      "d) Pueden ser prestados a otras Administraciones Públicas siempre que acrediten un interés legítimo en la información contenida en los documentos objeto del préstamo."
    ],
    "correct": 0
  },
  {
    "question": "460. ¿QUÉ DURACIÓN TENDRÁ EL PRÉSTAMO DE UNA DOCUMENTACIÓN CUSTODIADA POR EL ARCHIVO GENERAL DE LA EHU?",
    "options": [
      "a) Tendrá una duración máxima de un mes, prorrogable previa solicitud al Archivo General.",
      "b) Tendrá una duración máxima de quince días, prorrogable previa solicitud al Archivo General.",
      "c) Tendrá una duración máxima improrrogable de un mes",
      "d) Tendrá una duración máxima improrrogable de quince días"
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                DOM.resultadosFinales.classList.add('hidden');
                DOM.contenidoPregunta.classList.remove('hidden');
                DOM.rectanguloResumen.classList.remove('hidden');
                DOM.finalizarBtn.textContent = 'Finalizar Test';

                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.textContent = esUltimaPregunta ? 'Terminar' : 'Siguiente';
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                } else {
                    mostrarResultados();
                }
            }

            function mostrarResultados() {
                DOM.contenidoPregunta.classList.add('hidden');
                DOM.resultadosFinales.classList.remove('hidden');

                // Recalcular el recuento total acumulado
                let correctas = 0;
                let incorrectas = 0;
                preguntas.forEach(p => {
                    if (p.comprobada) {
                        if (p.esCorrecta) correctas++;
                        else incorrectas++;
                    }
                });

                const correctasSpan = `<span class="resultados-finales-correctas">Correctas: ${correctas}</span>`;
                const incorrectasSpan = `<span class="resultados-finales-incorrectas">Incorrectas: ${incorrectas}</span>`;
                DOM.resultadosTexto.innerHTML = `${correctasSpan} | ${incorrectasSpan}`;

                DOM.finalizarBtn.textContent = 'Volver al Test';
            }

            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }

            function toggleFinalizarTest() {
                if (DOM.resultadosFinales.classList.contains('hidden')) {
                    mostrarResultados();
                } else {
                    mostrarPregunta();
                }
            }

            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta'),
                    resultadosFinales: document.getElementById('resultados-finales'),
                    resultadosTexto: document.getElementById('resultados-texto'),
                    finalizarBtn: document.getElementById('finalizar-btn')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'finalizar-btn') {
                        toggleFinalizarTest();
                    } else if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>

    <script>
        // Informa a la ventana padre (index.html) de la altura real de este
        // contenido, para que el iframe que lo muestra se ajuste sin dejar
        // hueco extra abajo. Se reenvía cada vez que cambia el contenido
        // (cambio de pregunta, comprobar respuesta, finalizar test, etc.).
        (function () {
            function reportarAltura() {
                if (window.parent && window.parent !== window) {
                    window.parent.postMessage(
                        { tipo: "alturaContenido", altura: document.documentElement.scrollHeight },
                        "*"
                    );
                }
            }
            window.addEventListener("load", reportarAltura);
            new MutationObserver(reportarAltura).observe(document.body, {
                childList: true,
                subtree: true,
                attributes: true
            });
        })();
    </script>
</body>
