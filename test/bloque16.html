<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 16 (preguntas 221-234)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 16 (preguntas 221-234)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "221. PARA CONSEGUIR LA PARTICIPACIÓN DE NUESTRO INTERLOCUTOR/A EN LA COMUNICACIÓN, DEBEMOS:",
    "options": [
      "a) Adoptar una escucha pasiva, confundiendo escuchar con oír.",
      "b) Comprender al emisor/a y su mensaje asegurándonos de que hemos entendido.",
      "c) No tomar notas de lo que dice, aunque fuese necesario.",
      "d) Ser comprensivo/a con el interlocutor/a y escucharle distraídamente."
    ],
    "correct": 1
  },
  {
    "question": "222. ENTRE LAS CAUSAS DE LOS FALLOS EN LA COMUNICACIÓN ESTÁN:",
    "options": [
      "a) Enviamos mensajes bien elaborados y vocalizamos adecuadamente.",
      "b) Sabemos escuchar",
      "c) Utilizamos un lenguaje excesivamente técnico.",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 2
  },
  {
    "question": "223. ¿COMO DEBEMOS ATENDER LAS RECLAMACIONES DE LAS PERSONAS?",
    "options": [
      "a) Recoger con calma y consideración la reclamación",
      "b) Dejar hablar, escuchar y no entrar en la discusión.",
      "c) Permanecer calmado/a",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "224. LA ESCUCHA ACTIVA:",
    "options": [
      "a) Es un conjunto de acciones no verbales destinadas a la consecución de una escucha positiva",
      "b) Es una comunicación bidireccional",
      "c) Es el objeto de acciones verbales destinadas a la consecución de una escucha óptima",
      "d) Es el conjunto de acciones verbales y no verbales destinadas a la consecución de una escucha óptima"
    ],
    "correct": 3
  },
  {
    "question": "225. (SEÑALE LA RESPUESTA INCORRECTA). SEGÚN EL ARTÍCULO 11.2 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN, ES OBLIGATORIA LA FIRMA POR PARTE DE LOS/AS INTERESADOS/AS PARA…",
    "options": [
      "a) Formular solicitudes.",
      "b) Presentar declaraciones responsables o comunicaciones.",
      "c) Firmar acuse de recibo en las notificaciones electrónicas.",
      "d) Renunciar a derechos."
    ],
    "correct": 2
  },
  {
    "question": "226. SI EL/LA FUNCIONARIO/A ATIENDE UNA LLAMADA DIRECTAMENTE, DEBERÁ EN PRIMER LUGAR:",
    "options": [
      "a) Dar los buenos días/tardes y preguntar qué desea",
      "b) Preguntar el nombre de la persona usuaria",
      "c) Preguntar el motivo de la llamada",
      "d) Identificar la unidad a la que se está llamando"
    ],
    "correct": 3
  },
  {
    "question": "227. EL/LA FUNCIONARIO/A QUE RECIBE UNA RECLAMACIÓN DE UNA PERSONA USUARIA:",
    "options": [
      "a) Ha de negarse a recibirla",
      "b) Debe convencer a la persona usuaria que no la presente",
      "c) Debe recibir cualquier tipo de reclamación que la persona usuaria quiera presentar",
      "d) La persona usuaria no puede realizar reclamaciones"
    ],
    "correct": 2
  },
  {
    "question": "228. LA SOCIEDAD, EN LA QUE SE PRODUCE UN DESEQUILIBRIO EN EL REPARTO DEL PODER, BENEFICIANDO A LOS HOMBRES EN PERJUICIO DE LOS DERECHOS O DEL LIBRE EJERCICIO DE LOS DERECHOS DE LAS MUJERES, RECIBE LA DENOMINACIÓN DE:",
    "options": [
      "a) Sociedad masculinizada",
      "b) Patriarcado",
      "c) Sociedad machista",
      "d) Androgenia"
    ],
    "correct": 1
  },
  {
    "question": "229. LA PERSPECTIVA O ANÁLISIS DE GÉNERO ES:",
    "options": [
      "a) Un constructor político",
      "b) Un concepto sociológico",
      "c) Una herramienta de análisis",
      "d) Una forma de interpretar las diferencias de sexo"
    ],
    "correct": 2
  },
  {
    "question": "230. ¿QUÉ ORGANO PRESIDE LA COMISIÓN INTERINSTITUCIONAL PARA LA IGUALDAD DE MUJERES V HOMBRES:",
    "options": [
      "a) La Consejera de Igualdad, Justicia y Políticas Sociales.",
      "b) La Directora de Emakunde.",
      "c) El Lehendakari del Gobierno Vasco.",
      "d) La persona presidenta del Parlamento Vasco."
    ],
    "correct": 1
  },
  {
    "question": "231. EN EL ÁMBITO DE LA IGUALDAD, LAS ACCIONES POSITIVAS:",
    "options": [
      "a) Tienen un carácter permanente",
      "b) Tienen un carácter temporal",
      "c) Tienen un carácter discriminatorio",
      "d) Tienen un carácter no transversal"
    ],
    "correct": 1
  },
  {
    "question": "232. ¿QUÉ ELEMENTO REFUERZA LA LOSU EN MATERIA DE IGUALDAD?:",
    "options": [
      "a) Eliminación de unidades de igualdad.",
      "b) Planes de igualdad y protocolos contra la violencia de género.",
      "c) Sustitución de comisiones por órganos externos.",
      "d) Reducción de la representación femenina."
    ],
    "correct": 1
  },
  {
    "question": "233. EL INDICATIVO “RÓMPASE EN CASO DE INCENDIO” SE ASOCIA A:",
    "options": [
      "a) Extintores fijos",
      "b) Hidrantes",
      "c) Rociadores",
      "d) Una BIE (boca de incendios equipada)"
    ],
    "correct": 3
  },
  {
    "question": "234. CUANDO NECESITAMOS UNA INTERVENCIÓN RÁPIDA CONTRA EL FUEGO, DE UNA MANERA AUTOMÁTICA, COLOCAREMOS:",
    "options": [
      "a) BIE",
      "b) Extintores de espuma",
      "c) Sprinklers",
      "d) Hidrantes"
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
