<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 25 (preguntas 347-360)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 25 (preguntas 347-360)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "347. EN RELACIÓN CON LA PREVENCIÓN DE RIESGOS LABORALES, ENTENDEMOS COMO CARGA FÍSICA:",
    "options": [
      "a) Cualquier esfuerzo realizado con la espalda",
      "b) Todo peso que se levante o no con las manos siempre que se trate de un objeto animado",
      "c) Cualquier objeto animado o inanimado que se caracterice por un peso, una forma, un tamaño, un agarre y una distribución del peso",
      "d) El conjunto de requerimientos físicos a los que se ve sometida la persona a lo largo de su jornada laboral"
    ],
    "correct": 3
  },
  {
    "question": "348. SI LA MÁQUINA FOTOCOPIADORA NOS INDICA QUE HAY UN ATASCO EN LA UNIDAD FUSORA ¿DÓNDE ESTÁ LOCALIZADO EL ATASCO?",
    "options": [
      "a) En los rodillos",
      "b) En el tambor",
      "c) En la bandeja de recepción",
      "d) Ninguna de las anteriores"
    ],
    "correct": 0
  },
  {
    "question": "349. CUANDO EL VIDRIO DE CONTACTO EN UNA MÁQUINA FOTOCOPIADORA ESTÁ SUCIO ¿CÓMO SE PROCEDERÁ A SU LIMPIEZA?",
    "options": [
      "a) Con disolvente",
      "b) Con un paño empapado en amoniaco",
      "c) Con un paño humedecido con alcohol o detergente suave",
      "d) Con cera líquida"
    ],
    "correct": 2
  },
  {
    "question": "350. SI UN PAPEL LLEVA EL SÍMBOLO TCF ¿QUÉ SIGNIFICA?",
    "options": [
      "a) Que está fabricado con pasta libre de cloro",
      "b) Que está fabricado con pasta de papel blanqueado con dióxido de carbono",
      "c) Que está fabricado con materiales recuperados selectivamente del postconsumo",
      "d) Ninguna de las anteriores"
    ],
    "correct": 0
  },
  {
    "question": "351. ¿LA MEMORIA ZOOM EN UNA FOTOCOPIADORA ESTÁ RELACIONADA CON?",
    "options": [
      "a) Intensidad de color",
      "b) Ampliación o reducción de la copia",
      "c) El número de copias que se quiere realizar",
      "d) Ninguna de las anteriores"
    ],
    "correct": 1
  },
  {
    "question": "352. LA DESTRUCCIÓN DE DOCUMENTOS SE DEBE REALIZAR CON EL:",
    "options": [
      "a) Documento grapado",
      "b) Documento sin grapar",
      "c) Documento archivado por el sistema de púa",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 1
  },
  {
    "question": "353. LA DESTRUCCIÓN FÍSICA DE DOCUMENTOS NO VÁLIDOS SE DENOMINA:",
    "options": [
      "a) Expurgo",
      "b) Expolio",
      "c) Documentos de archivo",
      "d) Dossier"
    ],
    "correct": 0
  },
  {
    "question": "354. LA DESTRUCCIÓN FÍSICA DE DOCUMENTOS SE DEBE REALIZAR:",
    "options": [
      "a) Tirándolos a la basura",
      "b) Por cualquier método que garantice la imposibilidad de reconstrucción",
      "c) Tratándolos químicamente",
      "d) Taladrando el ángulo superior derecho de cada documento"
    ],
    "correct": 1
  },
  {
    "question": "355. A LA HORA DE ATENDER AL CIUDADANO/A SE HABLA DE LA PRESTACIÓN DE UN SERVICIO, ¿QUÉ SE QUIERE DECIR CON ELLO?",
    "options": [
      "a) Que se realiza la cesión de un bien tangible",
      "b) Que se presta un bien que almacenable y fácilmente medible",
      "c) Que se presta un servicio que no está vinculado a la materialización de un producto",
      "d) Que es un bien que se cede de manera temporal"
    ],
    "correct": 2
  },
  {
    "question": "356. ¿CUÁL ES EL PRIMER ACTO DE COMUNICACIÓN ENTRE LA ADMINISTRACIÓN Y EL/LA USUARIO/A-CLIENTE QUE ACUDE A ELLA?",
    "options": [
      "a) El saludo",
      "b) La recepción",
      "c) La comunicación escrita",
      "d) La comunicación oral"
    ],
    "correct": 1
  },
  {
    "question": "357. ¿CUÁLES SON LAS CAPACIDADES BÁSICAS QUE DEBE TENER EL PROFESIONAL DE RECEPCIÓN DE UNA ADMINISTRACIÓN PÚBLICA?",
    "options": [
      "a) Claridad de comunicación y capacidad de mando",
      "b) Capacidad de relación y capacidad de solución de conflictos",
      "c) Debe saber aplicar las técnicas de expresión oral y debe tener capacidad para dar una buena información",
      "d) Capacidad de síntesis y don de gentes"
    ],
    "correct": 2
  },
  {
    "question": "358. ¿QUÉ DIFERENCIA EXISTE EN INFORMACIÓN Y COMUNICACIÓN?",
    "options": [
      "a) El significado es el mismo",
      "b) La información la da una sola persona y la comunicación la puedan dar varias",
      "c) La información se produce en un solo sentido y la comunicación requiere de feedback",
      "d) La comunicación siempre es ascendente y la información descendente"
    ],
    "correct": 2
  },
  {
    "question": "359. ¿EN CUÁL DE LOS SIGUIENTES DISPOSITIVOS PREDOMINA LA COMUNICACIÓN?",
    "options": [
      "a) En las publicaciones internas",
      "b) En los indicadores de control",
      "c) En las encuestas",
      "d) En las reuniones"
    ],
    "correct": 3
  },
  {
    "question": "360. ¿CUÁL DE LAS SIGUIENTES AFIRMACIONES ES LA CORRECTA?",
    "options": [
      "a) El/la funcionario/a administrativo es el primer punto de contacto de la Administración con la ciudadanía",
      "b) Los/as Directivos/as son el primer punto de contacto de la Administración con la ciudadanía",
      "c) El/la funcionario/a de atención al público es el primer punto de contacto de la Administración con la ciudadanía",
      "d) Los puestos intermedios son el primer punto de contacto de la Administración con la ciudadanía"
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
