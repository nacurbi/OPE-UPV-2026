<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 4 (preguntas 46-60)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "46. RESPETO A LA POTESTAD REGLAMENTARIA, SEÑALE LA RESPUESTA INCORRECTA:",
    "options": [
      "a) Los reglamentos y disposiciones administrativas no podrán tipificar delitos, faltas o infracciones administrativas, establecer penas o sanciones.",
      "b) Los reglamentos y disposiciones administrativas no podrán establecer tributos, exacciones parafiscales u otras cargas o prestaciones personales o patrimoniales de carácter público",
      "c) Los reglamentos y disposiciones administrativas pueden establecer nuevas normativas sobre cualquier materia si cuentan con la ratificación del Consejo General del Poder Judicial",
      "d) Ninguna disposición administrativa podrá vulnerar los preceptos de otra de rango superior."
    ],
    "correct": 2
  },
  {
    "question": "47. SEÑALE CUÁL DE ESTAS AFIRMACIONES ES CORRECTA:",
    "options": [
      "a) La encomienda de gestión, la delegación de firma y la suplencia no suponen alteración de la titularidad de la competencia.",
      "b) Cuando se produzca una delegación de competencias a favor de un órgano no jerárquicamente dependiente del delegante, tanto el órgano delegante como los superiores jerárquicos del delegado podrán avocar para sí el conocimiento del asunto.",
      "c) Contra el acuerdo de avocación podrá interponerse recurso de alzada ante el superior jerárquico del órgano que ejercita la misma.",
      "d) Los titulares de los órganos administrativos podrán ser suplidos temporalmente en los supuestos de ausencia o enfermedad por quien designe el órgano que va a ser suplido."
    ],
    "correct": 0
  },
  {
    "question": "48. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿CUÁL DE LOS SIGUIENTES NO TIENE LA CONSIDERACIÓN DE PERSONA INTERESADA EN EL PROCEDIMIENTO ADMINISTRATIVO?",
    "options": [
      "a) Quienes lo promuevan como titulares de derechos o intereses legítimos individuales o colectivos",
      "b) Aquellos/as cuyos intereses legítimos, individuales o colectivos, puedan resultar afectados por la resolución y se personen en el procedimiento en tanto no haya recaído resolución definitiva",
      "c) Los/as que, sin haber iniciado el procedimiento, tengan derechos que puedan resultar afectados por la instrucción que en el mismo se adopte y comparezcan, exclusivamente de forma personal, ante la autoridad competente",
      "d) Todas las respuestas son incorrectas"
    ],
    "correct": 2
  },
  {
    "question": "49. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, CON RESPECTO A LA ORDENACIÓN DEL PROCEDIMIENTO, CUANDO EN VIRTUD DE UNA NORMA SEA PRECISO REMITIR EL EXPEDIENTE ELECTRÓNICO:",
    "options": [
      "a) Se hará de acuerdo a las características y medios disponibles del empleado/a público/a que lo tramite",
      "b) No es necesario en su tramitación que vaya acompañado del índice",
      "c) Se hará de acuerdo con lo previsto en el Esquema Nacional de Interoperabilidad y en las correspondientes normas técnicas de interoperabilidad y se enviará completo, foliado, autentificado y acompañado de un índice, así mismo autenticado, de los documentos que contenga",
      "d) Ninguna de las anteriores es correcta."
    ],
    "correct": 2
  },
  {
    "question": "50. LAS NUEVAS OBLIGACIONES INTRODUCIDAS POR LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS Y POR LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO SE PUEDEN RESUMIR EN:",
    "options": [
      "a) Garantizar la seguridad en la tramitación electrónica.",
      "b) Tramitar electrónicamente los expedientes.",
      "c) Garantizar la agilidad en la tramitación.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 1
  },
  {
    "question": "51. EL DERECHO Y OBLIGACIÓN DE RELACIONARSE ELECTRÓNICAMENTE CON LA ADMINISTRACIÓN, VIENE RECOGIDO EN EL:",
    "options": [
      "a) Art. 14 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, y por la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.",
      "b) Art. 14 de la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.",
      "c) Art. 15 de la Ley 39/2015, de 1 de octubre, del Procedimiento Administrativo Común de las Administraciones Públicas, y por la Ley 40/2015, de 1 de octubre, de Régimen Jurídico del Sector Público.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 3
  },
  {
    "question": "52. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN, PONDRÁN FIN AL PROCEDIMIENTO ADMINISTRATIVO:",
    "options": [
      "a) La resolución y el desestimiento",
      "b) La imposibilidad material de continuarlo por causas sobrevenidas. La resolución que se dicte deberá ser motivada en todo caso.",
      "c) La renuncia al derecho en que se funde la solicitud, cuando tal renuncia no esté prohibida por el ordenamiento jurídico y la declaración de caducidad",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "53. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿DÓNDE DEBEN LAS ADMINISTRACIONES PÚBLICAS PUBLICAR Y MANTENER ACTUALIZADAS A EFECTOS INFORMATIVOS LAS RELACIONES DE PROCEDIMIENTOS DE SU COMPETENCIA CON INDICACIÓN DE LOS PLAZOS MÁXIMOS DE DURACIÓN DE LOS MISMOS, ASÍ COMO DE LOS EFECTOS QUE PRODUZCA EL SILENCIO ADMINISTRATIVO?",
    "options": [
      "a) En sus portales web.",
      "b) En el Boletín Oficial del Estado.",
      "c) En el Boletín Oficial que corresponda.",
      "d) En sus portales web y en el Boletín Oficial que corresponda."
    ],
    "correct": 0
  },
  {
    "question": "54. SEGÚN EL ARTÍCULO 23 DE LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, SON MOTIVOS DE ABSTENCIÓN:",
    "options": [
      "a) Tener interés personal en el asunto de que se trate o en otro en cuya resolución pudiera influir la de aquél.",
      "b) Ser administrador de sociedad o entidad interesada.",
      "c) Tener cuestión litigiosa pendiente con algún interesado.",
      "d) Todas las opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "55. SEGÚN LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, CUÁL DE LOS SIGUIENTES REQUISITOS EXIGIRÁ LA CREACIÓN DE CUALQUIER ÓRGANO ADMINISTRATIVO:",
    "options": [
      "a) Determinación de su forma de integración en la Administración Pública de que se trate y su dependencia jerárquica.",
      "b) Delimitación de sus funciones y competencias.",
      "c) Dotación de los créditos necesarios para su puesta en marcha y funcionamiento.",
      "d) Todas las opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "56. DE ACUERDO AL ARTÍCULO 9 DE LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, LOS ÓRGANOS DE LA ADMINISTRACIÓN GENERAL DEL ESTADO PODRÁN DELEGAR EL EJERCICIO DE SUS COMPETENCIAS PROPIAS EN SUS ORGANISMOS PÚBLICOS Y ENTIDADES VINCULADOS O DEPENDIENTES:",
    "options": [
      "a) Cuando resulte conveniente para alcanzar los fines que tengan asignados y mejorar la eficacia de su gestión.",
      "b) Para mejorar la eficacia de gestión de su personal.",
      "c) Los órganos de las diferentes Administraciones Públicas no podrán delegar el ejercicio de las competencias que tengan atribuidas.",
      "d) Cuando se trate de competencias relativas a la adopción de disposiciones de carácter general."
    ],
    "correct": 0
  },
  {
    "question": "57. DE ACUERDO CON LO ESTABLECIDO EN EL ARTÍCULO 103 DE LA LEY 40/2015 DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, LAS ENTIDADES PÚBLICAS EMPRESARIALES DE ÁMBITO ESTATAL SON ENTIDADES:",
    "options": [
      "a) Que no tienen personalidad jurídica propia.",
      "b) De Derecho público.",
      "c) Que no dependen de la Administración General del Estado o de un Organismo autónomo vinculado o dependiente de ésta.",
      "d) Que no desarrollan actividades prestacionales, de gestión de servicios o de producción de bienes de interés público."
    ],
    "correct": 1
  },
  {
    "question": "58. DE CONFORMIDAD CON LO ESTABLECIDO EN EL ARTÍCULO 35 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, NO NECESITAN NECESARIAMENTE SER MOTIVADOS:",
    "options": [
      "a) Los acuerdos de suspensión de actos.",
      "b) Los actos sancionadores.",
      "c) Los actos que se separen del dictamen de un órgano consultivo.",
      "d) Los actos favorables para los interesados."
    ],
    "correct": 3
  },
  {
    "question": "59. LA JUBILACIÓN DEL PERSONAL FUNCIONARIO NO PODRÁ SER:",
    "options": [
      "a) Voluntaria.",
      "b) Parcial con contrato de relevo.",
      "c) Forzosa, al cumplir la edad legalmente establecida.",
      "d) Por declaración de una incapacidad."
    ],
    "correct": 1
  },
  {
    "question": "60. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, ¿EN QUÉ MOMENTO DEL PROCEDIMIENTO PUEDEN ELEGIR LAS PERSONAS FÍSICAS SI SE COMUNICAN CON LAS ADMINISTRACIONES PÚBLICAS PARA EL EJERCICIO DE SUS DERECHOS Y OBLIGACIONES A TRAVÉS DE MEDIOS ELECTRÓNICOS?",
    "options": [
      "a) Mientras el procedimiento se encuentre en la fase de ordenación",
      "b) Antes de la finalización de la instrucción",
      "c) Antes del trámite de audiencia",
      "d) En todo momento"
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
