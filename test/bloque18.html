<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 18 (preguntas 249-262)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "249. REÚNE LA CONDICIÓN DE PERSONA INTERESADA:",
    "options": [
      "a) Toda aquella que presenta un escrito dirigido a la Administración.",
      "b) Toda aquella que interpone un recurso administrativo.",
      "c) Cualquier ciudadano/a.",
      "d) Toda aquella que, sin haber iniciado el procedimiento, tenga derechos que puedan resultar afectados por la decisión que se adopte en el mismo."
    ],
    "correct": 3
  },
  {
    "question": "250. SI VARIAS PERSONAS INTERESADAS FIRMAN UNA SOLICITUD, LAS ACTUACIONES SE ENTENDERÁN:",
    "options": [
      "a) Con la que ostente mayor interés",
      "b) Con toda ellas.",
      "c) Siempre con la que figure en primer lugar.",
      "d) Con la persona representante o interesada que expresamente designen."
    ],
    "correct": 3
  },
  {
    "question": "251. PARA TENER LOS PARTICULARES DERECHO A SER INDEMNIZADOS POR LAS ADMINISTRACIONES PÚBLICAS ¿CÚAL DE ESTAS CARACTERÍSTICAS NO SE CORRESPONDE AL DAÑO SUFRIDO?",
    "options": [
      "a) Deberá ser evaluable económicamente",
      "b) Deberá ser efectivo",
      "c) Deberá ser individualizado en relación a una persona o grupo de personas",
      "d) Deberá ser perceptible"
    ],
    "correct": 3
  },
  {
    "question": "252. LOS PARTICULARES EN NINGÚN CASO TENDRÍAN DERECHO A SER INDEMNIZADOS POR LAS ADMINISTRACIONES PÚBLICAS:",
    "options": [
      "a) Si se ha sufrido una lesión en cualquier bien y derecho",
      "b) Si la lesión producida en bienes y derechos se ha debido a un caso de fuerza mayor",
      "c) Si la lesión ha sido consecuencia del funcionamiento normal de los servicios públicos",
      "d) Si la lesión ha sido consecuencia del funcionamiento anormal de los servicios públicos"
    ],
    "correct": 1
  },
  {
    "question": "253. LA ADMINISTRACIÓN, PARA PODER EXIGIR A SUS AUTORIDADES Y DEMÁS PERSONAL A SU SERVICIO, RESPONSABILIDAD PATRIMONIAL EN LA QUE HUBIERAN INCURRIDO POR SU ACTUACIÓN DEBERÁ:",
    "options": [
      "a) Instruir el procedimiento que reglamentariamente se establezca",
      "b) Ponderar el resultado dañoso producido.",
      "c) Ponderar la existencia o no de intencionalidad, la responsabilidad profesional del personal a su servicio y su relación con la producción del resultado",
      "d) Las tres opciones son correctas."
    ],
    "correct": 3
  },
  {
    "question": "254. SEGÚN EL ART. 33 DE LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, CUANDO SE TRATE DE PROCEDIMIENTOS EN MATERIA DE RESPONSABILIDAD PATRIMONIAL, LA ADMINISTRACIÓN PÚBLICA COMPETENTE DEBERÁ CONSULTAR A LAS RESTANTES ADMINISTRACIONES IMPLICADAS PARA QUE ESTAS PUEDAN EXPONER CUANTO CONSIDEREN PROCEDENTE, EN EL PLAZO DE:",
    "options": [
      "a) 10 días.",
      "b) 15 días.",
      "c) 1 mes.",
      "d) 3 meses."
    ],
    "correct": 1
  },
  {
    "question": "255. LA LEY 40/2015, DE 1 DE OCTUBRE, DE RÉGIMEN JURÍDICO DEL SECTOR PÚBLICO, SEÑALA QUE PARA HACER EFECTIVA LA RESPONSABILIDAD PATRIMONIAL, LOS PARTICULARES EXIGIRÁN:",
    "options": [
      "a) Directamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio.",
      "b) Indirectamente a la Administración Pública correspondiente las indemnizaciones por los daños y perjuicios causados por las autoridades y personal a su servicio.",
      "c) A la Administración Pública o a las autoridades y personal a su servicio, las indemnizaciones por los daños y perjuicios causados.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 0
  },
  {
    "question": "256. LAS PERSONAS FÍSICAS PODRÁN UTILIZAR, PARA RELACIONARSE CON LA ADMINISTRACIÓN:",
    "options": [
      "a) Sólo los certificados electrónicos incorporados al Documento Nacional de Identidad.",
      "b) Sólo los certificados electrónicos reconocidos y los sistemas de firma electrónica avanzada que se admitan por la Administración.",
      "c) Los certificados electrónicos incorporados al Documento Nacional de Identidad, los certificados electrónicos reconocidos y los sistemas de firma electrónica avanzada que se admitan por la Administración.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 2
  },
  {
    "question": "257. LOS CANALES DE ASISTENCIA PARA EL ACCESO A SERVICIOS ELECTRÓNICOS TIENEN COMO FINALIDAD:",
    "options": [
      "a) Sustituir todos los trámites.",
      "b) Ayudar a las personas en el uso de medios electrónicos.",
      "c) Realizar funciones judiciales.",
      "d) Gestionar únicamente sanciones"
    ],
    "correct": 1
  },
  {
    "question": "258. ¿TIENEN DERECHO LOS/AS CIUDADANOS/AS A CONOCER EL ESTADO DE LA TRAMITACIÓN DE UN PROCEDIMIENTO ADMINISTRATIVO CONCRETO?",
    "options": [
      "a) Sí, en todo momento, aunque no tengan la condición de personas interesadas en el mismo",
      "b) Sí, en cualquier fase del procedimiento anterior al trámite de audiencia, aunque no tengan la condición de personas interesadas en el procedimiento",
      "c) Sí, en todo momento, si tienen la condición de personas interesadas en el procedimiento",
      "d) Sí, sólo en las fases anteriores al trámite de audiencia, si tienen la condición de personas interesadas en dicho procedimiento."
    ],
    "correct": 2
  },
  {
    "question": "259. DE CONFORMIDAD CON LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN, LA CONSTANCIA DE DOCUMENTOS Y ACTUACIONES EN UN ARCHIVO ELECTRÓNICO FACILITA EL CUMPLIMIENTO DE LAS OBLIGACIONES",
    "options": [
      "a) de congruencia",
      "b) de transparencia",
      "c) de participación",
      "d) de cercanía"
    ],
    "correct": 1
  },
  {
    "question": "260. ¿PUEDE LA ADMINISTRACIÓN CONVALIDAR LOS ACTOS ANULABLES?",
    "options": [
      "a) No, en ningún caso.",
      "b) Sí, subsanando los vicios de que adolezcan.",
      "c) Sí, pero únicamente se pueden convalidar cuando el motivo de anulabilidad sea un defecto de forma.",
      "d) No, únicamente cabe la convalidación de actos nulos."
    ],
    "correct": 1
  },
  {
    "question": "261. EN UN PROCEDIMIENTO INICIADO A SOLICITUD DE LA PERSONA INTERESADA, EL VENCIMIENTO DEL PLAZO MÁXIMO SIN HABERSE NOTIFICADO RESOLUCIÓN EXPRESA LEGITIMA A LA PERSONA INTERESADA PARA:",
    "options": [
      "a) Entender siempre estimada su solicitud.",
      "b) Entender siempre desestimada su solicitud.",
      "c) Entender caducado el procedimiento.",
      "d) Entender su solicitud estimada o desestimada, según proceda."
    ],
    "correct": 3
  },
  {
    "question": "262. ¿CUÁLES SON LOS EFECTOS DE LA DESESTIMACIÓN DE UNA SOLICITUD POR SILENCIO ADMINISTRATIVO?",
    "options": [
      "a) Tiene el efecto de exonerar a la Administración de la obligación de resolver.",
      "b) Tiene los mismos efectos que una resolución expresa desestimatoria.",
      "c) Tiene los mismos efectos que un acto de trámite cualificado.",
      "d) Tiene los solos efectos de permitir a las personas interesadas la interposición del recurso administrativo o contencioso-administrativo que resulte procedente."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
