<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 33 (preguntas 459-472)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "459. SEGÚN EL MANUAL DE ARCHIVO DE GESTIÓN O ARCHIVO DE OFICINA, LOS DOCUMENTOS DEPOSITADOS EN EL ARCHIVO CENTRAL (SEÑALE LA OPCIÓN CORRECTA):",
    "options": [
      "a) Sólo se prestarán documentos a la unidad que los haya generado.",
      "b) Se podrán prestar documentos a una unidad diferente a la que los ha generado, previa conformidad de ésta.",
      "c) Nunca podrán ser consultados por parte de solicitantes que no pertenezcan a la Universidad, ya que el Manual de archivo de gestión o archivo de oficina lo prohíbe expresamente.",
      "d) Pueden ser prestados a otras Administraciones Públicas siempre que acrediten un interés legítimo en la información contenida en los documentos objeto del préstamo."
    ],
    "correct": 0
  },
  {
    "question": "460. ¿QUÉ DURACIÓN TENDRÁ EL PRÉSTAMO DE UNA DOCUMENTACIÓN CUSTODIADA POR EL ARCHIVO GENERAL DE LA EHU?",
    "options": [
      "a) Tendrá una duración máxima de un mes, prorrogable previa solicitud al Archivo General.",
      "b) Tendrá una duración máxima de quince días, prorrogable previa solicitud al Archivo General.",
      "c) Tendrá una duración máxima improrrogable de un mes",
      "d) Tendrá una duración máxima improrrogable de quince días"
    ],
    "correct": 0
  },
  {
    "question": "461. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN CERTIFICADO?",
    "options": [
      "a) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a un mismo órgano superior o entidad.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que contiene comunicaciones de tipo personal y de contenido general, que no estén relacionadas directamente con la gestión habitual o con la tramitación de un procedimiento.",
      "d) El documento acreditativo de hechos, circunstancias, juicios o acuerdos."
    ],
    "correct": 1
  },
  {
    "question": "462. LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU ES:",
    "options": [
      "a) Decisiones, documentos de apoyo a la gestión administrativa, documentos administrativos de transmisión y documentos administrativos de constancia",
      "b) Decisiones, documentos de apoyo a la gestión administrativa y documentos administrativos de constancia",
      "c) Resoluciones, oficios, actas y certificados",
      "d) Decisiones, documentos administrativos de transmisión y documentos administrativos de constancia."
    ],
    "correct": 3
  },
  {
    "question": "463. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN ACTA?",
    "options": [
      "a) El documento acreditativo de hechos, circunstancias, juicios o acuerdos.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a diferentes administraciones públicas",
      "d) El documento que contiene una declaración de voluntad de un órgano administrativo sobre materias de su competencia"
    ],
    "correct": 0
  },
  {
    "question": "464. LAS ENTIDADES DEL SECTOR PÚBLICO:",
    "options": [
      "a) No podrán contratar verbalmente, salvo que el contrato tenga carácter de necesidad.",
      "b) No podrán contratar verbalmente, salvo que el contrato tenga carácter de emergencia.",
      "c) No podrán contratar verbalmente en ningún caso.",
      "d) Podrán contratar verbalmente cuando exista una declaración de urgencia."
    ],
    "correct": 1
  },
  {
    "question": "465. LOS CONTRATOS DEL SECTOR PÚBLICO PODRÁN ESTAR SOMETIDOS A:",
    "options": [
      "a) Solo a un régimen jurídico de derecho administrativo.",
      "b) Solo a un régimen jurídico de derecho fiscal.",
      "c) A un régimen jurídico de derecho administrativo o de derecho privado.",
      "d) Solo a un régimen jurídico de derecho privado."
    ],
    "correct": 2
  },
  {
    "question": "466. SEGÚN LA TIPOLOGÍA DE DOCUMENTOS ADMINISTRATIVOS EN LA EHU, ¿QUÉ ES UN OFICIO?",
    "options": [
      "a) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a un mismo órgano superior o entidad.",
      "b) El documento que acredita actos o situaciones de carácter administrativo, cuyo destinatario es una persona, órgano o entidad que pretende la producción de efectos en un procedimiento administrativo o en el marco de relaciones jurídicas privadas",
      "c) El documento que se utiliza para la comunicación entre órganos o unidades pertenecientes a diferentes administraciones públicas, a diferentes entidades o departamentos y, dentro de éstos, a diferentes órganos superiores",
      "d) El documento que contiene una declaración de voluntad de un órgano administrativo sobre materias de su competencia"
    ],
    "correct": 2
  },
  {
    "question": "467. SEGÚN LA LEY 9/2017, DE 8 DE NOVIEMBRE, DE CONTRATOS DEL SECTOR PÚBLICO, ¿CUÁLES SON LOS TIPOS DE CONTRATOS DEL SECTOR PÚBLICO?",
    "options": [
      "a) Contratos administrativos y privados.",
      "b) Contratos administrativos, privados y mixtos.",
      "c) Contratos de obra, de suministros y de servicios.",
      "d) Contratos de obra, de suministros, de servicios, mixtos, de concesión de obras y de concesión de servicios."
    ],
    "correct": 3
  },
  {
    "question": "468. SEGÚN LA LEY 9/2017, DE 8 DE NOVIEMBRE, DE CONTRATOS DEL SECTOR PÚBLICO, ENTRE LOS CONTRATOS QUE DEBEN REMITIRSE, EN LOS TRES MESES SIGUIENTES A SU FORMALIZACIÓN, AL TRIBUNAL DE CUENTAS U ÓRGANO DE FISCALIZACIÓN DE LA COMUNIDAD AUTÓNOMA, PARA EL EJERCICIO DE LA FUNCIÓN FISCALIZADORA, SE ENCUENTRAN:",
    "options": [
      "a) Los contratos de obras, siempre que la cuantía del contrato exceda de 450.000 euros.",
      "b) Los contratos de suministro, siempre que la cuantía del contrato exceda de 250.000 euros.",
      "c) Los contratos de gestión de servicios públicos, siempre que la cuantía del contrato exceda de 500.000 euros.",
      "d) Los contratos de servicios, siempre que la cuantía del contrato exceda de 150.000 euros."
    ],
    "correct": 3
  },
  {
    "question": "469. SE CONSIDERAN CONTRATOS MENORES:",
    "options": [
      "a) Los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de obras.",
      "b) Los contratos de valor estimado inferior a 25.000 euros, cuando se trate de contratos de servicios.",
      "c) Los contratos de valor estimado inferior a 15.000 euros, cuando se trate de contratos de concesión de servicios.",
      "d) Los contratos de valor estimado inferior a 40.000 euros, cuando se trate de contratos de suministro."
    ],
    "correct": 0
  },
  {
    "question": "470. SEGÚN LA LEY 9/2017, DE 8 DE NOVIEMBRE, DE CONTRATOS DEL SECTOR PÚBLICO, LOS CONTRATOS MENORES DEFINIDOS EN EL APARTADO PRIMERO DEL ARTÍCULO 118 NO PODRÁN TENER UNA DURACIÓN SUPERIOR A:",
    "options": [
      "a) Cinco años ni ser objeto de prórroga.",
      "b) Un año ni ser objeto de prórroga.",
      "c) Un año con una prórroga de otro año.",
      "d) Dos años ni ser objeto de prórroga."
    ],
    "correct": 1
  },
  {
    "question": "471. TENDRÁN LA CONSIDERACIÓN DE CONTRATOS PRIVADOS SEGÚN LO INDICADO EN LOS ARTÍCULOS 25 Y 26 DE LA LEY 9/2017, DE 8 DE NOVIEMBRE DE CONTRATOS DEL SECTOR PÚBLICO:",
    "options": [
      "a) Todos los que sean celebrados por entidades del sector público que siendo poder adjudicador no reúnan la condición de Administraciones públicas.",
      "b) Los contratos de servicios celebrados por la administración pública que tengan por objeto la creación e interpretación artística y literaria o espectáculos.",
      "c) Los contratos de servicios celebrados por la administración pública que tengan por objeto la suscripción a revistas, publicaciones periódicas y bases de datos.",
      "d) Todas las opciones anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "472. SEÑALE LA RESPUESTA INCORRECTA. CON RELACIÓN A LA TRAMITACIÓN URGENTE DE LOS EXPEDIENTES DE CONTRATACIÓN:",
    "options": [
      "a) Podrán ser objeto de tramitación urgente los expedientes de contratación correspondientes a los contratos cuya celebración responda a una necesidad inaplazable.",
      "b) Podrán ser objeto de tramitación urgente los expedientes de contratación cuya adjudicación sea preciso acelerar por razones de interés público.",
      "c) Podrán ser objeto de tramitación urgente los expedientes de contratación cuando la Administración tenga que actuar de manera inmediata a causa de acontecimientos catastróficos, de situaciones que supongan grave peligro o de necesidades que afecten a la defensa nacional.",
      "d) El plazo de inicio de la ejecución del contrato no podrá exceder de un mes, contado desde la formalización."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
