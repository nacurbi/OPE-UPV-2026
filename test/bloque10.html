<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 10 (preguntas 136-150)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 10 (preguntas 136-150)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "136. RESPECTO AL ANTICIPO DE NÓMINA DEL PERSONAL DOCENTE E INVESTIGADOR LABORAL DE LA EHU:",
    "options": [
      "a) El importe máximo del adelanto a conceder será de 6.000 euros.",
      "b) Deberá transcurrir un periodo mínimo de un año entre la cancelación de un adelanto de nómina y la solicitud de otro.",
      "c) No se podrán solicitar anticipos por conceptos ya solicitados con anterioridad en más de tres ocasiones.",
      "d) En solicitudes de anticipo para adquisición de vivienda habitual, el plazo máximo de reintegro será de 36 mensualidades."
    ],
    "correct": 0
  },
  {
    "question": "137. CUÁL DE LAS SIGUIENTES AFIRMACIONES ES CIERTA RESPECTO A LA JORNADA LABORAL DEL PROFESORADO DE LA EHU:",
    "options": [
      "a) Las obligaciones docentes semanales de los Titulares de Universidad con régimen de dedicación a tiempo completo serán de un máximo de 12 horas lectivas.",
      "b) Las obligaciones docentes semanales de los Asociados de Escuela Universitaria con régimen de dedicación a tiempo completo contemplan un máximo de 8 horas de tutoría.",
      "c) Las horas lectivas dedicadas a programas de doctorado se computarán el triple.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 3
  },
  {
    "question": "138. RESPECTO A LA DURACIÓN DEL CONTRATO DEL PERSONAL LABORAL DOCENTE E INVESTIGADOR DE LA EHU:",
    "options": [
      "a) El contrato de profesorado adjunto tendrá una duración máxima de 4 años.",
      "b) El contrato de profesorado ayudante tendrá una duración mínima de 2 años.",
      "c) El contrato de profesorado agregado tendrá una duración indefinida.",
      "d) El contrato de profesorado asociado tendrá una duración máxima de 4 años, sin perjuicio de que una vez finalizado se pueda obtener un nuevo contrato."
    ],
    "correct": 2
  },
  {
    "question": "139. EN LOS PROCESOS SELECTIVOS DE PERSONAL FUNCIONARIO DE CARRERA PODRÁ APLICARSE ÚNICAMENTE EL SISTEMA DE CONCURSO:",
    "options": [
      "a) En ningún caso.",
      "b) Sólo en virtud de ley podrá aplicarse, y con carácter excepcional.",
      "c) El Estatuto Básico del Empleado Público no lo detalla.",
      "d) Sí así lo aprueba el máximo órgano responsable de cada Administración Pública."
    ],
    "correct": 1
  },
  {
    "question": "140. ¿QUÉ UNIVERSIDADES COMPONEN EL SISTEMA UNIVERSITARIO VASCO?",
    "options": [
      "a) El Sistema Universitario Vasco está formado por las universidades públicas con sede en el territorio de la Comunidad Autónoma Vasca.",
      "b) El Sistema Universitario Vasco está formado por todas las universidades con sede en el territorio de la Comunidad Autónoma del País Vasco.",
      "c) El Sistema Universitario Vasco está formado por la EHU, la Universidad de Deusto, la Universidad de Mondragón y el Instituto de Máquina Herramienta.",
      "d) El Sistema Universitario Vasco está formado por todas las universidades con sede en el territorio de la Comunidad Autónoma del País Vasco, y aquellas cuya sede esté en la Comunidad Foral de Navarra y sea admitida su solicitud de adhesión, según lo dispuesto en la disposición transitoria cuarta de la Ley 3/2004, de 25 febrero."
    ],
    "correct": 1
  },
  {
    "question": "141. LOS ACTOS ADMINISTRATIVOS SUJETOS A DERECHO ADMINISTRATIVO:",
    "options": [
      "a) Se presumen válidos.",
      "b) Se presumen expresos.",
      "c) Se presumen desfavorables.",
      "d) Se presumen motivados."
    ],
    "correct": 0
  },
  {
    "question": "142. DE ACUERDO CON LA LEY 3/2004 DEL SISTEMA UNIVERSITARIO VASCO UNA DE ESTAS AFIRMACIONES ES FALSA:",
    "options": [
      "a) La comunidad universitaria está integrada por los estudiantes matriculados, el personal investigador, el personal docente e investigador y el personal de administración y servicios.",
      "b) El reconocimiento de Universidades privadas se hará mediante ley.",
      "c) La organización y funcionamiento de las universidades serán democráticos de acuerdo con las normas existentes en su organización.",
      "d) La autonomía de la Universidad se fundamenta en la libertad académica que se manifiesta en las libertades de pensamiento, investigación y conciencia."
    ],
    "correct": 3
  },
  {
    "question": "143. DE ACUERDO CON LOS ESTATUTOS DE LA EHU UNA DE ESTAS AFIRMACIONES ES FALSA:",
    "options": [
      "a) La EHU es una Institución de Derecho Público, que goza de autonomía, está dotada de personalidad y capacidad jurídica, y sin patrimonio propio.",
      "b) Es un fin de la EHU la educación superior de calidad que contribuya a la formación integral de los estudiantes.",
      "c) La autonomía universitaria garantiza la capacidad autonormativa y de autoorganización.",
      "d) La EHU es una Universidad multicampus."
    ],
    "correct": 0
  },
  {
    "question": "144. EN TODO CASO, LA EJECUCIÓN DE LA OFERTA PÚBLICA DE EMPLEO DEBERÁ DESARROLLARSE DENTRO DEL PLAZO IMPRORROGABLE DE:",
    "options": [
      "a) Tres años.",
      "b) Cuatro años.",
      "c) Diez años.",
      "d) El Estatuto Básico del Empleado Público no detalla plazo."
    ],
    "correct": 0
  },
  {
    "question": "145. LA EHU:",
    "options": [
      "a) Es una institución de Derecho Foral.",
      "b) Es una institución de Derecho Civil.",
      "c) Es una institución de Derecho Público.",
      "d) Es una institución de Derecho Privado y Financiación Pública."
    ],
    "correct": 2
  },
  {
    "question": "146. EL DL1/2023 DE 16 MARZO. POR EL QUE SE APRUEBA EL TEXTO REFUNDIDO DE LA LEY PARA LA IGUALDAD DE MUJERES V HOMBRES Y VIDAS LIBRES DE VIOLENCIA MACHISTA PARA LAS MUJERES. ¿QUÉ PORCENTAJE MÍNIMO DE REPRESENTACIÓN DE CADA SEXO ESTABLECE PARA QUE EXISTA REPRESENTACIÓN EQUILIBRADA EN ÓRGANOS PLURIPERSONALES DE MÁS DE CUATRO MIEMBRO:",
    "options": [
      "a) 30 %.",
      "b) 35 %.",
      "c) 40 %.",
      "d) 50 %."
    ],
    "correct": 2
  },
  {
    "question": "147. ¿QUÉ TIPO DE PROFESORES COMPONE LOS CUERPOS DOCENTES UNIVERSITARIOS?",
    "options": [
      "a) Catedráticos/as de universidad, profesores/as titulares de universidad, catedráticos/as de escuela universitaria y profesores/as titulares de escuela universitaria.",
      "b) Catedráticos/as de universidad, catedráticos/as de escuela universitaria, profesores/as asociados/as y profesores/as visitantes.",
      "c) Catedráticos/as de universidad, catedráticos/as de escuela universitaria, titulares de universidad y eméritos/as.",
      "d) Profesores/as titulares de universidad, profesores/as titulares de escuela, maestros/as de taller y catedráticos/as de universidad"
    ],
    "correct": 0
  },
  {
    "question": "148. SEÑALE LA RESPUESTA CORRECTA:",
    "options": [
      "a) El IV Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2024/2028.",
      "b) El II Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2019/2022.",
      "c) El IV Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2019/2022.",
      "d) El III Plan de Igualdad de Mujeres y Hombres de la EHU abarca el periodo 2020/2023."
    ],
    "correct": 0
  },
  {
    "question": "149. LAS RELACIONES DE PUESTOS DE TRABAJO DEBERÁN INCLUIR:",
    "options": [
      "a) La totalidad de los existentes que se hallen dotados presupuestariamente.",
      "b) Sólo los reservados a personal funcionario que se hallen dotados presupuestariamente.",
      "c) Sólo los reservados a personal funcionario y personal laboral, excluidos los que se encuentren vacantes.",
      "d) La totalidad de los existentes, estén o no dotados presupuestariamente."
    ],
    "correct": 0
  },
  {
    "question": "150. LOS DELEGADOS Y DELEGADAS DE PREVENCIÓN SON",
    "options": [
      "a) Los/as responsables de diseñar los Planes de Emergencia.",
      "b) Junto con los/as Técnicos/as de Prevención planificarán anualmente la actividad preventiva.",
      "c) Los/as representantes de los/as trabajadores y trabajadoras de la Universidad en materia de Prevención y tendrán las competencias y derechos recogidos en la normativa sobre Prevención de Riesgos Laborales.",
      "d) Serán los/as responsables de gestionar los planes de Emergencia."
    ],
    "correct": 2
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
