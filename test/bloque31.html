<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 31 (preguntas 431-444)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "431. EL CONVENIO ESPECIAL CON LA SEGURIDAD SOCIAL TENDRÁ COMO OBJETO LA COBERTURA DE LAS PRESTACIONES CORRESPONDIENTES A:",
    "options": [
      "a) Entre otras, Invalidez permanente, muerte y supervivencia, derivadas de enfermedad común y accidente laboral.",
      "b) Entre otras, jubilación y servicios sociales.",
      "c) Entre otras, Invalidez transitoria, muerte y supervivencia, derivadas de enfermedad común y accidente no laboral.",
      "d) Entre otras, Invalidez permanente, muerte y supervivencia, derivadas de enfermedad profesional y accidente no laboral."
    ],
    "correct": 1
  },
  {
    "question": "432. SEÑALE LA AFIRMACIÓN CORRECTA:",
    "options": [
      "a) El plazo para la presentación de las solicitudes de alta en el Régimen General es de, como máximo, 3 días antes del inicio de la prestación.",
      "b) El plazo para la presentación de las solicitudes de baja en el Régimen General es de, como máximo, 3 días antes del fin de la prestación.",
      "c) El plazo para la presentación de las solicitudes de baja en el Régimen General es de, como máximo, 3 días posteriores al fin de la prestación.",
      "d) El plazo para la presentación de las solicitudes de alta en el Régimen General es de, como máximo, hasta 3 días después del inicio de la prestación."
    ],
    "correct": 2
  },
  {
    "question": "433. A EFECTOS DE AFILIACIÓN AL SISTEMA DE LA SEGURIDAD SOCIAL, INDIQUE LA SITUACIÓN QUE NO ESTÁ CONSIDERADA COMO ASIMILADA AL ALTA:",
    "options": [
      "a) Situación legal de desempleo, total y subsidiado, y la de paro involuntario una vez agotada la prestación contributiva o asistencial, siempre que se mantenga la inscripción como desempleado en la Oficina de Empleo.",
      "b) La excedencia forzosa.",
      "c) La situación de excedencia para el cuidado de hijos con reserva de puesto de trabajo, de acuerdo con la legislación aplicable.",
      "d) El desplazamiento del/de la trabajador/a fuera del territorio nacional tras un cambio voluntario de trabajo."
    ],
    "correct": 3
  },
  {
    "question": "434. ¿QUIÉNES SON LOS SUJETOS OBLIGADOS A LA COMUNICACIÓN DE LAS ALTAS, BAJAS Y VARIACIONES A LA SEGURIDAD SOCIAL EN EL RÉGIMEN GENERAL?",
    "options": [
      "a) La persona trabajadora, con el visto bueno de la parte empleadora",
      "b) La parte empleadora firmará en todo caso esas comunicaciones, quedando a voluntad del/de la trabajador/a la firma de conformidad con dichas comunicaciones",
      "c) La parte empleadora firmará y tramitará esas comunicaciones; las solicitudes de alta y variación de datos del trabajador por cuenta ajena deberán ir firmadas en todo caso por el trabajador.",
      "d) El alta y la baja ha de tramitarse necesariamente por el empresario; las variaciones pueden ser tramitadas por los representantes de los trabajadores, si así está previsto en el correspondiente Convenio Colectivo de Empresa."
    ],
    "correct": 2
  },
  {
    "question": "435. SEÑALE LA AFIRMACIÓN CORRECTA:",
    "options": [
      "a) Cuando el  trabajador se traslade a un centro de trabajo del mismo empresario situado en diferente provincia, deberá promoverse la baja en la provincia de procedencia y el alta en la de destino.",
      "b) A efectos de afiliación, no es necesario realizar ningún trámite ante la Seguridad Social cuando el/la trabajador/a se traslade a un centro de trabajo del mismo empresario situado en diferente provincia.",
      "c) A efectos de afiliación a la Seguridad Social, cuando el/la trabajador/a se traslade a un centro de trabajo del mismo empresario situado en diferente provincia, el empresario ha de tramitar una solicitud de variación en los datos.",
      "d) Corresponderá presentar una variación de datos cuando, por cualquier causa, proceda la adscripción del/de la trabajador/a a una cuenta de cotización distinta."
    ],
    "correct": 0
  },
  {
    "question": "436. CON CARÁCTER GENERAL, LOS EFECTOS DE LAS ALTAS SERÁN:",
    "options": [
      "a) Las altas presentadas con carácter previo a la prestación de los servicios únicamente surtirán efectos, en orden a los derechos y obligaciones inherentes a dicha situación, a partir del primer día del mes en el que se inicie la actividad.",
      "b) Las altas presentadas fuera de plazo sólo tendrán efectos desde el día en que se formule la solicitud, salvo que se haya producido ingreso de cuotas en plazo reglamentario, en cuyo caso el alta retrotraerá sus efectos a la fecha en que se hayan ingresado las primeras cuotas correspondientes al trabajador de que se trate.",
      "c) Las altas practicadas de oficio por las Direcciones Provinciales de la Tesorería General de la Seguridad Social o las Administraciones, tendrán sus efectos en la fecha en que las Resoluciones que las dicten adquieran firmeza.",
      "d) Las altas presentadas con carácter previo a la prestación de los servicios únicamente surtirán efectos anticipados si la persona empleada asume la cotización correspondiente al plazo entre la fecha de la comunicación y la fecha en la que se inicie la actividad."
    ],
    "correct": 1
  },
  {
    "question": "437. SEÑALE LA OPCIÓN INCORRECTA. CON CARÁCTER GENERAL, LOS EFECTOS DE LAS BAJAS DE AFILIACIÓN:",
    "options": [
      "a) La baja del/de la trabajador/a producirá efectos desde el cese en la prestación de los servicios por cuenta ajena, en la actividad por cuenta propia o, en su caso, en la situación determinante de su inclusión en el Régimen de que se trate.",
      "b) La solicitud de baja del/de la trabajador/a extinguirá la obligación de cotizar desde el cese en el trabajo.",
      "c) Si la baja se solicita fuera de plazo, pero en los 5 días hábiles siguientes al cese en el trabajo, la obligación de cotizar se extingue en todo caso ese día de cese; pasado el quinto día, la obligación de cotizar se extingue en el día en que la Tesorería General de la Seguridad Social conozca el cese en el trabajo por cuenta ajena, o en la actividad por cuenta propia.",
      "d) Cuando la Tesorería General de la Seguridad Social curse la baja de oficio, la obligación de cotizar se extinguirá desde el mismo día en que se haya llevado a cabo la actuación inspectora, o se hayan recibido los datos o documentos que acrediten el cese en el trabajo."
    ],
    "correct": 2
  },
  {
    "question": "438. DE LAS SIGUIENTES OPCIONES, INDIQUE LA QUE NO ES UNA PRESTACIÓN DE LA ACCIÓN PROTECTORA DE LA SEGURIDAD SOCIAL:",
    "options": [
      "a) Riesgo durante el embarazo.",
      "b) Riesgo durante la lactancia artificial.",
      "c) Nacimiento y cuidado de menor.",
      "d) Cuidado de menores afectados por cáncer u otra enfermedad grave."
    ],
    "correct": 1
  },
  {
    "question": "439. INDIQUE LA OPCIÓN CORRECTA:",
    "options": [
      "a) La Seguridad Social incluye, entre sus prestaciones, la compensación de los gastos de sepelio",
      "b) La Prestación temporal de viudedad de la Seguridad Social tiene una duración máxima de 1 año.",
      "c) Las personas beneficiarias de la pensión de orfandad son los descendientes menores de edad, salvo que concurra una discapacidad, en cuyo caso pensión se mantiene hasta los 25 años.",
      "d) La Seguridad Social prevé, en caso de muerte causada por accidente no laboral o enfermedad común, una indemnización a tanto alzado a determinados beneficiarios, además de la correspondiente pensión."
    ],
    "correct": 0
  },
  {
    "question": "440. SEÑALE LA OPCIÓN INCORRECTA. SEGÚN LA NORMATIVA DE LA SEGURIDAD SOCIAL, EL PERÍODO EN QUE SE PERMANEZCA EN LA SITUACIÓN DE EXCEDENCIA LABORAL PARA EL CUIDADO DEL MENOR A CARGO PRODUCE LOS SIGUIENTES EFECTOS:",
    "options": [
      "a) Será computable a efectos de antigüedad.",
      "b) Se tendrá derecho a la asistencia a cursos de formación profesional.",
      "c) A efecto de las prestaciones por desempleo, todo el período de excedencia tendrá la consideración de situación asimilada a la de alta.",
      "d) Durante los seis primeros meses, el trabajador tendrá derecho a la reserva de su puesto de trabajo; si se trata de familias numerosas, de cualquier categoría, el plazo se amplía a los primeros 15 meses."
    ],
    "correct": 3
  },
  {
    "question": "441. DE CONFORMIDAD CON LO ESTABLECIDO EN LA LEY GENERAL DE LA SEGURIDAD SOCIAL, SE ENTIENDE SUSPENDIDA LA OBLIGACIÓN DE COTIZAR:",
    "options": [
      "a) Mientras el/la trabajador/a disfrute de un permiso sin sueldo.",
      "b) En el supuesto de ejercicio del derecho de huelga por el/la trabajador/a.",
      "c) Durante la situación de incapacidad temporal del/de la trabajador/a.",
      "d) Todas las opciones anteriores son correctas."
    ],
    "correct": 1
  },
  {
    "question": "442. SEGÚN EL ARTÍCULO 42 DEL TEXTO REFUNDIDO DE LA LEY GENERAL DE LA SEGURIDAD SOCIAL (REAL DECRETO LEGISLATIVO 8/2015, DE 30 DE OCTUBRE), LA ACCIÓN PROTECTORA DEL SISTEMA DE LA SEGURIDAD SOCIAL COMPRENDE:",
    "options": [
      "a) La asistencia sanitaria en los casos de maternidad.",
      "b) La asistencia sanitaria de enfermedad común o profesional.",
      "c) La asistencia sanitaria de accidente, sea o no de trabajo.",
      "d) Todas las opciones anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "443. SON PRINCIPIOS ÉTICOS DE LA CONDUCTA DE LOS/AS EMPLEADOS/AS PÚBLICOS/AS:",
    "options": [
      "a) Principios de eficacia y cooperación",
      "b) Principios de lealtad y buena fe con la Administración en la que presten sus servicios, y con sus superiores, compañeros, subordinados y con los ciudadanos.",
      "c) Principios de eficiencia y concentración",
      "d) Todas las anteriores son correctas"
    ],
    "correct": 1
  },
  {
    "question": "444. INDIQUE CUAL NO ES UN PRINCIPIO GENERAL RECOGIDO EN REAL DECRETO 203/2021, DE 30 DE MARZO, POR EL QUE SE APRUEBA EL REGLAMENTO DE ACTUACIÓN Y FUNCIONAMIENTO DEL SECTOR PÚBLICO POR MEDIOS ELECTRÓNICOS.",
    "options": [
      "a) Principios de tecnología privativa y de vigilancia al progreso de las tecnologías y sistemas de comunicaciones electrónicas.",
      "b) Principio de accesibilidad.",
      "c) Principio de facilidad de uso.",
      "d) Principio de personalización y proactividad,"
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
