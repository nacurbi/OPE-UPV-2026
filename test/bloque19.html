<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 19 (preguntas 263-276)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "263. SEGÚN LA LEY  DE EMPLEO PÚBLICO VASCO, LA RESPONSABILIDAD DISCIPLINARIA NO SE EXTINGUE:",
    "options": [
      "a) Por el arrepentimiento de la persona infractora.",
      "b) Por la prescripción de la sanción.",
      "c) Por indulto.",
      "d) Por el cumplimiento de la sanción."
    ],
    "correct": 0
  },
  {
    "question": "264. ¿PUEDE EL PERSONAL TÉCNICO, DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS PARTICIPAR EN LOS ÓRGANOS DE GOBIERNO Y REPRESENTACIÓN DE LA EHU?",
    "options": [
      "a) No, sólo puede hacerlo el personal docente.",
      "b) Sí, siempre que tenga más de 5 años de servicios.",
      "c) Sí, conforme a los procedimientos de elección establecidos.",
      "d) Sí en los de representación, pero no en los de gobierno."
    ],
    "correct": 2
  },
  {
    "question": "265. ¿QUÉ IMPLICA LA TRANSPARENCIA DE LA ADMINISTRACIÓN?",
    "options": [
      "a) Identificación del personal de atención al público.",
      "b) Acceso a la información precisa",
      "c) Publicidad de los resultados.",
      "d) Todas las respuestas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "266. SEGÚN LA LEY 39/2015,  LOS/AS CIUDADANOS/AS TIENEN DERECHO A:",
    "options": [
      "a) Obtener copia de los documentos que presenten, quedando, en todo caso, los originales en el procedimiento de que se trate",
      "b) Obtener copia cotejada de los documentos que presenten, quedando, en todo caso, los originales en el procedimiento de que se trate",
      "c) A obtener copia de los documentos contenidos en los procedimientos en los que tengan la condición de interesados",
      "d) Ninguna de las anteriores respuestas es correcta."
    ],
    "correct": 2
  },
  {
    "question": "267. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, LOS/AS CIUDADANOS/AS TIENEN DERECHO A:",
    "options": [
      "a) Identificar a las autoridades y al personal al servicio de las Administraciones Públicas bajo cuya responsabilidad se tramiten los procedimientos",
      "b) No presentar documentos no exigidos por las normas aplicables al procedimiento de que se trate",
      "c) Ser tratados con respeto y deferencia por autoridades y funcionariado, que habrán de facilitarles el ejercicio de sus derechos y el cumplimiento de sus obligaciones",
      "d) Todas las respuestas anteriores son correctas"
    ],
    "correct": 3
  },
  {
    "question": "268. SEGÚN EL TEXTO REFUNDIDO DE LA LEY DEL ESTATUTO BÁSICO DEL EMPLEADO PÚBLICO, LOS/AS EMPLEADOS/AS PÚBLICOS DEBEN ACTUAR CON ARREGLO, ENTRE OTROS, AL SIGUIENTE PRINCIPIO, QUE INSPIRA SU CÓDIGO DE CONDUCTA:",
    "options": [
      "a) Integridad",
      "b) Austeridad",
      "c) Honradez",
      "d) Las tres respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "269. EN RELACIÓN CON EL DERECHO DE ACCESO A LA INFORMACIÓN PÚBLICA QUE OBRE EN PODER DE LAS ADMINISTRACIONES PÚBLICAS, SE ENTIENDE POR “INFORMACIÓN PÚBLICA”, DE ACUERDO CON LA LEY 19/2013, DE 9 DE DICIEMBRE, DE TRANSPARENCIA, ACCESO A LA INFORMACIÓN PÚBLICA Y BUEN GOBIERNO:",
    "options": [
      "a) Los contenidos o documentos, cualquiera que sea su formato o soporte, que hayan sido elaborados o adquiridos en el ejercicio de sus funciones",
      "b) Los contenidos o documentos, siempre en formato papel o digital, elaborados o adquiridos en el ejercicio de sus funciones",
      "c) Los contenidos o documentos, siempre en formato papel, elaborados o adquiridos en el ejercicio de sus funciones",
      "d) Sólo se refiere a la información contenida en formato papel, cualquiera que sea el origen de la misma."
    ],
    "correct": 0
  },
  {
    "question": "270. EL ARTÍCULO 13 DE LA LEY 39/2015, DE 1 DE OCTUBRE, DE PROCEDIMIENTO ADMINISTRATIVO COMÚN, RECOGE ENTRE LOS DERECHOS DE LAS PERSONAS EN SUS RELACIONES CON LAS ADMINISTRACIONES PÚBLICAS:",
    "options": [
      "a) A ser asistidos en el uso de medios electrónicos",
      "b) A utilizar las lenguas oficiales de la comunidad autónoma.",
      "c) A acceder a los registros y documentos.",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "271. INDIQUE LA OPCIÓN CORRECTA EN RELACIÓN A LA ACTUACIÓN Y FUNCIONAMIENTO DEL SECTOR PÚBLICO POR MEDIOS ELECTRÓNICOS.",
    "options": [
      "a) Las empresas privadas han de tener una sede electrónica si son adjudicatarias de algún servicio público de competencia de cualquiera de las administraciones públicas.",
      "b) Las sedes electrónicas siempre han de estar bajo la titularidad de una Administración Pública, aunque la gestión y administración puede ser subcontratada con empresas expertas en la materia.",
      "c) La sede electrónica de cada Administración ha de preservar la protección de datos personales de las personas usuarias; con ese objetivo, se constituirán sistemas informáticos cerrados sin ninguna conexión e interoperabilidad con las sedes de otras Administraciones Públicas.",
      "d) La titularidad de una sede electrónica ha de corresponder necesariamente a una Administración Pública o bien a uno o varios organismos públicos o entidades de derecho público en el ámbito de sus competencias."
    ],
    "correct": 3
  },
  {
    "question": "272. ¿CUAL DE LOS SIGUIENTES DOCUMENTOS UTILIZA LA CIUDADANÍA PARA HACER PETICIONES A LA ADMINISTRACIÓN?",
    "options": [
      "a) Circular",
      "b) Notificación",
      "c) Instancia",
      "d) Oficio"
    ],
    "correct": 2
  },
  {
    "question": "273. ¿EN CÚAL DE LOS SIGUIENTES DOCUMENTOS TIENE QUE CONSTAR LA FECHA?",
    "options": [
      "a) Instancia",
      "b) Notificación",
      "c) Certificación",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "274. EN LAS ACTAS SE CONSIGNA LA SIGUIENTE INFORMACIÓN EN RELACIÓN A LAS REUNIONES:",
    "options": [
      "a) Día de la reunión",
      "b) Lugar de la reunión",
      "c) Hora de finalización de la reunión",
      "d) Todas las respuestas son correctas"
    ],
    "correct": 3
  },
  {
    "question": "275. LA ADMINISTRACIÓN PÚBLICA EN SU RELACIÓN CON LA CIUDADANÍA TIENE QUE SER:",
    "options": [
      "a) Receptiva, accesible y transparente",
      "b) Receptiva y accesible pero no transparente",
      "c) Receptiva y transparente pero no accesible",
      "d) Ni receptiva ni accesible pero sí transparente"
    ],
    "correct": 0
  },
  {
    "question": "276. ¿QUÉ IMPLICA LA IDEA DE QUE LOS SERVICIOS QUE PRESTA LA ADMINISTRACIÓN PÚBLICA SON DE NATURALEZA UNIVERSAL?",
    "options": [
      "a) Que sirven para ciudadanos/as de todos los países",
      "b) Igualdad en el trato a todas las personas usuarias",
      "c) Segmentación del mercado público",
      "d) Que no tiene barreras físicas ni psíquicas"
    ],
    "correct": 1
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
