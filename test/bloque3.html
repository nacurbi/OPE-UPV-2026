<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 3 (preguntas 31-45)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 3 (preguntas 31-45)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "31. ¿QUÉ TIPOS DE INTEROPERABILIDAD SE DISTINGUEN EN EL ESQUEMA NACIONAL DE INTEROPERABILIDAD (ENI)?:",
    "options": [
      "a) Organizativa.",
      "b) Léxica.",
      "c) Técnica.",
      "d) Las respuestas a) y c) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "32. EN VIRTUD DEL PRINCIPIO DE RESERVA DE LEY:",
    "options": [
      "a) Un reglamento no puede regular determinadas materias para las cuales la Constitución exige una norma con rango de ley.",
      "b) Un reglamento no puede regular materias que, aunque la Constitución no exija para su regulación rango de ley, ya hayan sido reguladas por una norma de este rango.",
      "c) Una materia puede regularse mediante reglamento únicamente cuando haya sido recogido así en una norma habilitante con rango de ley.",
      "d) Tanto la a) como la b) son correctas."
    ],
    "correct": 3
  },
  {
    "question": "33. CONFORME A LA LEY 33/2003, DE 3 DE NOVIEMBRE, DEL PATRIMONIO DE LAS ADMINISTRACIONES PÚBLICAS, SEÑALE LA RESPUESTA INCORRECTA. LA GESTIÓN Y ADMINISTRACIÓN DE LOS BIENES Y DERECHOS DEMANIALES POR LAS ADMINISTRACIONES PÚBLICAS SE AJUSTARÁN A LOS SIGUIENTES PRINCIPIOS:",
    "options": [
      "a) Inalienabilidad.",
      "b) Inembargabilidad.",
      "c) Imprescriptibilidad.",
      "d) Dedicación preferente al uso privativo frente a su uso común."
    ],
    "correct": 3
  },
  {
    "question": "34. SEGÚN LO ESTABLECIDO EN LA LEY 11/2022, DE 1 DE DCIEMBRE DE EMPLEO PÚBLICO VASCO, LAS PERSONAS EMPLEADAS PÚBLICAS SON RESPONSABLES DE LA BUENA GESTIÓN DE LOS SERVICIOS ENCOMENDADOS:",
    "options": [
      "a) Sin perjuicio de la responsabilidad que corresponde a sus superiores jerárquicos.",
      "b) En todo momento deberán dar cuenta de las anomalías que hubieran observado en el servicio.",
      "c) Ambas respuestas son correctas.",
      "d) Ninguna respuesta es correcta"
    ],
    "correct": 2
  },
  {
    "question": "35. CONFORME A LA LEY 33/2003, DE 3 DE NOVIEMBRE, DEL PATRIMONIO DE LAS ADMINISTRACIONES PÚBLICAS, SEÑALE LA RESPUESTA INCORRECTA. LA GESTIÓN Y ADMINISTRACIÓN DE LOS BIENES Y DERECHOS PATRIMONIALES POR LAS ADMINISTRACIONES PÚBLICAS SE AJUSTARÁN A LOS SIGUIENTES PRINCIPIOS:",
    "options": [
      "a) Eficiencia y economía en su gestión.",
      "b) Eficacia y rentabilidad en la explotación de estos bienes y derechos.",
      "c) Publicidad, transparencia, concurrencia y objetividad en la adquisición, explotación y enajenación de estos bienes.",
      "d) Gestión y administración dirigida a la rentabilidad económica a través de transmisiones onerosas."
    ],
    "correct": 3
  },
  {
    "question": "36. SE CONSIDERA PATRIMONIO DE LA EHU:",
    "options": [
      "a) El conjunto de bienes cuya propiedad ostente la EHU.",
      "b) El conjunto de bienes y derechos cuya propiedad ostente la EHU.",
      "c) El conjunto de bienes y derechos cuya propiedad o titularidad ostente la EHU y cuantos otros adquiera o le sean atribuidos en el futuro.",
      "d) El conjunto de bienes cuya propiedad ostente la EHU y cuantos adquiera en el futuro."
    ],
    "correct": 2
  },
  {
    "question": "37. ADEMÁS DEL PATRIMONIO YA CONSTITUIDO PODRÁN INCORPORARSE:",
    "options": [
      "a) Las donaciones que se reciban según el procedimiento establecido por la EHU y el material inventariable que se adquiera.",
      "b) El material inventariable que se adquiera y el bibliográfico.",
      "c) Las donaciones que reciba, el material inventariable y el bibliográfico.",
      "d) Las donaciones que reciba, el material inventariable y el bibliográfico exceptuando las publicaciones periódicas."
    ],
    "correct": 2
  },
  {
    "question": "38. LA CONSERVACIÓN Y CORRECTA UTILIZACIÓN DEL PATRIMONIO DE LA EHU INCUMBE A:",
    "options": [
      "a) A toda la comunidad universitaria.",
      "b) Al Servicio de Patrimonio y Contratación.",
      "c) Al profesorado y PAS de la EHU.",
      "d) A los centros, departamentos y servicios."
    ],
    "correct": 0
  },
  {
    "question": "39. SEGÚN LA LEY 33/2003, DE 3 DE NOVIEMBRE, DEL PATRIMONIO DE LAS ADMINISTRACIONES PÚBLICAS, EL USO PRIVATIVO DE LOS BIENES DE DOMINIO PÚBLICO:",
    "options": [
      "a) determina la ocupación de una porción del dominio público, de modo que se limita o excluye la utilización del mismo por otros interesados.",
      "b) puede determinar la ocupación con obras o instalaciones fijas sin concesión administrativa.",
      "c) no es posible el uso privativo de los bienes de dominio público.",
      "d) corresponde por igual y de forma indistinta a todos los ciudadanos, de modo que el uso por unos no impide el de los demás interesados."
    ],
    "correct": 0
  },
  {
    "question": "40. SEGÚN LA LEY 33/2003, DE 3 DE NOVIEMBRE, DEL PATRIMONIO DE LAS ADMINISTRACIONES PÚBLICAS, EL APROVECHAMIENTO ESPECIAL DE LOS BIENES DE DOMINIO PÚBLICO, ASÍ COMO SU USO PRIVATIVO CUANDO LA OCUPACIÓN SE EFECTÚE ÚNICAMENTE CON INSTALACIONES DESMONTABLES:",
    "options": [
      "a) Es un aprovechamiento especial sujeto a concesión si la duración del aprovechamiento o uso excede de un año.",
      "b) Estarán sujetos a autorización o, si la duración del aprovechamiento o uso excede de cuatro años, a concesión.",
      "c) Deberá estar amparado por la correspondiente concesión administrativa.",
      "d) Podrá realizarse libremente, sin más limitaciones que las derivadas de su naturaleza."
    ],
    "correct": 1
  },
  {
    "question": "41. LOS PRECIOS PÚBLICOS DE LAS ENSEÑANZAS UNIVERSITARIAS OFICIALES LOS FIJARÁ:",
    "options": [
      "a) El Consejo de Gobierno de la universidad para las titulaciones que imparta.",
      "b) El Ministerio de Educación y Formación Profesional.",
      "c) La Comunidad Autónoma.",
      "d) El Consejo Social de la universidad."
    ],
    "correct": 2
  },
  {
    "question": "42. LA LOSU RECONOCE A LA UNIVERSIDAD COMO AGENTE CLAVE EN:",
    "options": [
      "a) La regulación del mercado laboral.",
      "b) La gestión sanitaria.",
      "c) La transferencia del conocimiento y la ciencia abierta.",
      "d) La universidad facilitará la compatibilidad en el ejercicio de la docencia y la investigación."
    ],
    "correct": 2
  },
  {
    "question": "43. ¿QUÉ BUSCA LA LOSU AL FOMENTAR LA COOPERACIÓN ENTRE UNIVERSIDADES?",
    "options": [
      "a) Competencia por recursos.",
      "b) Reducción de la oferta académica.",
      "c) Sinergias en docencia, investigación e innovación.",
      "d) Centralización de todos los servicios."
    ],
    "correct": 2
  },
  {
    "question": "44. ¿QUÉ PRINCIPIO RIGE LA FINANCIACIÓN UNIVERSITARIA SEGÚN LOSU?",
    "options": [
      "a) Competencia directa entre universidades.",
      "b) Financiación exclusivamente por matrícula.",
      "c) Financiación suficiente, estable y plurianual.",
      "d) Financiación condicionada a rankings internacionales"
    ],
    "correct": 2
  },
  {
    "question": "45. SEGÚN LA LEY 39/2015, DE 1 DE OCTUBRE, DEL PROCEDIMIENTO ADMINISTRATIVO COMÚN DE LAS ADMINISTRACIONES PÚBLICAS, EL EJERCICIO DE LA POTESTAD REGLAMENTARIA CORRESPONDE:",
    "options": [
      "a) Al Gobierno de la Nación, a los órganos de Gobierno de las Comunidades Autónomas y a los órganos de gobierno locales.",
      "b) Al Gobierno de la Nación y a los órganos de Gobierno de las Comunidades Autónomas, pero no a los órganos de gobiernos locales.",
      "c) Exclusivamente al Gobierno de la Nación.",
      "d) Solo al Gobierno de la Nación y a las Cortes Generales."
    ],
    "correct": 0
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
