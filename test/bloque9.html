<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bloque 9 (preguntas 121-135)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #F0F0F0;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        .contenedor-principal {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            padding: 5px 20px 20px 20px;
            z-index: 1;
        }

        section.contenedor-test, footer.rectangulo-resumen {
            background-color: white;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            max-width: 800px;
            text-align: center;
        }

        section.contenedor-test {
            border: 1px solid #2b2a7f;
        }

        .titulo-test {
            font-size: 24px;
            font-weight: bold;
            color: #6c757d;
            margin: 0 0 8px 0;
            text-align: center;
        }
        .subtitulo-test {
            font-size: 14px;
            color: #6c757d;
            margin: 0 0 20px 0;
            text-align: center;
            max-width: 800px;
        }

        .pregunta {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
            text-align: left;
            line-height: 1.5;
        }
        .opciones-contenedor {
            display: grid;
            gap: 2.5px;
            margin-bottom: 25px;
        }
        .opcion {
            background-color: white;
            border: none;
            color: #495057;
            padding: 15px;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s, border-color 0.2s;
            text-align: left;
        }
        .opcion:hover {
            background-color: #dee2e6;
        }
        .opcion.seleccionada {
            background-color: #cce5ff;
            border-color: #2b2a7f;
            color: #004085;
        }
        .opcion.correcta {
            background-color: #85d192;
            border-color: #85d192;
            color: #155724;
            cursor: default;
        }
        .opcion.incorrecta {
            background-color: #f0a1a8;
            border-color: #f0a1a8;
            color: #721c24;
            cursor: default;
        }
        .opcion.correcta:hover, .opcion.incorrecta:hover {
            background-color: #85d192;
            color: #155724;
            border-color: #85d192;
        }
        .opcion.incorrecta:hover {
            background-color: #f0a1a8;
            color: #721c24;
            border-color: #f0a1a8;
        }
        .navegacion-btn-contenedor {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
            width: 100%;
        }

        .comprobar-btn {
            background-color: #cce5ff;
            color: #004085;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .comprobar-btn:hover {
            background-color: #b3d7ff;
        }
        .hidden {
            display: none;
        }

        .navegacion-btn {
            background-color: #E0E0E0;
            color: #555;
            padding: 5px 10px;
            border: none;
            border-radius: 2px;
            font-size: 12px;
            width: 100px;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }
        .navegacion-btn:hover {
            background-color: #CFCFCF;
        }
        .navegacion-btn:disabled {
            background-color: #f1f1f1;
            color: #aaa;
            cursor: not-allowed;
            box-shadow: none;
        }
        footer.rectangulo-resumen {
            background-color: #F0F0F0;
            padding: 20px;
            border-radius: 2px;
            width: 800px;
            margin-top: 20px;
            overflow-y: auto;
        }
        .indices-contenedor {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        .indice-pregunta {
            width: 30px;
            height: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            background-color: white;
            cursor: pointer;
            transition: background-color 0.2s;
            color: #495057;
            font-weight: bold;
            font-size: 14px;
        }
        .indice-pregunta.activa {
            background-color: #cce5ff;
            color: #004085;
            border: none;
        }
        .indice-pregunta:hover {
            background-color: #dee2e6;
        }
        .indice-pregunta.correcta {
            background-color: #85d192;
            color: #155724;
        }
        .indice-pregunta.incorrecta {
            background-color: #f0a1a8;
            color: #495057;
        }

        .custom-modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }

        .custom-modal {
            background-color: white;
            padding: 30px;
            border-radius: 2px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .custom-modal h3 {
            margin-top: 0;
            color: #333;
        }

        .custom-modal button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 20px;
        }
        
        @media (max-width: 800px) {
            section.contenedor-test, footer.rectangulo-resumen {
                width: 95%;
                padding: 15px;
            }
            .opcion {
                padding: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="contenedor-principal">
        <h1 class="titulo-test">Bloque 9 (preguntas 121-135)</h1>
        <section class="contenedor-test">
            <article id="contenido-pregunta">
                <div class="pregunta" id="pregunta-texto"></div>
                <div class="opciones-contenedor" id="opciones-contenedor"></div>
                <div class="navegacion-btn-contenedor">
                    <button id="comprobar-btn" class="comprobar-btn">Comprobar</button>
                    <button id="siguiente-btn" class="navegacion-btn">Siguiente</button>
                </div>
            </article>
        </section>
        <footer class="rectangulo-resumen" id="rectangulo-resumen">
            <div class="indices-contenedor" id="indices-contenedor"></div>
        </footer>
    </div>

    <div id="custom-modal-overlay" class="custom-modal-overlay hidden">
        <div class="custom-modal">
            <p id="custom-modal-message"></p>
            <button id="custom-modal-ok">Aceptar</button>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let preguntas = [
  {
    "question": "121. DE ACUERDO CON EL ARTÍCULO 26 DEL REAL DECRETO 412/2014, DE 6 DE JUNIO, POR EL QUE SE ESTABLECE LA NORMATIVA BÁSICA DE LOS PROCEDIMIENTOS DE ADMISIÓN A LAS ENSEÑANZAS UNIVERSITARIAS OFICIALES DE GRADO, EXISTE UN PORCENTAJE DE PLAZAS RESERVADAS A ESTUDIANTES CON DISCAPACIDAD. ESTE PORCENTAJE ES:",
    "options": [
      "a) 3%",
      "b) 4%",
      "c) 5%",
      "d) 6%"
    ],
    "correct": 2
  },
  {
    "question": "122. EN RELACIÓN CON PERSONAS CON DISCAPACIDAD. SEÑALE LA AFIRMACIÓN CORRECTA:",
    "options": [
      "a) En las ofertas de empleo público se reservará un cupo no inferior al tres por ciento de las vacantes para ser cubiertas entre personas con discapacidad.",
      "b) El Estatuto Básico del Empleado Público no contempla ninguna medida respecto al acceso de las personas con discapacidad a la función pública.",
      "c) En las ofertas de empleo público podrá reservarse un cupo de vacantes para ser cubiertas entre personas con discapacidad. Cada Administración Pública determinará esa cantidad que no podrá ser inferior al 3% ni superior al 10% del total de plazas ofertadas.",
      "d) En las ofertas de empleo público se reservará un cupo no inferior al siete por ciento de las vacantes para ser cubiertas entre personas con discapacidad."
    ],
    "correct": 3
  },
  {
    "question": "123. ¿ QUIÉN TIENE COMPETENCIA PARA APROBAR EL REGLAMENTO DE UN CENTRO DOCENTE?",
    "options": [
      "a) La Junta de Centro.",
      "b) El Consejo de Dirección.",
      "c) La Junta de Campus.",
      "d) El Consejo de Gobierno."
    ],
    "correct": 3
  },
  {
    "question": "124. ¿QUIÉN NOMBRA A LOS/AS DECANOS/AS Y A LOS/AS DIRECTORES/AS DE LOS CENTROS?",
    "options": [
      "a) La Junta de Centro.",
      "b) El/ La Rector/a.",
      "c) El/la Vicerrector/a de Campus.",
      "d) El Gobierno Vasco."
    ],
    "correct": 1
  },
  {
    "question": "125. SEGÚN LOS ESTATUTOS DE LA EHU, LA PERSONA RESPONSABLE DE LA ORGANIZACIÓN Y GESTIÓN DE LOS SERVICIOS ADMINISTRATIVOS Y ECONÓMICOS DE LA EHU ES:",
    "options": [
      "a) La Rectora o el Rector",
      "b) La Gerente o el Gerente.",
      "c) El/la Vicerrector/a de Campus.",
      "d) El/la Vicegerente/a de Patrimonio y Contratación."
    ],
    "correct": 1
  },
  {
    "question": "126. ¿QUÉ ES LA PLANTILLA DE REFERENCIA DEL PERSONAL TÉCNICO, DE GESTIÓN Y ADMINISTRACIÓN Y SERVICIOS?",
    "options": [
      "a) Es un instrumento de gestión para los recursos humanos.",
      "b) Es un instrumento de planificación de los recursos humanos.",
      "c) Es un instrumento de control de los recursos humanos.",
      "d) Es un instrumento de valoración de puestos de trabajo."
    ],
    "correct": 1
  },
  {
    "question": "127. LAS SECCIONES DEPARTAMENTALES:",
    "options": [
      "a) Podrán constituirse únicamente en aquellos Departamentos que desarrollen sus actividades en distintos Campus. La creación o supresión de secciones requerirá la reforma del Reglamento.",
      "b) Podrán constituirse únicamente en aquellos Departamentos que desarrollen sus actividades en distintos Centros Docentes. La creación o supresión de secciones requerirá la reforma del Reglamento.",
      "c) Podrán constituirse en aquellos Departamentos que desarrollen sus actividades en distintos Campus. La creación o supresión de secciones no requerirá la reforma del Reglamento.",
      "d) Ninguna de las respuestas anteriores es correcta."
    ],
    "correct": 3
  },
  {
    "question": "128. CUÁL DE LAS SIGUIENTES AFIRMACIONES ES INCORRECTA RESPECTO AL CONSEJO DE ESTUDIANTES DE CAMPUS:",
    "options": [
      "a) Estará compuesto por dos representantes del alumnado de cada uno de los Centros Docentes pertenecientes al Campus.",
      "b) Lo integrarán, entre otros, la representación del alumnado del respectivo Campus en el Consejo de Gobierno.",
      "c) La representación de los Centros Docentes en este Consejo se elegirá por y de entre la representación del alumnado en la Junta de Centro.",
      "d) La o el Presidente de cada Consejo de Estudiantes de Campus integrará el Consejo de Estudiantes de la EHU."
    ],
    "correct": 0
  },
  {
    "question": "129. CUÁL DE LOS SIGUIENTES SE CONSIDERA UN ÓRGANO COLEGIADO DE GOBIERNO Y REPRESENTACIÓN DE LA EHU:",
    "options": [
      "a) El Consejo Jurídico.",
      "b) El Consejo Económico.",
      "c) El Consejo Sindical.",
      "d) El Consejo Permanente de la Escuela de Doctorado."
    ],
    "correct": 3
  },
  {
    "question": "130. EL CONSEJO DE GOBIERNO DICTARÁ LAS NORMAS REGULADORAS DE LAS CONVOCATORIAS DE CONCURSO DE ACCESO DE PROFESORADO:",
    "options": [
      "a) A propuesta del Vicerrector o Vicerrectora de Personal Docente e Investigador.",
      "b) A propuesta directa del Rector o Rectora.",
      "c) A propuesta del Consejo de Departamento correspondiente.",
      "d) A propuesta de la Comisión de Profesorado."
    ],
    "correct": 3
  },
  {
    "question": "131. LA APROBACIÓN DE LA NORMATIVA REGULADORA DE DOCTORADO Y SUS EFECTOS EN EL ENCARGO DOCENTE CORRESPONDE A:",
    "options": [
      "a) El Consejo de Gobierno, a propuesta del Consejo de Departamento correspondiente.",
      "b) La Comisión de Postgrado.",
      "c) La Comisión de Estudios de Doctorado.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 3
  },
  {
    "question": "132. CONSTITUYEN EL CONSEJO DE GOBIERNO DE LA EHU:",
    "options": [
      "a) 7 representantes del profesorado Doctor con vinculación permanente a la Universidad.",
      "b) 7 representantes del Personal de Administración y Servicios.",
      "c) 7 representantes de los Departamentos, Institutos y Escuelas de Doctorado.",
      "d) Ninguna de las opciones anteriores es correcta."
    ],
    "correct": 2
  },
  {
    "question": "133. CON RELACIÓN AL PERSONAL EVENTUAL:",
    "options": [
      "a) Su nombramiento y cese son libres.",
      "b) Es personal con carácter no permanente.",
      "c) Sólo realiza funciones expresamente calificadas como de confianza o asesoramiento especial.",
      "d) Las tres respuestas anteriores son correctas."
    ],
    "correct": 3
  },
  {
    "question": "134. LA COMISIÓN DE PROFESORADO DE LA EHU:",
    "options": [
      "a) Estará presidida por el Decano o la Decana de Facultad de mayor antigüedad en la EHU.",
      "b) Estará presidida por el Vicerrector o Vicerrectora de Personal Docente e Investigador.",
      "c) Estará presidida por el Rector o la Rectora.",
      "d) Estará compuesta por 10 personas del profesorado permanente doctor con, al menos, 10 años de experiencia, pertenecientes a diferentes áreas de conocimiento."
    ],
    "correct": 2
  },
  {
    "question": "135. EN RELACIÓN AL PROFESORADO FUNCIONARIO DE LA EHU, LAS RECLAMACIONES PLANTEADAS POR DIVERGENCIAS FRENTE AL HORARIO Y CALENDARIO ACADÉMICOS SERÁN ESTUDIADAS Y RESUELTAS POR:",
    "options": [
      "a) El Consejo de Departamento.",
      "b) El Consejo Social.",
      "c) El Decano o la Decana de Facultad o Director o Directora de Escuela.",
      "d) El Consejo de Gobierno."
    ],
    "correct": 3
  }
];
            let DOM = {};

            const estado = {
                preguntaActual: 0,
                respuestasCorrectas: 0,
                respuestasIncorrectas: 0,
                totalPreguntas: preguntas.length
            };

            let botonesOpciones;
            let indicesPreguntas;

            function toggleClasses(element, addClass, removeClasses) {
                if (removeClasses && removeClasses.length > 0) {
                    removeClasses.forEach(cls => element.classList.remove(cls));
                }
                if (addClass) {
                    element.classList.add(addClass);
                }
            }

            function mostrarModal(message) {
                DOM.modalMessage.textContent = message;
                DOM.modalOverlay.classList.remove('hidden');
            }

            function ocultarModal() {
                DOM.modalOverlay.classList.add('hidden');
            }

            function marcarRespuesta(index) {
                const pregunta = preguntas[index];

                const botonCorrecto = botonesOpciones[pregunta.correct];
                const indiceCorrecto = indicesPreguntas[index];

                toggleClasses(indiceCorrecto, null, ['correcta', 'incorrecta']);

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonCorrecto, 'correcta');

                    if (pregunta.esCorrecta) {
                        toggleClasses(indiceCorrecto, 'correcta');
                    } else {
                        const botonSeleccionado = botonesOpciones[pregunta.respuestaUsuario];
                        toggleClasses(botonSeleccionado, 'incorrecta');
                        toggleClasses(indiceCorrecto, 'incorrecta');
                    }
                }
            }

            function mostrarPregunta() {
                const pregunta = preguntas[estado.preguntaActual];
                DOM.preguntaTexto.textContent = pregunta.question;

                botonesOpciones.forEach((boton, index) => {
                    toggleClasses(boton, null, ['seleccionada', 'correcta', 'incorrecta']);
                    boton.textContent = pregunta.options[index];
                    boton.disabled = pregunta.comprobada;
                });

                if (pregunta.respuestaUsuario !== null) {
                    toggleClasses(botonesOpciones[pregunta.respuestaUsuario], 'seleccionada');
                    if (pregunta.comprobada) {
                        marcarRespuesta(estado.preguntaActual);
                    }
                }

                if (indicesPreguntas) {
                    indicesPreguntas.forEach(indice => indice.classList.remove('activa'));
                    indicesPreguntas[estado.preguntaActual].classList.add('activa');
                }

                DOM.comprobarBtn.classList.toggle('hidden', pregunta.comprobada);
                actualizarEstadoBotones();
            }

            function manejarSeleccion(event) {
                const boton = event.target.closest('.opcion');
                if (boton) {
                    const pregunta = preguntas[estado.preguntaActual];
                    if (!pregunta.comprobada) {
                        botonesOpciones.forEach(b => toggleClasses(b, null, ['seleccionada']));
                        toggleClasses(boton, 'seleccionada');
                        pregunta.respuestaUsuario = parseInt(boton.dataset.index);
                    }
                }
            }

            function comprobarRespuesta() {
                const pregunta = preguntas[estado.preguntaActual];
                if (pregunta.respuestaUsuario === null) {
                    mostrarModal('Por favor, selecciona una respuesta antes de comprobar.');
                    return;
                }

                pregunta.comprobada = true;
                pregunta.esCorrecta = (pregunta.respuestaUsuario === pregunta.correct);

                if (pregunta.esCorrecta) {
                    estado.respuestasCorrectas++;
                } else {
                    estado.respuestasIncorrectas++;
                }

                marcarRespuesta(estado.preguntaActual);
                actualizarResumen();

                botonesOpciones.forEach(boton => boton.disabled = true);
                DOM.comprobarBtn.classList.add('hidden');
            }

            function actualizarEstadoBotones() {
                const esUltimaPregunta = estado.preguntaActual === estado.totalPreguntas - 1;
                DOM.siguienteBtn.disabled = esUltimaPregunta;
            }

            function siguientePregunta() {
                if (estado.preguntaActual < estado.totalPreguntas - 1) {
                    estado.preguntaActual++;
                    mostrarPregunta();
                }
            }


            function crearIndices() {
                DOM.indicesContenedor.innerHTML = Array.from(
                    {length: estado.totalPreguntas},
                    (_, i) => `<div class="indice-pregunta" data-index="${i}">${i+1}</div>`
                ).join('');
                indicesPreguntas = DOM.indicesContenedor.querySelectorAll('.indice-pregunta');
            }

            function manejarClickIndice(event) {
                const indice = event.target.closest('.indice-pregunta');
                if (indice) {
                    estado.preguntaActual = parseInt(indice.dataset.index);
                    mostrarPregunta();
                }
            }

            function actualizarResumen() {
                indicesPreguntas.forEach((indice, index) => {
                    toggleClasses(indice, null, ['correcta', 'incorrecta']);
                    const pregunta = preguntas[index];
                    if (pregunta.comprobada) {
                        if (pregunta.esCorrecta) {
                            toggleClasses(indice, 'correcta');
                        } else {
                            toggleClasses(indice, 'incorrecta');
                        }
                    }
                });
            }


            function cacheElements() {
                return {
                    preguntaTexto: document.getElementById('pregunta-texto'),
                    opcionesContenedor: document.getElementById('opciones-contenedor'),
                    siguienteBtn: document.getElementById('siguiente-btn'),
                    comprobarBtn: document.getElementById('comprobar-btn'),
                    indicesContenedor: document.getElementById('indices-contenedor'),
                    contenedorTest: document.querySelector('section.contenedor-test'),
                    rectanguloResumen: document.querySelector('footer.rectangulo-resumen'),
                    modalOverlay: document.getElementById('custom-modal-overlay'),
                    modalMessage: document.getElementById('custom-modal-message'),
                    modalOkBtn: document.getElementById('custom-modal-ok'),
                    contenidoPregunta: document.getElementById('contenido-pregunta')
                };
            }

            function initData() {
                preguntas = preguntas.map(p => ({
                    ...p,
                    respuestaUsuario: null,
                    comprobada: false,
                    esCorrecta: false
                }));

                const fragmentoOpciones = document.createDocumentFragment();
                for (let i = 0; i < 4; i++) {
                    const boton = document.createElement('button');
                    boton.className = 'opcion';
                    boton.dataset.index = i;
                    fragmentoOpciones.appendChild(boton);
                }
                DOM.opcionesContenedor.appendChild(fragmentoOpciones);

                botonesOpciones = Array.from(DOM.opcionesContenedor.querySelectorAll('.opcion'));

                crearIndices();
            }

            function setupEvents() {
                DOM.contenedorTest.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.id === 'siguiente-btn') {
                        siguientePregunta();
                    } else if (target.id === 'comprobar-btn') {
                        comprobarRespuesta();
                    } else if (target.classList.contains('opcion')) {
                        manejarSeleccion(event);
                    }
                });

                DOM.rectanguloResumen.addEventListener('click', (event) => {
                    const target = event.target;
                    if (target.classList.contains('indice-pregunta')) {
                        manejarClickIndice(event);
                    }
                });

                DOM.modalOkBtn.addEventListener('click', ocultarModal);
            }

            function init() {
                DOM = cacheElements();
                initData();
                setupEvents();
                mostrarPregunta();
            }

            init();
        });
    </script>
</body>
</html>
